}

async function _importStep2(rawRows){
  const mo=document.getElementById('importModal');
  mo.innerHTML=`<div class="modal" style="max-width:700px"><div class="modal-body" style="padding:40px;text-align:center;color:var(--text-muted)">A analisar...</div></div>`;

  const grouped=_groupFaturacaoRows(rawRows);

  // Normalize string: remove accents, lowercase, trim
  const _norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();

  // Load CRM data — correct column names: Nome, NIF, Status, Faturar a, NIF Faturação
  const [cliRes,pagRes]=await Promise.all([
    _SB.from('clientes').select('Nome,NIF,Status,"Faturar a","NIF Faturação"'),
    _SB.from('pag_clientes_2026').select('Cliente,Mês,Estado')
  ]);
  const clientes=cliRes.data||[];
  const pagExist=pagRes.data||[];

  // Build lookup maps: by NIF, by name (normalized), by "Faturar a" name (normalized), by NIF Faturação
  const cliByNIF=new Map();
  const cliByNome=new Map();
  const cliByFaturarA=new Map();
  const cliByNIFFat=new Map();
  clientes.forEach(c=>{
    if(c['NIF']&&c['NIF'].trim()) cliByNIF.set(c['NIF'].trim(), c);
    if(c['Nome']) cliByNome.set(_norm(c['Nome']), c);
    if(c['Faturar a']&&c['Faturar a'].trim()) cliByFaturarA.set(_norm(c['Faturar a']), c);
    if(c['NIF Faturação']&&c['NIF Faturação'].trim()) cliByNIFFat.set(c['NIF Faturação'].trim(), c);
  });

  const _findCli=(nif,nome)=>
    cliByNIF.get(nif) ||
    cliByNIFFat.get(nif) ||
    cliByNome.get(_norm(nome)) ||
    cliByFaturarA.get(_norm(nome));

  const errors=[];
  const warnings=[];
  const valid=[];

  grouped.forEach((entry,key)=>{
    const crmCli=_findCli(entry.NIF, entry.Nome);
    if(!crmCli){
      warnings.push({type:'not_found', ...entry, msg:`NIF ${entry.NIF} / "${entry.Nome}" não encontrado no CRM`});
      return;
    }
    const status=crmCli['Status']||'';
    const crmNome=crmCli['Nome']||'';
    if(['Suspenso','Cancelado'].includes(status)){
      warnings.push({type:'susp_canc', ...entry, crmEstado:status, crmNome, msg:`Cliente ${status} mas aparece na faturação`});
      return;
    }
    const alreadyExists=pagExist.some(p=>
      _norm(p['Cliente']||'')===_norm(crmNome) && p['Mês']===entry.mesKey
    );
    if(alreadyExists){
      warnings.push({type:'duplicate', ...entry, crmNome, msg:`Já existe registo para ${crmNome} em ${entry.mesKey}`});
      return;
    }
    valid.push({...entry, crmNome});
  });

  // Find active CRM clients with active services missing from billing
  const servRes=await _SB.from('servicos').select('Cliente,"Estado do serviço"');
  const servData=servRes.data||[];
  const activeServClients=new Set(
    servData.filter(s=>['Ativo','Em curso'].includes(s['Estado do serviço']||''))
            .map(s=>_norm(s['Cliente']||''))
  );
  const groupedArr=[...grouped.values()];
  window._faturacaoValid=valid;
  window._faturacaoSuspCanc=warnings.filter(w=>w.type==='susp_canc');

  clientes.filter(c=>['Ativo','Híbrido ativo'].includes(c['Status']||'')).forEach(c=>{
    const nome=c['Nome']||'';
    const nomeN=_norm(nome);
    if(!activeServClients.has(nomeN)) return;
    const nif=(c['NIF']||'').trim();
    const nifFat=(c['NIF Faturação']||'').trim();
    const faturarAN=_norm(c['Faturar a']||'');
    const inBilling=
      (nif    && groupedArr.some(e=>e.NIF===nif))    ||
      (nifFat && groupedArr.some(e=>e.NIF===nifFat)) ||
      groupedArr.some(e=>_norm(e.Nome)===nomeN)       ||
      (faturarAN && groupedArr.some(e=>_norm(e.Nome)===faturarAN));
    if(!inBilling){
      errors.push({type:'missing', crmNome:nome, msg:`Cliente ativo com serviços mas ausente da faturação`});
    }
  });

  // Render step 2
  const errHtml = errors.length===0 ? '' : `
    <div style="margin-bottom:16px">
      <div style="font-weight:700;color:var(--danger);margin-bottom:8px">🚨 Erros (${errors.length}) — Requer atenção</div>
      <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
        <table class="tbl" style="font-size:12px"><thead><tr><th>Tipo</th><th>Cliente</th><th>Mês</th><th>Valor</th><th>Mensagem</th></tr></thead><tbody>
        ${errors.map(e=>`<tr>
          <td><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:${e.type==='missing'?'var(--warning-bg,#fff3cd);color:#856404':'var(--danger-light,#f8d7da);color:#721c24'}">${e.type==='missing'?'Ausente':'Suspenso/Cancelado'}</span></td>
          <td>${e.crmNome||e.Nome||'—'}</td>
          <td>${e.mesKey||'—'}</td>
          <td>${e.total!=null?e.total.toFixed(2)+'€':'—'}</td>
          <td style="color:var(--text-muted);font-size:11px">${e.msg}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;

  const warnHtml = warnings.length===0 ? '' : `
    <div style="margin-bottom:16px">
      <div style="font-weight:700;color:var(--warning,#856404);margin-bottom:8px">⚠️ Avisos (${warnings.length})</div>
      <div style="max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
        <table class="tbl" style="font-size:12px"><thead><tr><th>Tipo</th><th>Cliente</th><th>Mês</th><th>Valor</th><th>Mensagem</th></tr></thead><tbody>
        ${warnings.map(e=>`<tr>
          <td><span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning-bg,#fff3cd);color:#856404">${e.type==='duplicate'?'Duplicado':e.type==='susp_canc'?'Suspenso/Cancelado':'Não encontrado'}</span></td>
          <td>${e.crmNome||e.Nome||'—'}</td>
          <td>${e.mesKey||'—'}</td>
          <td>${e.total!=null?e.total.toFixed(2)+'€':'—'}</td>
          <td style="color:var(--text-muted);font-size:11px">${e.msg}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      ${warnings.some(w=>w.type==='susp_canc')?`<label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="include-susp"> Incluir suspensos/cancelados (verificar período)</label>`:''}
    </div>`;

  const validSummary = valid.length===0
    ? `<div style="color:var(--text-muted);font-style:italic">Nenhum registo válido para importar.</div>`
    : `<div style="color:var(--success,green);font-weight:600;margin-bottom:4px">✓ ${valid.length} registo(s) válido(s) prontos a importar</div>
       <div style="max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
         <table class="tbl" style="font-size:12px"><thead><tr><th>Cliente</th><th>Mês</th><th>Valor</th></tr></thead><tbody>
         ${valid.map(v=>`<tr><td>${v.crmNome}</td><td>${v.mesKey}</td><td>${v.total.toFixed(2)}€</td></tr>`).join('')}
         </tbody></table>
       </div>`;

  mo.innerHTML=`
    <div class="modal" style="max-width:720px">
      <div class="modal-header"><h2>Centro de Erros — Revisão</h2><button class="modal-close" onclick="closeImportModal()">×</button></div>
      <div class="modal-body" style="padding:24px;max-height:70vh;overflow-y:auto">
        ${errHtml}${warnHtml}
        <div>
          <div style="font-weight:700;margin-bottom:8px">Registos a importar</div>
          ${validSummary}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeImportModal()">Cancelar</button>
        <button class="btn btn-ghost" onclick="openImportFaturacao()">← Voltar</button>
        ${valid.length>0?`<button class="btn btn-primary" onclick="_importStep3Exec()">Importar ${valid.length} registos →</button>`:''}
      </div>
    </div>`;
}

function _importStep3Exec(){
  const list=[...(window._faturacaoValid||[])];
  if(document.getElementById('include-susp')?.checked) list.push(...(window._faturacaoSuspCanc||[]));
  _importStep3(list);
}

async function _importStep3(validList){
  const mo=document.getElementById('importModal');
  mo.innerHTML=`<div class="modal" style="max-width:480px"><div class="modal-body" style="padding:40px;text-align:center;color:var(--text-muted)">A importar...</div></div>`;
  const rows=validList.map(v=>({
    'Cliente':v.crmNome,
    'Mês':v.mesKey,
    'Estado':'Ativo',
    'Valor Pago':0,
    'Valor a Pagar':v.total
  }));
  const {error}=await _SB.from('pag_clientes_2026').insert(rows);
  if(error){
    mo.innerHTML=`<div class="modal" style="max-width:480px">
      <div class="modal-header"><h2>Erro na Importação</h2><button class="modal-close" onclick="closeImportModal()">×</button></div>
      <div class="modal-body" style="padding:24px;color:var(--danger)">${error.message}</div>
      <div class="modal-footer"><button class="btn btn-primary" onclick="closeImportModal()">Fechar</button></div>
    </div>`;
    return;
  }
  // Invalidate cache and refresh
  delete sectionData['pag_clientes_2026'];
  mo.innerHTML=`<div class="modal" style="max-width:480px">
    <div class="modal-header"><h2>Importação Concluída</h2><button class="modal-close" onclick="closeImportModal()">×</button></div>
    <div class="modal-body" style="padding:24px;text-align:center">

function toggleFilterOrd(section,col,ev){
  ev.stopPropagation();
  if(!sectionFilterOrd[section]) sectionFilterOrd[section]={};
  const cur=sectionFilterOrd[section][col]||'asc';
  // Colunas de nome: ciclo asc → date → asc
  const isNameCol=['Nome','Nome / Empresa','Nome Oficial','Contacto','Cliente'].includes(col);
  if(isNameCol) sectionFilterOrd[section][col]= cur==='asc'?'date':'asc';
  else          sectionFilterOrd[section][col]= cur==='asc'?'desc':'asc';
  sectionPage[section]=0;
  const sec=SECTIONS[section]||{title:section};
  const data=sectionData[section]||[];

function _fmtCellVal(v){
  if(v===null||v===undefined||v==='') return '';
  const s=String(v);
  // ISO datetime: 2025-07-17T00:00:00 or 2025-07-17T00:00:00.000Z → DD/MM/YYYY
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    const [y,m,d]=s.slice(0,10).split('-');
    return `${d}/${m}/${y}`;
  }
  // ISO date only: 2025-07-17 → DD/MM/YYYY
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,m,d]=s.split('-');
    return `${d}/${m}/${y}`;
  }
  // Excel serial date (e.g. 46023) → DD/MM/YYYY
  if(/^\d{4,5}$/.test(s)){
    const n=Number(s);
    if(n>25000&&n<60000){
      const d=new Date(Math.round((n-25569)*86400000));
      const dd=String(d.getUTCDate()).padStart(2,'0');
      const mm=String(d.getUTCMonth()+1).padStart(2,'0');
      const yyyy=d.getUTCFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }
  }
  return s;
}

function renderTable(el,section,sec,data,allCols){
  const page=sectionPage[section]||0;
  const search=(document.getElementById('search_'+section)||{}).value||'';
  const colFilters=sectionFilters[section]||{};
  const hasColFilters=Object.values(colFilters).some(v=>v);

  let filtered=data;
  if(search){
    const q=search.toLowerCase();
    filtered=data.filter(r=>Object.values(r).some(v=>v&&String(v).toLowerCase().includes(q)));
  }
  // Aplicar filtros por coluna — match exacto (valores vêm de dropdown)
  if(hasColFilters){
    filtered=filtered.filter(r=>Object.entries(colFilters).every(([col,val])=>{
      if(!val) return true;
      return String(r[col]??'') === val;
    }));
  }

  // Aplicar ordenação por coluna (sectionFilterOrd)
  const ordMap=sectionFilterOrd[section]||{};
  if(Object.keys(ordMap).length>0){
    // Ordenar apenas pela primeira coluna com ordem definida
    for(const [sortCol,sortDir] of Object.entries(ordMap)){
      if(!sortDir) continue;
      filtered=[...filtered].sort((a,b)=>{
        const va=String(a[sortCol]??''), vb=String(b[sortCol]??'');
        if(sortDir==='date'){
          // ordem de criação = ordem original no array data
          return data.indexOf(a)-data.indexOf(b);
        }
        const aNum=!isNaN(Number(va))&&va!=='', bNum=!isNaN(Number(vb))&&vb!=='';
        let cmp;
        if(aNum&&bNum) cmp=Number(va)-Number(vb);
        else cmp=va.localeCompare(vb,'pt',{sensitivity:'base'});
        return sortDir==='desc'?-cmp:cmp;
      });
      break; // só uma coluna de sort de cada vez
    }
  }

  const totalPages=Math.ceil(filtered.length/PER_PAGE);
  const pageData=filtered.slice(page*PER_PAGE,(page+1)*PER_PAGE);

  // Linha de cabeçalho com filtros inline
  const STATUS_ORDER=['Ativo','Em curso','Pendente','Agendado','Em Análise','Suspenso','Cancelado','Perdido','Não Avançou','Fechada','Aberta','Convertido'];
  const withFilters=data.length>0 && sec.columnFilters!==false;
  const thHtml=allCols.map(c=>{
    if(!withFilters) return `<th>${c}</th>`;

    const id=cfId(section,c);
    const cur=colFilters[c]||'';
    const colEsc=c.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

    // Valores únicos desta coluna a partir de TODOS os dados (não só filtrados)
    const raw=[...new Set(
      data.map(r=>{ const v=r[c]; return (v===null||v===undefined||v==='')?null:String(v); })
          .filter(v=>v!==null&&v!=='None'&&v!=='null'&&v!=='undefined')
    )];

    // Ordenação automática por tipo de coluna
    const colLow=c.toLowerCase();
    const isStatusCol=colLow.includes('status')||colLow.includes('estado')||colLow.includes('resultado')||colLow==='aberta/fechada';
    const allNum=raw.length>0&&raw.every(v=>v!==''&&!isNaN(Number(v)));
    const allDate=raw.length>0&&raw.every(v=>/^\d{4}-\d{2}-\d{2}/.test(v));

    if(isStatusCol){
      raw.sort((a,b)=>{
        const ia=STATUS_ORDER.indexOf(a),ib=STATUS_ORDER.indexOf(b);
        if(ia===-1&&ib===-1) return a.localeCompare(b,'pt',{sensitivity:'base'});
        if(ia===-1) return 1; if(ib===-1) return -1;
        return ia-ib;
      });
    } else if(allNum){
      raw.sort((a,b)=>Number(a)-Number(b));
    } else if(allDate){
      raw.sort();
    } else {
      raw.sort((a,b)=>a.localeCompare(b,'pt',{sensitivity:'base'}));
    }

    const opts=raw.map(v=>`<option value="${v.replace(/"/g,'&quot;')}"${v===cur?' selected':''}>${v}</option>`).join('');

    // Ordenação integrada no nome da coluna (só para colunas não-status)
    const curOrd=ordMap[c]||'';
    const isNameCol=['Nome','Nome / Empresa','Nome Oficial','Contacto','Cliente'].includes(c);
    const sortInd=curOrd==='desc'?' ↓':curOrd==='date'?' ':curOrd==='asc'?' ↑':'';
    const colLabel=isStatusCol
      ? `<span>${c}</span>`
      : `<span class="sort-label${curOrd?' on':''}" onclick="toggleFilterOrd('${section}','${colEsc}',event)" title="${isNameCol?'Ordem alfabética / criação':'Ordenar'}" style="cursor:pointer;user-select:none">${c}${sortInd}</span>`;

    return `<th>${colLabel}<select id="${id}" class="cfi${cur?' on':''}" onchange="doColumnFilter('${section}','${colEsc}',this.value)"><option value=""></option>${opts}</select></th>`;
  }).join('')+'<th>Ações</th>';
  let tbHtml='';
  for(let i=0;i<pageData.length;i++){
    const r=pageData[i];
    const realIdx=data.indexOf(r);
    let cells=allCols.map(c=>{
      let v=r[c];
      if(v===null||v===undefined){
        const lc=c.toLowerCase();
        for(const k of Object.keys(r)){if(k.toLowerCase()===lc||k.toLowerCase().includes(lc)){v=r[k];break;}}
      }
      if(v===null||v===undefined) v='';
      // Coluna Status: separar estado base do aviso (clientes) ou badge ON (pipeline)
      if(c==='Status' && section==='clientes'){
        return `<td title="${String(v).replace(/"/g,'&quot;')}">${renderStatusBadges(v)}</td>`;
      }
      if(c==='Status' && section==='pipeline'){
        return `<td>${onStatusBadge(String(v))}</td>`;
      }
      // Dias s/ Contacto: em pausa para clientes PT/DUO
      if(c==='Dias s/ Contacto' && section==='clientes'){
        if(r['_ContactoPausa']) return `<td><span style="color:var(--text-muted);font-size:12px">⏸ PT</span></td>`;
        if(v===''||v===null||v===undefined) return `<td style="color:var(--text-muted)">—</td>`;
        const n=Number(v);
        const cor = n>60?'var(--danger)':n>30?'var(--warning)':'';
        return `<td style="text-align:right${cor?';color:'+cor+';font-weight:600':''}">${n}d</td>`;
      }
      const disp=_fmtCellVal(v);
      return `<td title="${String(v).replace(/"/g,'&quot;')}">${disp}</td>`;
    }).join('');
    if(section==='clientes'){
      const nome=r['Nome']||'';
      cells+=`<td class="actions">
        <button onclick="event.stopPropagation();openClienteDetalhe('${nome.replace(/'/g,"\\'")}');" title="Ver Ficha">&#x1f464;</button>
        <button onclick="event.stopPropagation();openEdit('${section}',${realIdx})" title="Editar">&#x270F;</button>
        <button class="del" onclick="event.stopPropagation();deleteRec('${section}',${realIdx})" title="Eliminar">&#x1f5d1;</button>
      </td>`;
      tbHtml+=`<tr style="cursor:pointer" onclick="openClienteDetalhe('${nome.replace(/'/g,"\\'")}');">${cells}</tr>`;
    } else if(section==='pipeline'){
      const nON = r['Nº ON']||'';
      const onclickRow = nON ? `openONDetalhe(${nON})` : `openEdit('pipeline',${realIdx})`;
      cells+=`<td class="actions">
        ${nON?`<button onclick="event.stopPropagation();openONDetalhe(${nON});" title="Ver ON">&#x1f4cb;</button>`:''}
        <button onclick="event.stopPropagation();openEdit('${section}',${realIdx})" title="Editar">&#x270F;</button>
        <button class="del" onclick="event.stopPropagation();deleteRec('${section}',${realIdx})" title="Eliminar">&#x1f5d1;</button>
      </td>`;
      tbHtml+=`<tr style="cursor:pointer" onclick="${onclickRow}">${cells}</tr>`;
    } else if(section==='dados_colaboradores'){
      const nomeCol=r['Nome Oficial']||'';
      const nomeEsc=nomeCol.replace(/'/g,"\\'");
      cells+=`<td class="actions">
        <button onclick="event.stopPropagation();openColaboradorDetalhe('${nomeEsc}')" title="Ver Ficha">&#x1f464;</button>
        <button onclick="event.stopPropagation();openEdit('${section}',${realIdx})" title="Editar">&#x270F;</button>
        <button class="del" onclick="event.stopPropagation();deleteRec('${section}',${realIdx})" title="Eliminar">&#x1f5d1;</button>
      </td>`;
      tbHtml+=`<tr style="cursor:pointer" onclick="openColaboradorDetalhe('${nomeEsc}')">${cells}</tr>`;
    } else {
      cells+=`<td class="actions">
        <button onclick="openEdit('${section}',${realIdx})" title="Editar">&#x270F;</button>
        <button class="del" onclick="deleteRec('${section}',${realIdx})" title="Eliminar">&#x1f5d1;</button>
      </td>`;
      tbHtml+=`<tr>${cells}</tr>`;
    }
  }
  let pagHtml='';
  if(totalPages>1){
    pagHtml+=`<button ${page===0?'disabled':''} onclick="changePage('${section}',${page-1})">&laquo;</button>`;
    for(let p=0;p<totalPages&&p<10;p++) pagHtml+=`<button class="${p===page?'active':''}" onclick="changePage('${section}',${p})">${p+1}</button>`;
    if(totalPages>10) pagHtml+=`<span style="color:var(--text-muted)">...${totalPages}</span>`;
    pagHtml+=`<button ${page>=totalPages-1?'disabled':''} onclick="changePage('${section}',${page+1})">&raquo;</button>`;
  }
  const filterBadge = hasColFilters
    ? `<span class="filter-active-badge">Filtros activos <button onclick="clearColumnFilters('${section}')" style="background:none;border:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0 0 0 2px" title="Limpar filtros"></button></span>`
    : '';

  const _importBtn = section==='pag_clientes_2026' ? `<button class="btn btn-ghost btn-sm" style="margin-right:8px" onclick="openImportFaturacao()">Importar Faturação</button>` : '';
  el.innerHTML=`
    <div class="page-header"><div><h1>${sec.title}</h1><div class="subtitle">${filtered.length} registos</div></div>
    <div>${_importBtn}${(sec.fields&&!sec.noAdd)?`<button class="btn btn-primary" onclick="openAdd('${section}')">+ Adicionar</button>`:''}</div></div>
    <div class="table-wrap">
      <div class="table-toolbar">
        <input type="text" id="search_${section}" placeholder="Pesquisar em tudo..." value="${search}" oninput="doSearch('${section}')">
        ${filterBadge}
        <span class="table-count">${filtered.length} de ${data.length}</span>
      </div>
      <div class="tbl-scroll"><table class="tbl"><thead><tr>${thHtml}</tr></thead><tbody>${tbHtml}</tbody></table></div>
      ${totalPages>1?`<div class="pagination">${pagHtml}</div>`:''}
    </div>`;
}

// Cache de lookups para não pedir ao servidor repetidamente
const _lookupCache={};
async function getLookup(src,sf,sfFilter){
  const key=`${src}.${sf}${sfFilter?'|'+sfFilter:''}`;
  if(!_lookupCache[key]){
    const url=`/api/lookup/${src}/${encodeURIComponent(sf)}${sfFilter?'?filter_field='+encodeURIComponent(sfFilter):''}`;
    const vals=await api(url);
    _lookupCache[key]=Array.isArray(vals)?vals:[];
  }
  return _lookupCache[key];
}

// buildFieldHtml devolve {html, setup} — setup() deve ser chamado DEPOIS de innerHTML ser escrito
async function buildFieldHtml(f, val=''){
  const safeId=`field_${f.k.replace(/[^a-zA-Z0-9]/g,'_')}`;
  let inner='';
  if(f.t==='textarea'){
    inner=`<textarea id="${safeId}">${val}</textarea>`;
  } else if(f.t==='multicheck'){
    const max=f.max||3;
    const vals=String(val||'').split(',').map(v=>v.trim()).filter(Boolean);
    const optsHtml=(idx)=>`<option value=""></option>`+(f.opts||[]).map(o=>`<option value="${o}" ${vals[idx]===o?'selected':''}>${o}</option>`).join('');
    const sels=Array.from({length:max},(_,i)=>{
      const show=i===0||(vals[i-1]&&vals[i-1]!=='');
      return `<select id="${safeId}_${i}" data-multicheck-root="${safeId}" data-multicheck-idx="${i}"
        onchange="_mcUpdate('${safeId}',${max})"
        style="flex:1;min-width:120px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px${show?'':';display:none'}">
        ${optsHtml(i)}</select>`;
    }).join('');
    inner=`<div id="${safeId}" style="display:flex;gap:8px;flex-wrap:wrap">${sels}</div>`;
  } else if(f.t==='select'){
    inner=`<select id="${safeId}">${(f.opts||[]).map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
  } else if(f.t==='lookup'){
    const opts=await getLookup(f.src,f.sf,f.sfFilter);
    const dlId=`dl_${safeId}`;
    const optsHtml=opts.map(o=>`<option value="${o.replace(/"/g,'&quot;')}">`).join('');
    inner=`<input type="text" id="${safeId}" value="${String(val).replace(/"/g,'&quot;')}" list="${dlId}" autocomplete="off" placeholder="Escrever para pesquisar...">
           <datalist id="${dlId}">${optsHtml}</datalist>`;
  } else {
    inner=`<input type="${f.t||'text'}" id="${safeId}" value="${String(val).replace(/"/g,'&quot;')}">`;
  }

  let html='', setup=null;

  // showIf: campo condicional — suporta {v:'valor exacto'} ou {contains:'substring'}
  if(f.showIf){
    const depId      = `field_${f.showIf.k.replace(/[^a-zA-Z0-9]/g,'_')}`;
    const wrapId     = `wrap_${safeId}`;
    const showVal    = f.showIf.v;
    const showCont   = f.showIf.contains;
    const isVisible  = !!(val && val!=='');
    html = `<div class="form-group" id="${wrapId}" style="${isVisible?'':'display:none'}"><label>${f.k}</label>${inner}</div>`;
    setup = ()=>{
      const dep =document.getElementById(depId);
      const wrap=document.getElementById(wrapId);
      if(!dep||!wrap) return;
      const upd=()=>{
        const v=dep.value||'';
        const show = showCont ? v.includes(showCont) : (v===showVal);
        wrap.style.display = show ? '' : 'none';
      };
      dep.addEventListener('change', upd);
      dep.addEventListener('input',  upd);
      upd();
    };
    return {html, setup};
  }

  // fills: auto-preenchimento de outro campo ao mudar este
  if(f.fills && f.fills.length){
    setup = ()=>{
      const inp=document.getElementById(safeId);
      if(!inp) return;
      const doFills = async ()=>{
        if(!inp.value) return;
        for(const fl of f.fills){
          const tgtId=`field_${fl.tf.replace(/[^a-zA-Z0-9]/g,'_')}`;
          const r=await api(`/api/autofill?src=${encodeURIComponent(fl.src)}&match_field=${encodeURIComponent(fl.mf)}&return_field=${encodeURIComponent(fl.rf)}&match_val=${encodeURIComponent(inp.value)}`);
          const tgt=document.getElementById(tgtId);
          if(tgt && r?.value!=null) tgt.value=r.value;
        }
      };
      inp.addEventListener('change', doFills);
      doFills(); // trigger immediately if editing existing record with value already set
    };
  }

  html = `<div class="form-group"><label>${f.k}</label>${inner}</div>`;
  return {html, setup};
}

function _mcUpdate(rootId, max){
  for(let i=1;i<max;i++){
    const prev=document.getElementById(`${rootId}_${i-1}`);
    const cur=document.getElementById(`${rootId}_${i}`);
    if(!prev||!cur) continue;
    if(prev.value){cur.style.display='';} else {cur.style.display='none';cur.value='';}
  }
}
function getFieldValue(f){
  const safeId=`field_${f.k.replace(/[^a-zA-Z0-9]/g,'_')}`;
  if(f.t==='multicheck'){
    const max=f.max||3;
    const vals=[];
    for(let i=0;i<max;i++){const s=document.getElementById(`${safeId}_${i}`);if(s&&s.value) vals.push(s.value);}
    return vals.join(', ');
  }
  const el=document.getElementById(safeId);
  return el?el.value:'';
}

function _plUpdateStatus(){

  const sel=document.getElementById('pl_status');
  // reset dependent sections
  ['pl_aberta_wrap','pl_fechada_wrap'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});
  if(!aberta){swrap.style.display='none';return;}
  swrap.style.display='';
  if(aberta==='Aberta'){
    sel.innerHTML='<option value="Ativo">Ativo</option><option value="Inativo">Inativo</option>';
  } else {
    sel.innerHTML='<option value="Ganho">Ganho</option><option value="Outras">Outras</option>';
  }
  _plUpdateSubStatus();
}
function _plUpdateSubStatus(){
  const aberta=document.getElementById('pl_aberta').value;
  const status=(document.getElementById('pl_status')||{}).value||'';
  // Fechada
  const fw=document.getElementById('pl_fechada_wrap');
  const cw=document.getElementById('pl_converter_wrap');
  const ow=document.getElementById('pl_outras_wrap');
  if(fw) fw.style.display=aberta==='Fechada'?'':'none';
  if(cw) cw.style.display=status==='Ganho'?'':'none';
  if(ow) ow.style.display=status==='Outras'?'':'none';
  // Aberta
  const aw=document.getElementById('pl_aberta_wrap');
  if(aw) aw.style.display=aberta==='Aberta'?'':'none';
  if(aberta==='Aberta'){
    const ativoW=document.getElementById('pl_ativo_wrap');
    const inativoW=document.getElementById('pl_inativo_wrap');
    if(ativoW)  ativoW.style.display=status==='Ativo'?'':'none';
    if(inativoW)inativoW.style.display=status==='Inativo'?'':'none';
    // inicializar blocos de próximo contacto com o valor atual dos selects
    if(status==='Ativo')   _plUpdateAtivoRes();
    if(status==='Inativo') _plUpdateInativoMot();
  }
}
function _plUpdateAtivoRes(){
  const res=(document.getElementById('pl_ativo_res')||{}).value||'';
  const pb=document.getElementById('pl_ativo_prox');
  if(pb) pb.style.display=res==='Agendado'?'':'none';
}
function _plUpdateInativoMot(){
  const mot=(document.getElementById('pl_inativo_mot')||{}).value||'';
  const pb=document.getElementById('pl_inativo_prox');
  if(pb) pb.style.display=mot==='Agendado'?'':'none';
}

async function openAdd(section){
  if(section==='pipeline') return openAddPipeline();
  const sec=SECTIONS[section];
  if(!sec||!sec.fields) return toast('Secção sem campos definidos','error');
  document.getElementById('modalTitle').textContent='Adicionar — '+sec.title;
  document.getElementById('modalBody').innerHTML='<div style="color:var(--text-muted);padding:20px 0">A carregar campos...</div>';
  document.getElementById('modal').classList.add('show');

  let html=''; const setups=[];
  for(const f of sec.fields){const r=await buildFieldHtml(f,'');html+=r.html;if(r.setup)setups.push(r.setup);}
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);

  document.getElementById('modalSave').onclick=async()=>{
    const rec={};
    for(const f of sec.fields) rec[f.k]=getFieldValue(f);
    if(section==='pipeline'){
      const existing=sectionData['pipeline']||[];
      const maxON=existing.reduce((m,r)=>Math.max(m,parseInt(r['Nº ON'])||0),0);
      rec['Nº ON']=maxON+1;
    }
    const res=await api(`/api/data/${section}`,{method:'POST',body:rec});
    if(res?.error){ toast('Erro ao adicionar: '+res.error,'error'); return; }
    _lookupCache[`${section}.`+'x']=null;
    sectionData[section]=null;
    closeModal();
    await renderDataPage(document.getElementById('mainContent'),section);
    if(res.extra){
      const e=res.extra;
      if(e.criado==='parceiro')      toast(` Registo adicionado · Parceiro "${e.nome}" criado`);
      else if(e.criado==='cliente')  toast(` Registo adicionado · Cliente "${e.nome}" criado`);
      else if(e.criado==='existia')  toast(` Registo adicionado · ${e.tipo} "${e.nome}" já existia`);
      else toast('Registo adicionado');
    } else { toast('Registo adicionado'); }
  };
}

async function openEdit(section,idx){
  if(section==='pipeline') return openEditPipeline(idx);
  const sec=SECTIONS[section];
  const data=sectionData[section];
  if(!data||!data[idx]) return;
  const rec=data[idx];
  const fields=sec?.fields||Object.keys(rec).filter(k=>k!=='_id').map(k=>({k,t:'text'}));

  document.getElementById('modalTitle').textContent='Editar — '+(sec?.title||section);
  document.getElementById('modalBody').innerHTML='<div style="color:var(--text-muted);padding:20px 0">A carregar campos...</div>';
  document.getElementById('modal').classList.add('show');

  let html=''; const setups=[];
  for(const f of fields){const r=await buildFieldHtml(f,rec[f.k]??'');html+=r.html;if(r.setup)setups.push(r.setup);}
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);

  document.getElementById('modalSave').onclick=async()=>{
    const updates={};
    for(const f of fields) updates[f.k]=getFieldValue(f);
    const res=await api(`/api/data/${section}/${idx}`,{method:'PUT',body:updates});
    if(res?.error){ toast('Erro ao guardar: '+res.error,'error'); return; }
    sectionData[section]=null;
    closeModal();
    await renderDataPage(document.getElementById('mainContent'),section);
    toast('Registo atualizado');
  };
}

async function deleteRec(section,idx){
  if(!confirm('Eliminar este registo?')) return;
  const res=await api(`/api/data/${section}/${idx}`,{method:'DELETE'});
  if(res?.error){ toast('Erro ao eliminar: '+res.error,'error'); return; }
  sectionData[section]=null;
  await renderDataPage(document.getElementById('mainContent'),section);
  toast('Registo eliminado');
}

function _gestaoTabBtn(tipo, label){
  return `<button class="gtab${_gestaoTab===tipo?' gtab-active':''}" onclick="switchGestaoTab('${tipo}',this)">${label}</button>`;
}
function switchGestaoTab(tipo, btn){
  _gestaoTab = tipo;
  document.querySelectorAll('.gtab').forEach(b=>b.classList.remove('gtab-active'));
  btn.classList.add('gtab-active');
  _renderGestaoInner(document.getElementById('gestaoInner'), sectionData['ciclos']||[]);
}
function _semBadge(status){
  if(!status||status==='—') return `<span style="color:var(--text-muted);font-size:11px">—</span>`;
  if(status.includes('ATRASADO')) return `<span style="background:rgba(239,68,68,.18);color:#ef4444;border-radius:4px;padding:1px 5px;font-size:10px"></span>`;
  if(status.includes('')||status.includes('OK')) return `<span style="color:#22c55e;font-size:12px"></span>`;
  return `<span style="color:var(--text-muted);font-size:11px">${status.slice(0,4)}</span>`;
}
function _renderGestaoInner(inner, ciclos){
  const tipo = _gestaoTab;
  const nSem = tipo==='GL4' ? 4 : tipo==='GL12' ? 12 : 0;
  const filtrados = ciclos.filter(c=>c['Tipo']===tipo || (tipo==='GI' && c['Tipo']==='GI'));

  if(!filtrados.length){
    inner.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">Sem clientes em ${tipo==='GI'?'Gestão Integral':tipo}</div>`;
    return;
  }

  // Stats — baseados no campo Status calculado pelo servidor
  const total     = filtrados.length;
  const emCurso   = filtrados.filter(c=>c['Status']==='Em curso').length;
  const concluido = filtrados.filter(c=>c['Status']==='Concluído').length;
  const atrasados = filtrados.filter(c=>{
    for(let n=1;n<=nSem;n++) if((c[`Sem ${n} — Status`]||'').includes('ATRASADO')) return true;
    return false;
  }).length;

  // Semana header cols
  const semCols = nSem > 0 ? Array.from({length:nSem},(_,i)=>`<th style="min-width:36px;text-align:center;font-size:11px">S${i+1}</th>`).join('') : '';

  const semActualLabel = c => {
    const v = c['Semana Actual'];
    if(v == null || v === '') return '—';
    if(typeof v === 'number') return v === 0 ? 'Não iniciado' : `Semana ${v}`;
    return String(v);
  };

  const statusBadge = st => {
    if(!st||st==='—') return `<span class="badge badge-info">—</span>`;
    if(st==='Em curso')    return `<span class="badge badge-ok">Em curso</span>`;
    if(st==='Concluído')   return `<span class="badge" style="background:rgba(148,163,184,.15);color:var(--text-muted)">Concluído</span>`;
    if(st==='Por iniciar') return `<span class="badge badge-info">Por iniciar</span>`;
    if(st==='Não iniciado') return `<span class="badge" style="background:rgba(148,163,184,.15);color:var(--text-muted)">Não iniciado</span>`;
    if(st.includes('Expirado')||st.includes('')) return `<span class="badge badge-danger" style="font-size:11px">${st}</span>`;
    return `<span class="badge badge-info" style="font-size:11px">${st}</span>`;
  };

  // Aplicar filtro de status
  const visiveis = _gestaoStatusFilter === 'Todos'
    ? filtrados
    : filtrados.filter(c => {
        const st = c['Status']||'';
        if(_gestaoStatusFilter === 'Em curso')  return st === 'Em curso';
        if(_gestaoStatusFilter === 'Expirado')  return st.includes('Expirado');
        if(_gestaoStatusFilter === 'Concluído') return st === 'Concluído';
        return true;
      });

  const _sfBtn = (label, val) =>
    `<button class="md-filter-btn${_gestaoStatusFilter===val?' active':''}"
      onclick="_gestaoStatusFilter='${val}';_renderGestaoInner(document.getElementById('gestaoInner'),sectionData['ciclos']||[])">${label}</button>`;

  const rows = visiveis.map(c=>{
    const nome    = c['Cliente']||'—';
    const nomeEsc = encodeURIComponent(nome);

    const semCells = nSem > 0 ? Array.from({length:nSem},(_,i)=>{
      const n  = i+1;
      const st = c[`Sem ${n} — Status`]||'';
      const feito = c[`Sem ${n} — Feito em`]||'';
      const title = `Sem ${n}: ${st||'Sem registo'}${feito?' · '+feito:''}`;
      return `<td style="text-align:center" title="${title}">${_semBadge(st)}</td>`;
    }).join('') : '';

    return `<tr style="cursor:pointer" onclick="abrirGestaoCliente('${nomeEsc}')">
      <td><strong>${nome}</strong></td>
      <td>${statusBadge(c['Status']||'—')}</td>
      <td style="font-size:12px">${semActualLabel(c)}</td>
      <td style="font-size:12px">${fmtDate(c['Data In\xedcio'])}</td>
      <td style="font-size:12px">${fmtDate(c['Data Fim'])}</td>
      <td style="font-size:12px;color:var(--text-muted)">${c['Validade']||'—'}</td>
      ${semCells}
    </tr>`;
  }).join('');

  const emptyMsg = _gestaoStatusFilter !== 'Todos'
    ? `<div style="padding:30px;text-align:center;color:var(--text-muted)">Sem ciclos com status "${_gestaoStatusFilter}" — usa o filtro "Todos" para ver todos.</div>`
    : `<div style="padding:30px;text-align:center;color:var(--text-muted)">Sem ciclos registados.</div>`;

  inner.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap">
      <div class="stat-card" style="flex:1;padding:12px 16px"><div class="label">Total</div><div class="value purple">${total}</div></div>
      <div class="stat-card" style="flex:1;padding:12px 16px"><div class="label">Em curso</div><div class="value green">${emCurso}</div></div>
      <div class="stat-card" style="flex:1;padding:12px 16px"><div class="label">Concluídos</div><div class="value" style="color:var(--text-muted)">${concluido}</div></div>
      <div class="stat-card" style="flex:1;padding:12px 16px"><div class="label">Com atraso</div><div class="value amber">${atrasados}</div></div>
    </div>
    <div class="md-filters" style="margin-bottom:12px">
      ${_sfBtn('Em curso','Em curso')}
      ${_sfBtn('Expirados','Expirado')}
      ${_sfBtn('Concluídos','Concluído')}
      ${_sfBtn('Todos','Todos')}
    </div>
    ${visiveis.length ? `<div class="table-wrap">
      <div class="tbl-scroll">
        <table class="tbl">
          <thead><tr><th>Cliente</th><th>Status</th><th>Semana Atual</th><th>Início</th><th>Fim</th><th>Validade</th>${semCols}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>` : emptyMsg}`;
}
function _renderGestaoContent(el){
  el.innerHTML = `
    <div class="page-header"><div><h1>&#x1f4ca; Gestão de Clientes</h1><div class="subtitle">Acompanhamento de ciclos activos</div></div></div>
    <div class="gtab-wrap" style="margin-bottom:20px">
      ${_gestaoTabBtn('GL4','Gestão Light 4 semanas')}
      ${_gestaoTabBtn('GL12','Gestão Light 12 semanas')}
      ${_gestaoTabBtn('GI','Gestão Integral')}
    </div>
    <div id="gestaoInner"></div>`;
  _renderGestaoInner(document.getElementById('gestaoInner'), sectionData['ciclos']||[]);
}

function abrirGestaoCliente(nomeEnc){
  const nome   = decodeURIComponent(nomeEnc);
  const todos  = sectionData['ciclos']||[];
  const ciclos = todos.map((c,i)=>Object.assign({},c,{_idx:i})).filter(c=>c['Cliente']===nome);
  _renderGestaoClienteDetalhe(document.getElementById('gestaoInner'), nome, ciclos);
}

    const metaHtml = cf60Badge + (metaItems.length ?

            ${c['Validade']?`<span style="font-size:11px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px">${c['Validade']}</span>`:''}

        </div>
        <div style="display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start">
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px">Semanas</div>
            <table style="border-collapse:collapse;min-width:380px">
              <thead><tr>
                <th style="font-size:10px;padding:3px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left">#</th>
                <th style="font-size:10px;padding:3px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left">A\xe7\xe3o</th>
                <th style="font-size:10px;padding:3px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left">Data Prev.</th>
                <th style="font-size:10px;padding:3px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left">Estado</th>
                <th style="font-size:10px;padding:3px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left">Feito em</th>
              </tr></thead>

            </table>
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px">Detalhes</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${metaHtml}</div>
            ${c['Notas']?`<div style="margin-top:4px;font-size:12px;padding:8px 12px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:6px;color:var(--text-muted)"> ${c['Notas']}</div>`:''}
          </div>
        </div>
      </div>`;
  }).join('');

  const nomeEnc = encodeURIComponent(nome);
  inner.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="_renderGestaoInner(document.getElementById('gestaoInner'),sectionData['ciclos']||[])" class="btn btn-ghost">← Voltar</button>
        <div>
          <div style="font-size:18px;font-weight:700">${nome}</div>
          <div style="font-size:12px;color:var(--text-muted)">${ciclos.length} ciclo${ciclos.length!==1?'s':''} registado${ciclos.length!==1?'s':''}</div>
        </div>
      </div>
      <button onclick="openAddCicloModal('${nomeEnc}')" class="btn btn-primary">Novo Ciclo</button>

    ${ciclos.length ? cards : '<div style="padding:30px;text-align:center;color:var(--text-muted)">Sem ciclos registados. Crie o primeiro com  Novo Ciclo.</div>'}`;

async function _saveSemFeito(cicloIdx, semN, val){
  const updates = {};
  updates[`Sem ${semN} — Feito em`] = val || null;
  const res = await api(`/api/data/ciclos/${cicloIdx}`,{method:'PUT',body:updates});
  if(!res.error){
    if(sectionData['ciclos'] && sectionData['ciclos'][cicloIdx]){
      sectionData['ciclos'][cicloIdx][`Sem ${semN} — Feito em`] = val||null;
    }
    toast('Guardado ');
  } else { toast(res.error||'Erro ao guardar','error'); }
}

      <div class="form-group"><label>Wearable</label>
        <input type="number" id="cc_wear" value="0" min="0"></div>
      <div class="form-group"><label>Check-ins</label>
        <input type="text" id="cc_ci"></div>
    </div>
    <div class="form-group"><label>Notas</label>
      <textarea id="cc_notas" rows="2"></textarea></div>`;
  document.getElementById('modalSave').onclick = async()=>{
    const tipo = document.getElementById('cc_tipo').value;

      'Cliente':       nome,
      'Tipo':          tipo,
      'Ciclo N\xba':   parseInt(document.getElementById('cc_num').value)||proxNum,

      'Check-ins':     parseInt(document.getElementById('cc_ci').value)||null,

    } else { toast(res.error||'Erro ao criar ciclo','error'); }
  };
  document.getElementById('modal').classList.add('show');
}

function _cicloAutoFim(){
  const tipo = (document.getElementById('cc_tipo')||{}).value;
  const ini  = (document.getElementById('cc_inicio')||{}).value;
  if(!ini||!tipo) return;
  const d = new Date(ini);
  if(tipo==='GL4')       d.setDate(d.getDate()+27);
  else if(tipo==='GL12') d.setDate(d.getDate()+83);
  else return;
  const el = document.getElementById('cc_fim');
  if(el) el.value = d.toISOString().slice(0,10);
}
function _editCicloAutoFim(tipo){
  const ini = (document.getElementById('ec_inicio')||{}).value;
  if(!ini||!tipo) return;
  const d = new Date(ini+'T00:00:00');
  if(tipo==='GL4')       d.setDate(d.getDate()+27);
  else if(tipo==='GL12') d.setDate(d.getDate()+83);
  else return;
  const el = document.getElementById('ec_fim');
  if(el) el.value = d.toISOString().slice(0,10);
}

  const nSem = tipo==='GL4'?4:tipo==='GL12'?12:0;
  const nome = ciclo['Cliente']||'';

  //  Semanas 
  let semHtml = '';
  if(nSem > 0){
    const SEM_TIPOS   = ['','Aviso','FU','Consulta','Check-in','Reuni\xe3o','Outro'];
    const SEM_STATUS  = ['','Pendente',' ATRASADO',' OK','Cancelado','Em curso'];
    let semRows = '';
    for(let n=1; n<=nSem; n++){
      const tpVal = ciclo[`Sem ${n} — Tipo`]   || '';
      const stVal = ciclo[`Sem ${n} — Status`] || '';

            <th style="font-size:10px;padding:4px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left;min-width:130px">Status</th>
            <th style="font-size:10px;padding:4px 8px;color:var(--text-muted);border-bottom:1px solid var(--border);text-align:left;min-width:120px">Feito em</th>
          </tr></thead>
          <tbody>${semRows}</tbody>
        </table></div>
      </div>`;
  }

  const gpOpts = `<option value="">— sem GP —</option>`+colabs.map(c=>`<option ${(ciclo['GP']||'')===c?'selected':''}>${c}</option>`).join('');
  const inic   = String(ciclo['Data In\xedcio']||'').slice(0,10);
  const fim    = String(ciclo['Data Fim']||'').slice(0,10);
  const exc    = ciclo['Excedentes (€)']!=null?ciclo['Excedentes (€)']:'';

  document.getElementById('modalTitle').textContent = `Editar — ${tipo} Ciclo ${ciclo['Ciclo N\xba']||''} (${nome})`;
  document.getElementById('modalBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Data In\xedcio</label><input type="date" id="ec_inicio" value="${inic}" onchange="_editCicloAutoFim('${tipo}')"></div>
      <div class="form-group"><label>Data Fim <span style="font-size:10px;color:var(--text-muted)">(auto)</span></label><input type="date" id="ec_fim" value="${fim}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Wearable</label><input type="number" id="ec_wear" value="${ciclo['Wearable']||0}" min="0"></div>
      <div class="form-group"><label>Check-ins</label><input type="text" id="ec_ci" value="${ciclo['Check-ins']||''}"></div>
    </div>
    <div class="form-group">
      <label>CF60 <span style="font-size:11px;color:var(--text-muted)">(calculado automaticamente)</span></label>
      <div style="padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:13px">${(ciclo['CF60']!=null?ciclo['CF60']:0)} consulta${(ciclo['CF60']||0)!==1?'s':''} de fisiologia (CF60) conclu\xedda${(ciclo['CF60']||0)!==1?'s':''}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

  document.getElementById('modalSave').onclick = async()=>{
    const updates = {
      'Data In\xedcio':      document.getElementById('ec_inicio').value||null,
      'Data Fim':            document.getElementById('ec_fim').value||null,
      'GP':                  document.getElementById('ec_gp').value||null,

      'Check-ins':           document.getElementById('ec_ci').value||null,
      'CN':                  document.getElementById('ec_cn').value||null,
      'CM':                  document.getElementById('ec_cm').value||null,
      'Relat\xf3rio':        document.getElementById('ec_rel').value||null,
      'Excedentes (€)': document.getElementById('ec_exc').value!==''?parseFloat(document.getElementById('ec_exc').value):null,
      'Notas':               document.getElementById('ec_notas').value||null,
    };
    for(let n=1; n<=nSem; n++){
      updates[`Sem ${n} — Tipo`]     = document.getElementById(`ec_tp_${n}`)?.value||null;
      updates[`Sem ${n} — Status`]   = document.getElementById(`ec_st_${n}`)?.value||null;
      updates[`Sem ${n} — Feito em`] = document.getElementById(`ec_fe_${n}`)?.value||null;
    }
    const res = await api(`/api/data/ciclos/${idx}`,{method:'PUT',body:updates});
    if(!res.error){
      closeModal(); toast('Ciclo atualizado');
      sectionData['ciclos']=null;
      const d = await api('/api/data/ciclos');
      const _cd3 = d.error?[]:d; _cd3.forEach(_recomputeCicloSemana); sectionData['ciclos']=_cd3;
      abrirGestaoCliente(encodeURIComponent(nome));
    } else { toast(res.error||'Erro','error'); }
  };
  document.getElementById('modal').classList.add('show');
}

async function deleteCiclo(idx, nomeEnc){
  const nome = decodeURIComponent(nomeEnc);
  if(!confirm('Eliminar este ciclo de '+nome+'?')) return;
  const res = await api('/api/data/ciclos/'+idx,{method:'DELETE'});
  if(res.ok){
    toast('Ciclo eliminado');
    sectionData['ciclos']=null;
    const d = await api('/api/data/ciclos');
    const _cd4 = d.error?[]:d; _cd4.forEach(_recomputeCicloSemana); sectionData['ciclos']=_cd4;
    abrirGestaoCliente(encodeURIComponent(nome));
  } else { toast(res.error||'Erro','error'); }
}

// 
// AVALIAÇÕES (Agenda + Lista Operacional)
// 
let _agendaTab    = 'agenda';   // 'agenda' | 'lista'
let _agendaPeriodo = 'semana';
let _agendaRef    = new Date();
let _avalPrecario = null;       // cache: {COD: {pvp, sinal, nome}}
let _avalListData = null;       // cache: array with _idx
let _avalListMes  = (new Date().getMonth()+1).toString().padStart(2,'0');
let _avalListAno  = new Date().getFullYear().toString();
let _avalFiltApar = '';         // '' | 'Sim' | 'Não' | 'pendente'
let _avalFiltSinal= '';         // '' | 'Já Pago' | 'pendente'

function _isoDate(d){ return d.toISOString().slice(0,10); }
function _fmtPtDate(iso){
  if(!iso) return '—';
  const [y,m,d]=iso.split('-');
  return `${d}/${m}/${y}`;
}
function _weekLabel(ref){
  const dow = ref.getDay()===0?6:ref.getDay()-1;
  const mon = new Date(ref); mon.setDate(ref.getDate()-dow);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${mon.getDate()} ${meses[mon.getMonth()]} — ${sun.getDate()} ${meses[sun.getMonth()]} ${sun.getFullYear()}`;
}
function _mesLabel(ref){
  const meses=['Janeiro','Fevereiro','Mar\xe7o','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `${meses[ref.getMonth()]} ${ref.getFullYear()}`;
}

async function renderAgenda(el){
  const agendaControls = _agendaTab==='agenda' ? `
    <div style="display:flex;gap:8px;align-items:center">
      <div style="display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden">
        <button class="agenda-period-btn${_agendaPeriodo==='hoje'?' active':''}" onclick="setAgendaPeriodo('hoje',this)">Hoje</button>
        <button class="agenda-period-btn${_agendaPeriodo==='semana'?' active':''}" onclick="setAgendaPeriodo('semana',this)">Semana</button>
        <button class="agenda-period-btn${_agendaPeriodo==='mes'?' active':''}" onclick="setAgendaPeriodo('mes',this)">M\xeas</button>
      </div>
      <div id="agendaNav" style="display:flex;align-items:center;gap:6px;${_agendaPeriodo==='hoje'?'visibility:hidden':''}">
        <button class="btn btn-sm" onclick="agendaNav(-1)">&#8592;</button>
        <span id="agendaNavLabel" style="font-size:13px;color:var(--text-muted);min-width:160px;text-align:center"></span>
        <button class="btn btn-sm" onclick="agendaNav(+1)">&#8594;</button>
      </div>
    </div>` : '';
  el.innerHTML = `
    <div class="page-header">
      <div><h1>&#x1f4cb; Avalia\xe7\xf5es</h1><div class="subtitle" id="agendaSubtitle"></div></div>
      ${agendaControls}
    </div>
    <div class="gtab-wrap" style="margin-bottom:20px">
      <button class="gtab${_agendaTab==='agenda'?' gtab-active':''}" onclick="switchAgendaTab('agenda',this)">&#x1f4c5; Agenda</button>
      <button class="gtab${_agendaTab==='lista'?' gtab-active':''}" onclick="switchAgendaTab('lista',this)">&#x1f4cb; Lista Operacional</button>
    </div>
    <div id="agendaContent"><div style="color:var(--text-muted);padding:40px;text-align:center">A carregar...</div></div>`;
  if(_agendaTab==='agenda') await _loadAgenda();
  else await _loadAvaliacoesList();
}

async function switchAgendaTab(tab, btn){
  _agendaTab = tab;
  document.querySelectorAll('.gtab').forEach(b=>b.classList.remove('gtab-active'));
  btn.classList.add('gtab-active');
  // Re-render page header controls
  await renderAgenda(document.getElementById('mainContent'));
}

async function setAgendaPeriodo(p, btn){
  _agendaPeriodo = p;
  _agendaRef = new Date();
  document.querySelectorAll('.agenda-period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const nav = document.getElementById('agendaNav');
  if(nav) nav.style.visibility = p==='hoje' ? 'hidden' : '';
  await _loadAgenda();
}

async function agendaNav(dir){
  if(_agendaPeriodo==='semana') _agendaRef.setDate(_agendaRef.getDate() + dir*7);
  else if(_agendaPeriodo==='mes') _agendaRef.setMonth(_agendaRef.getMonth() + dir);
  await _loadAgenda();
}

async function _loadAgenda(){
  const navLbl = document.getElementById('agendaNavLabel');
  if(navLbl) navLbl.textContent = _agendaPeriodo==='semana' ? _weekLabel(_agendaRef) : _agendaPeriodo==='mes' ? _mesLabel(_agendaRef) : '';

  const sub = document.getElementById('agendaSubtitle');
  const content = document.getElementById('agendaContent');
  if(!content){ console.error('agendaContent div not found'); return; }
  content.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center">&#x23f3; A carregar...</div>`;

  let d;
  try {
    d = await api(`/api/agenda?periodo=${_agendaPeriodo}&data=${_isoDate(_agendaRef)}`);
  } catch(err){
    content.innerHTML = `<div style="color:var(--danger);padding:32px;text-align:center">Erro de ligação ao servidor: ${err.message}</div>`;
    if(sub) sub.textContent = 'Erro';
    return;
  }
  if(!d || d.error){
    content.innerHTML = `<div style="color:var(--danger);padding:32px;text-align:center">${d?.error||'Resposta inválida do servidor'}</div>`;
    if(sub) sub.textContent = 'Erro';
    return;
  }
  if(d.precario && !_avalPrecario) _avalPrecario = d.precario;

  const events = d.events || [];
  if(sub) sub.textContent = `${events.length} evento${events.length!==1?'s':''}`;

  if(!events.length){
    content.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">Sem eventos para este per\xedodo</div>`;
    return;
  }

  // Agrupar por data
  const porData = {};
  events.forEach(e=>{ (porData[e.data]=porData[e.data]||[]).push(e); });

  const tipoIcon  = t => t==='Avalia\xe7\xe3o'?'':t==='Consulta'?'':t==='Sess\xe3o'?'':'&#x1f4cc;';
  const tipoColor = t => t==='Avalia\xe7\xe3o'?'badge-info':t==='Consulta'?'badge-ok':t==='Sess\xe3o'?'badge-warn':'';

  const apareceuBadge = a => {
    if(a==='Sim') return `<span style="color:var(--success);font-size:12px" title="Apareceu">&#x2705;</span>`;
    if(a==='N\xe3o') return `<span style="color:var(--danger);font-size:12px" title="N\xe3o apareceu">&#x274c;</span>`;
    return `<span style="color:var(--text-muted);font-size:11px">—</span>`;
  };
  const sinalBadge = s => {
    if(s==='J\xe1 Pago') return `<span style="color:var(--success);font-size:11px" title="Sinal pago">&#x1f4b0;</span>`;
    if(s && s.includes('aguardar')) return `<span style="color:var(--warning);font-size:11px" title="${s}">&#x23f3;</span>`;
    if(s) return `<span style="color:var(--text-muted);font-size:11px" title="${s}">&#x2753;</span>`;
    return `<span style="color:var(--text-muted);font-size:11px">—</span>`;
  };

  let html = '';
  for(const [dt, evs] of Object.entries(porData).sort()){
    const [y,m,d2]=dt.split('-');
    const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const dtLabel = `${parseInt(d2)} ${meses[parseInt(m)-1]} ${y}`;
    const rows = evs.map(e=>{
      const isAval = e.tipo==='Avalia\xe7\xe3o';
      const horaStr = e.hora ? `<span style="font-size:11px;color:var(--text-muted);margin-left:4px">${e.hora}</span>` : '';
      const editBtn = isAval && e._idx!=null
        ? `<button onclick="event.stopPropagation();abrirEditarAval(${e._idx})" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:2px 4px" title="Editar campos operacionais" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">&#x270f;</button>`
        : '';
      const opCols = isAval
        ? `<td style="text-align:center">${apareceuBadge(e.apareceu)}</td><td style="text-align:center">${sinalBadge(e.sinal)}</td>`
        : `<td></td><td></td>`;
      return `
      <tr style="cursor:pointer" onclick="${isAval && e._idx!=null ? `abrirEditarAval(${e._idx})` : `if('${(e.cliente||'').replace(/'/g,"\\'")}') openClienteDetalhe('${(e.cliente||'').replace(/'/g,"\\'")}')`}">
        <td><strong>${e.cliente||'—'}</strong>${horaStr}</td>
        <td><span class="badge ${tipoColor(e.tipo)}">${e.tipo}</span></td>
        <td>${e.servico||'—'}</td>
        <td style="font-size:12px">${e.tecnico||'—'}</td>
        <td style="font-size:12px">${e.nivel||e.status||'—'}</td>
        ${opCols}
        <td style="white-space:nowrap">${editBtn}</td>
      </tr>`;
    }).join('');
    html += `
      <div style="margin-bottom:24px">
        <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)">${dtLabel} <span style="font-weight:400">(${evs.length})</span></div>
        <div class="table-wrap" style="margin:0">
          <table class="tbl">
            <thead><tr><th>Cliente</th><th>Tipo</th><th>Servi\xe7o</th><th>T\xe9cnico</th><th>Estado</th><th style="text-align:center;width:40px">&#x1f465;</th><th style="text-align:center;width:40px">&#x1f4b0;</th><th style="width:36px"></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }
  content.innerHTML = html;
}

//  Lista Operacional 
async function _loadAvaliacoesList(forceReload){
  const content = document.getElementById('agendaContent');
  const sub     = document.getElementById('agendaSubtitle');
  if(!content){ console.error('agendaContent not found'); return; }
  content.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center">&#x23f3; A carregar...</div>`;

  if(!_avalListData || forceReload){
    let d;
    try {
      d = await api('/api/avaliacoes/lista');
    } catch(err){
      content.innerHTML = `<div style="color:var(--danger);padding:32px;text-align:center">Erro: ${err.message}</div>`;
      if(sub) sub.textContent = 'Erro';
      return;
    }
    if(!d || d.error){
      content.innerHTML = `<div style="color:var(--danger);padding:32px;text-align:center">${d?.error||'Resposta inválida'}</div>`;
      if(sub) sub.textContent = 'Erro';
      return;
    }
    _avalListData = d;
  }
  // Load precario if not yet cached
  if(!_avalPrecario){
    const pr = await api('/api/data/precario_publico');
    if(!pr.error){
      _avalPrecario = {};
      (Array.isArray(pr)?pr:[]).forEach(p=>{
        const cod=p['C\xf3digo'];
        if(cod && cod!=='C\xf3digo'){
          let pvp=p['PVP Promocional (c/IVA)']||p['PVP Base (c/IVA)'];
          try{ pvp=parseFloat(pvp)||null; }catch(e){ pvp=null; }
          let sig=p['Sinal']; try{ sig=parseFloat(sig)||null; }catch(e){ sig=null; }
          _avalPrecario[cod]={pvp,sinal:sig,nome:p['Servi\xe7o']||''};
        }
      });
    }
  }

  // Filtrar por mês/ano e filtros operacionais
  const allData = _avalListData || [];
  const filtered = allData.filter(a=>{
    const dt = (a['Data']||'').slice(0,10);
    if(!dt) return true;
    const [y,m]=dt.split('-');
    if(_avalListAno && y!==_avalListAno) return false;
    if(_avalListMes && m!==_avalListMes) return false;
    if(_avalFiltApar){
      const ap=a['Apareceu']||'';
      if(_avalFiltApar==='pendente' && ap) return false;
      if(_avalFiltApar!=='pendente' && ap!==_avalFiltApar) return false;
    }
    if(_avalFiltSinal){
      const si=a['Sinal']||'';
      if(_avalFiltSinal==='pendente' && si==='J\xe1 Pago') return false;
      if(_avalFiltSinal==='J\xe1 Pago' && si!=='J\xe1 Pago') return false;
    }
    return true;
  }).sort((a,b)=>((b['Data']||'')>(a['Data']||'')?1:-1));

  if(sub) sub.textContent = `${filtered.length} avalia\xe7\xe3o${filtered.length!==1?'\xf5es':''}`;

  // Anos disponíveis para o filtro
  const anos = [...new Set(allData.map(a=>(a['Data']||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const mesesNomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesesOpts = mesesNomes.map((n,i)=>{
    const v=(i+1).toString().padStart(2,'0');
    return `<option value="${v}" ${v===_avalListMes?'selected':''}>${n}</option>`;
  }).join('');
  const anosOpts = anos.map(y=>`<option value="${y}" ${y===_avalListAno?'selected':''}>${y}</option>`).join('');

  const apareceuOpts = [['','Todos'],['Sim','&#x2705; Apareceu'],['N\xe3o','&#x274c; N\xe3o apareceu'],['pendente','&#x23f3; Pendente']];
  const sinalOpts    = [['','Todos'],['J\xe1 Pago','&#x1f4b0; Pago'],['pendente','&#x23f3; Pendente']];

  const selStyle = `background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px`;

  const totSinal = filtered.filter(a=>a['Sinal']==='J\xe1 Pago').length;
  const totApare = filtered.filter(a=>a['Apareceu']==='Sim').length;
  const totNaoApare = filtered.filter(a=>a['Apareceu']==='N\xe3o').length;
  const totPendente = filtered.filter(a=>!a['Apareceu']).length;

  const apareceuCell = a => {
    const v=a['Apareceu'];
    if(v==='Sim') return `<span style="color:var(--success)">&#x2705; Sim</span>`;
    if(v==='N\xe3o') return `<span style="color:var(--danger)">&#x274c; N\xe3o</span>`;
    return `<span style="color:var(--text-muted);font-size:11px">Pendente</span>`;
  };
  const sinalCell = a => {
    const v=a['Sinal'];
    if(v==='J\xe1 Pago') return `<span style="color:var(--success)">&#x1f4b0; Pago</span>`;
    if(v && v.includes('aguardar')) return `<span style="color:var(--warning)" title="${v}">&#x23f3; Aguardar</span>`;
    if(v) return `<span style="color:var(--text-muted);font-size:11px">${v}</span>`;
    return `<span style="color:var(--text-muted);font-size:11px">—</span>`;
  };
  const cobrancaCell = a => {
    const c=a['Cobran\xe7a']||'';
    const v=a['Valor a Cobrar'];
    if(c.includes('inclu\xeddo')) return `<span style="color:var(--text-muted);font-size:11px">Inclu\xeddo</span>`;

    if(c.includes('Cobrar')) {
      const m2=c.match(/\d+/);
      if(m2) return `<span style="font-weight:600;color:var(--primary-text)">${m2[0]}€</span>`;
    }
    return `<span style="color:var(--text-muted);font-size:11px">${v||c||'—'}</span>`;
  };

  const rows = filtered.map(a=>`
    <tr style="cursor:pointer" onclick="abrirEditarAval(${a._idx})">

      <td>${sinalCell(a)}</td>
      <td>${cobrancaCell(a)}</td>
      <td style="text-align:right">
        <button onclick="event.stopPropagation();abrirEditarAval(${a._idx})" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px" title="Editar" onmouseover="this.style.color='var(--primary-text)'" onmouseout="this.style.color='var(--text-muted)'">&#x270f;</button>
      </td>
    </tr>`).join('');

  content.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <select style="${selStyle}" onchange="_avalListMes=this.value;_loadAvaliacoesList()">${mesesOpts}</select>
      <select style="${selStyle}" onchange="_avalListAno=this.value;_loadAvaliacoesList()">${anosOpts}</select>
      <select style="${selStyle}" onchange="_avalFiltSinal=this.value;_loadAvaliacoesList()">
        ${sinalOpts.map(([v,l])=>`<option value="${v}" ${v===_avalFiltSinal?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    <div class="gtab-wrap" style="margin-bottom:16px">
      <button class="gtab${!_avalFiltApar?' gtab-active':''}" onclick="_avalFiltApar='';_loadAvaliacoesList()">Todos <strong>${filtered.length}</strong></button>
      <button class="gtab${_avalFiltApar==='Sim'?' gtab-active':''}" onclick="_avalFiltApar='Sim';_loadAvaliacoesList()">&#x2705; Apareceu <strong>${totApare}</strong></button>
      <button class="gtab${_avalFiltApar==='N\xe3o'?' gtab-active':''}" onclick="_avalFiltApar='N\xe3o';_loadAvaliacoesList()">&#x274c; N\xe3o apareceu <strong>${totNaoApare}</strong></button>
      <button class="gtab${_avalFiltApar==='pendente'?' gtab-active':''}" onclick="_avalFiltApar='pendente';_loadAvaliacoesList()">&#x23f3; Pendente <strong>${totPendente}</strong></button>
      <button class="gtab${_avalFiltSinal==='J\xe1 Pago'?' gtab-active':''}" onclick="_avalFiltSinal=_avalFiltSinal==='J\xe1 Pago'?'':'J\xe1 Pago';_loadAvaliacoesList()">&#x1f4b0; Sinal pago <strong>${totSinal}</strong></button>

//  Modal edição operacional de avaliação 
async function abrirEditarAval(idx){
  // Garantir que temos os dados
  if(!_avalListData){
    const d = await api('/api/avaliacoes/lista');
    if(d.error){ toast('Erro ao carregar avalia\xe7\xf5es','error'); return; }
    _avalListData = d;
  }
  if(!_avalPrecario){
    const pr = await api('/api/data/precario_publico');
    if(!pr.error){
      _avalPrecario = {};
      (Array.isArray(pr)?pr:[]).forEach(p=>{
        const cod=p['C\xf3digo'];
        if(cod && cod!=='C\xf3digo'){
          let pvp=p['PVP Promocional (c/IVA)']||p['PVP Base (c/IVA)'];
          try{ pvp=parseFloat(pvp)||null; }catch(e){ pvp=null; }
          let sig=p['Sinal']; try{ sig=parseFloat(sig)||null; }catch(e){ sig=null; }
          _avalPrecario[cod]={pvp,sinal:sig,nome:p['Servi\xe7o']||''};
        }
      });
    }
  }

  const aval = (_avalListData||[]).find(a=>a._idx===idx);
  if(!aval){ toast('Avalia\xe7\xe3o n\xe3o encontrada','error'); return; }

  // Determinar preço do precário com base no código do serviço
  const codServ = aval['_CodServ'] || aval['C\xf3digo Servi\xe7o'] || '';
  const codBase = codServ.replace(/-\d+$/, ''); // "AMR-047" → "AMR"
  const prec = (_avalPrecario||{})[codBase] || null;
  const isInscrição = (aval['Origem']||'') === 'Inscri\xe7\xe3o';

  // Valor a cobrar: preferir valor já gravado, senão auto-preencher
  let valorCobrar = aval['Valor a Cobrar'];
  if((valorCobrar===null||valorCobrar===undefined||typeof valorCobrar==='string') && prec?.pvp && !isInscrição){
    valorCobrar = prec.pvp;
  }
  const valorNum = typeof valorCobrar === 'number' ? valorCobrar : null;

  // Cobrança auto-calculada
  const autoCobranca = isInscrição
    ? 'J\xe1 pago (inclu\xeddo no servi\xe7o)'
    : valorNum ? `Cobrar €${Math.round(valorNum)} no dia` : '';
  const cobrancaActual = aval['Cobran\xe7a'] || autoCobranca;

  const sinalAmount = prec?.sinal;
  const sinalHint = sinalAmount ? ` (valor: ${sinalAmount}€)` : '';

  const selStyle = `width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px`;
  const inputStyle = `width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;box-sizing:border-box`;
  const labelStyle = `font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block`;

  document.getElementById('modalTitle').textContent = `Avalia\xe7\xe3o — ${aval['Nome']||''}`;
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:8px;padding:10px 14px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--text-muted)">
      <strong style="color:var(--text)">${aval['Servi\xe7o']||'—'}</strong>
      &nbsp;·&nbsp;${_fmtPtDate((aval['Data']||'').slice(0,10))}
      ${aval['Hora']?`&nbsp;·&nbsp;${aval['Hora']}`:''}
      &nbsp;·&nbsp;${aval['T\xe9cnico Respons\xe1vel']||'—'}
      ${prec ? `&nbsp;·&nbsp;<span style="color:var(--primary-text)">PVP: ${prec.pvp ? prec.pvp.toFixed(2)+'€' : '—'}</span>` : ''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div>
        <label style="${labelStyle}">&#x1f465; Apareceu?</label>
        <select id="ae_apareceu" style="${selStyle}">
          <option value="" ${!aval['Apareceu']?'selected':''}>— N\xe3o definido</option>
          <option value="Sim" ${aval['Apareceu']==='Sim'?'selected':''}>&#x2705; Sim</option>
          <option value="Não" ${aval['Apareceu']==='N\xe3o'?'selected':''}>&#x274c; N\xe3o</option>
        </select>
      </div>
      <div>
        <label style="${labelStyle}">&#x1f4b0; Sinal${sinalHint}</label>
        <select id="ae_sinal" style="${selStyle}">
          <option value="" ${!aval['Sinal']?'selected':''}>— N\xe3o definido</option>
          <option value="Já Pago" ${aval['Sinal']==='J\xe1 Pago'?'selected':''}>&#x1f4b0; J\xe1 Pago</option>
          <option value="Sim mas a aguardar pagamento" ${(aval['Sinal']||'').includes('aguardar')?'selected':''}>&#x23f3; A aguardar</option>
          <option value="Não" ${aval['Sinal']==='N\xe3o'?'selected':''}>&#x274c; N\xe3o</option>
        </select>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div>
        <label style="${labelStyle}">&#x1f4b3; Forma de Pagamento (Sinal)</label>
        <select id="ae_forma_pag" style="${selStyle}">
          <option value="" ${!aval['Forma de Pagamento']?'selected':''}>— N\xe3o definido</option>
          <option value="MB Way" ${aval['Forma de Pagamento']==='MB Way'?'selected':''}>MB Way</option>
          <option value="Transfer\xeancia" ${aval['Forma de Pagamento']==='Transfer\xeancia'?'selected':''}>Transfer\xeancia</option>
          <option value="Num\xe9rario" ${aval['Forma de Pagamento']==='Num\xe9rario'?'selected':''}>Num\xe9rario</option>
          <option value="Cart\xe3o" ${aval['Forma de Pagamento']==='Cart\xe3o'?'selected':''}>Cart\xe3o</option>
        </select>
      </div>
      <div>
        <label style="${labelStyle}">&#x1f4b5; Valor a Cobrar (€)${isInscrição?' — <span style="color:var(--success)">Inclu\xeddo na inscri\xe7\xe3o</span>':''}</label>
        <input id="ae_valor" type="number" min="0" step="0.01"
          value="${valorNum!=null?valorNum:''}"
          placeholder="${isInscrição?'0 (inclu\xeddo)':prec?.pvp?prec.pvp.toFixed(2):'Ex: 79'}"
          ${isInscrição?'disabled':''} style="${inputStyle}${isInscrição?';opacity:.5':''}">
      </div>
    </div>

    <div>
      <label style="${labelStyle}">&#x1f4dd; Cobran\xe7a (auto-calculado)</label>
      <input id="ae_cobranca" type="text" value="${cobrancaActual}"
        style="${inputStyle}" placeholder="Ex: Cobrar €79 no dia">
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
        Auto-preenche quando altera o valor acima
      </div>
    </div>

    <div style="margin-top:14px">
      <label style="${labelStyle}">&#x1f4ac; Notas internas</label>
      <textarea id="ae_notas" rows="2" style="${inputStyle};resize:vertical">${aval['Notas Operacionais']||''}</textarea>
    </div>`;

  // Auto-update cobrança ao alterar valor
  const valInput = document.getElementById('ae_valor');
  const cobInput = document.getElementById('ae_cobranca');
  if(valInput && cobInput){
    valInput.addEventListener('input',()=>{
      const v=parseFloat(valInput.value);
      if(!isNaN(v) && v>0) cobInput.value=`Cobrar €${Math.round(v)} no dia`;
      else if(!isNaN(v) && v===0) cobInput.value='J\xe1 pago (inclu\xeddo no servi\xe7o)';
    });
  }

  document.getElementById('modal').classList.add('show');

  document.getElementById('modalSave').onclick = async()=>{
    const updates = {
      'Apareceu':              document.getElementById('ae_apareceu').value || null,
      'Sinal':                 document.getElementById('ae_sinal').value || null,
      'Forma de Pagamento':    document.getElementById('ae_forma_pag').value || null,
      'Cobran\xe7a':           document.getElementById('ae_cobranca').value || null,
      'Valor a Cobrar':        parseFloat(document.getElementById('ae_valor')?.value) || (isInscrição ? 0 : null),
      'Notas Operacionais':    document.getElementById('ae_notas').value || null,
    };
    const r = await api(`/api/data/avaliacoes/${idx}`,{method:'PUT',body:updates});
    if(r.error){ toast('Erro ao guardar','error'); return; }
    // Invalidar cache para recarregar
    _avalListData = null;
    closeModal();
    toast('Avalia\xe7\xe3o actualizada');
    if(_agendaTab==='lista') await _loadAvaliacoesList(true);
    else await _loadAgenda();
  };
}

async function switchFalhasTab(tab, btn){

  btn.classList.add('gtab-active');
  await _loadFalhasTab();

async function _loadFalhasTab(){
  const inner = document.getElementById('falhasInner');
  if(!inner) return;
  inner.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center">A carregar...</div>`;

  if(_falhasTab === 'resumo'){
    const url = '/api/falhas/resumo' + (_falhasTrimestre ? `?trimestre=${encodeURIComponent(_falhasTrimestre)}` : '');
    const d = await api(url);
    if(d.error){ inner.innerHTML=`<p style="color:var(--danger)">${d.error}</p>`; return; }
    const resumo = d.resumo || [];
    const trimestres = d.trimestres || [];
    if(!_falhasTrimestre && trimestres.length){ _falhasTrimestre = trimestres[0]; return _loadFalhasTab(); }
    const nivelBadge = (n, des) => {
      if(n<=0) return `<span class="badge badge-ok"> ${des}</span>`;
      if(n===1) return `<span class="badge badge-info">${des}</span>`;
      if(n===2) return `<span class="badge badge-warn">${des}</span>`;
      return `<span class="badge badge-err">${des}</span>`;
    };
    const rows = resumo.map(r=>`
      <tr>
        <td><strong>${r.Professor}</strong></td>
        <td style="text-align:center"><strong style="font-size:18px;color:${r.Pontos>5?'var(--danger)':r.Pontos>2?'var(--warning)':'var(--success)'}">${r.Pontos}</strong></td>
        <td>${nivelBadge(r.Nivel, r.Designacao)}</td>
        <td style="font-size:12px;color:var(--text-muted)">${r.Medida||'—'}</td>
      </tr>`).join('');
    const trimestreSel = trimestres.map(t=>`<option value="${t}" ${t===_falhasTrimestre?'selected':''}>${t}</option>`).join('');
    inner.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <label style="font-size:13px;color:var(--text-muted)">Trimestre:</label>
        <select onchange="_falhasTrimestre=this.value;_loadFalhasTab()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px">${trimestreSel}</select>
      </div>
      <div class="table-wrap">
        <table class="tbl"><thead><tr><th>Colaborador</th><th style="text-align:center">Pontos</th><th>Nível</th><th>Medida</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sem registos</td></tr>'}</tbody></table>
      </div>`;

  } else if(_falhasTab === 'log'){
    const _rd = await api('/api/falhas/resumo');
    const log = [...(_rd.falhas||[])].sort((a,b)=>(b.Data||'').localeCompare(a.Data||''));
    const catBadge = c => c==='Grave'||c==='Muito Grave'?`<span class="badge badge-err">${c}</span>`:c==='Não Grave'?`<span class="badge badge-info">${c}</span>`:`<span class="badge badge-warn">${c}</span>`;
    const rows = log.map((e,i)=>`<tr>
        <td>${fmtDate(e.Data)}</td>
        <td><strong>${e.Professor||'—'}</strong></td>
        <td>${e.Falta||'—'}</td>
        <td>${catBadge(e.Categoria||'—')}</td>
        <td style="text-align:center"><strong>${e.Pontos||0}</strong></td>
        <td style="font-size:11px;color:var(--text-muted)">${e['Âmbito']||'—'}</td>
        <td style="font-size:11px">${e.Notas||'—'}</td>
        <td><button onclick="deleteRec('falhas_sancoes',${i})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px" title="Eliminar" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'"></button></td>
      </tr>`).join('');
    inner.innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
        <button class="btn btn-primary" onclick="openAdd('falhas_sancoes')">+ Registar Infração</button>
      </div>
      <div class="table-wrap">
        <table class="tbl"><thead><tr><th>Data</th><th>Colaborador</th><th>Falta</th><th>Categoria</th><th style="text-align:center">Pts</th><th>Âmbito</th><th>Notas</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">Sem infrações registadas</td></tr>'}</tbody></table>
      </div>`;

  } else { // catalogo
    const _catRes = await api('/api/falhas/catalogo');
    const cat = _catRes.catalogo||[];
    if(_catRes.error||!cat.length){ inner.innerHTML=`<div style="color:var(--text-muted);padding:40px;text-align:center">Sem dados</div>`; return; }
    const catBadge = c => c==='Muito Grave'?`<span class="badge badge-err">${c}</span>`:c==='Grave'?`<span class="badge badge-warn">${c}</span>`:`<span class="badge badge-info">${c}</span>`;
    let lastAmb = '';
    const rows = cat.map(f=>{
      const ambHeader = f['Âmbito']!==lastAmb ? `<tr style="background:var(--surface2)"><td colspan="5" style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:8px 12px">Âmbito: ${f['Âmbito']}</td></tr>` : '';
      lastAmb = f['Âmbito'];
      return ambHeader+`<tr>
        <td>${f.Falta}</td>
        <td>${catBadge(f.Categoria)}</td>
        <td style="text-align:center"><strong>${f.Pontos}</strong></td>
        <td style="text-align:center"><span class="badge ${f['Métrica?']==='Sim'?'badge-info':''}">${f['Métrica?']||'—'}</span></td>
        <td style="font-size:11px;color:var(--text-muted)">${f['Âmbito']}</td>
      </tr>`;
    }).join('');
    inner.innerHTML = `
      <div class="table-wrap">
        <table class="tbl"><thead><tr><th>Falta</th><th>Categoria</th><th style="text-align:center">Pontos</th><th style="text-align:center">Métrica?</th><th>Âmbito</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>`;
  }
}

  ' Gestão de Ciclo',
  ' Outro',
];

function _alertasTabFilter(key){
  if(key==='todas') return ()=>true;
  const fontes = ALERTAS_TAB_FONTE[key]||[];
  return r => fontes.includes(r.Fonte);
}

function _alertasPrazoFilter(prazo, r){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dl = r.DataLimite ? new Date(r.DataLimite) : null;
  if(!dl) return prazo==='todos';
  dl.setHours(0,0,0,0);
  const diff = Math.round((dl - hoje)/(1000*60*60*24));
  if(prazo==='atrasado') return diff < 0;
  if(prazo==='hoje')     return diff === 0;
  if(prazo==='7d')       return diff >= 0 && diff <= 7;
  if(prazo==='30d')      return diff >= 0 && diff <= 30;
  return true; // todos
}
