async function openClienteDetalhe(nome){
  _cliSelected=nome;
  if(currentSection==='clientes'){_selectCliente(nome);return;}
  await navigate('clientes');
}

function renderClienteDetalhe(el, nome, d, inPane=false){
  const info=d.info||{};

  // Serviços activos (excluir Concluídos)
  const servicosAtivos = (d.servicos||[]).filter(s=>{
    const e=(s['Estado do serviço']||'').trim();
    return e!=='Concluído' && e!=='Concluido';
  });

  // Auto-calcular status — nunca depender do valor manual para estes casos
  const _temServicoAtivo = servicosAtivos.length > 0 || !!d.motor;
  const _temAval = (d.avaliacoes||[]).length > 0 || (d.conversoes||[]).some(c=>{
    const sv=(c['Serviço']||'').toLowerCase();
    const cd=(c['Código Serviço']||'').toUpperCase();
    return sv.includes('avalia')||sv.includes('pack')||cd.startsWith('PV-')||cd.startsWith('AVAL');
  });
  const _canceladoPorContrato = !_temServicoAtivo && (d.log_contratos||[]).some(c=>c['Estado']==='Cancelado'&&!c['Data_Fim']);
  const _statusManual = info.Status||'';
  const _STATUS_SIMPLES = ['Ativo','Avaliação expirada','Sem Serviço','Suspenso','Cancelado'];
  const _statusProtegido = !_STATUS_SIMPLES.includes(_statusManual);
  let _statusCalculado = _statusManual;
  if(!_statusProtegido){
    if(_canceladoPorContrato)    _statusCalculado = 'Cancelado';
    else if(_temServicoAtivo)    _statusCalculado = 'Ativo';
    else if(_temAval)            _statusCalculado = 'Avaliação expirada';
    else                         _statusCalculado = 'Sem Serviço';
  }
  // Corrigir na DB silenciosamente se divergir e atualizar cache + lista
  if(_statusCalculado !== _statusManual){
    api(`/api/clientes/${encodeURIComponent(nome)}/estado`,{method:'POST',body:{status:_statusCalculado}})
      .then(()=>{
        if(sectionData['clientes']){
          const entry=sectionData['clientes'].find(c=>c['Nome']===nome);
          if(entry) entry['Status']=_statusCalculado;
          if(document.querySelector('.md-wrap'))
            _renderClientesMD(document.getElementById('mainContent'));
        }
      });
  }
  info.Status = _statusCalculado;
  const sc=statusClass(info.Status);

  // KPIs rápidos
  const mesAtualIdx=new Date().getMonth(); // 0-based (Jan=0)
  const MESES_S=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const temMotor = !!d.motor;
  const temPag26 = !!(d.pag_2026&&d.pag_2026.length);

  const totalPago    = (d.pag_2026||[]).reduce((s,p)=>s+(parseFloat(p['Valor Pago'])||0),0);
  const totalPendente= (d.pag_2026||[]).filter(p=>p['_Estado_Pag']&&p['_Estado_Pag'].includes('')).length;
  const motorTotal   = temMotor ? MESES_S.slice(0,mesAtualIdx+1).reduce((s,m)=>s+(parseFloat(d.motor[m])||0),0) : 0;
  // Meses passados (incl. actual) sem registo manual — só quando não há pag_2026
  const motorPendentes = !temPag26 && temMotor
    ? MESES_S.slice(0,mesAtualIdx+1).filter(m=>d.motor[m]&&d.motor[m]>0).length : 0;

  // Contagens reais para os badges das tabs
  // Motor só conta se não estiver já representado por um serviço com o mesmo código
  const motorCodeForCount = temMotor ? (d.motor['Plano Actual']||'') : '';
  const motorEstadoForCount = temMotor ? (d.motor['Estado Hoje']||'Ativo') : '';
  const motorJaContado = motorCodeForCount && motorEstadoForCount==='Ativo' && servicosAtivos.some(s=>(s['Código']||'')=== motorCodeForCount);
  const nConvsOutros = (d.conversoes||[]).filter(c=>!/^(PT|DUO)/i.test(c['Código Serviço']||'')).length;
  const nServicos = servicosAtivos.length + (temMotor && !motorJaContado ? 1 : 0) + nConvsOutros;
  const nAvals    = (d.avaliacoes||[]).length;
  const nPag26    = temPag26 ? d.pag_2026.length
                  : temMotor ? MESES_S.filter(m=>d.motor[m]&&d.motor[m]>0).length : 0;
  const nPag25    = (d.pag_2025||[]).length;
  const nFaturacao = nPag26 + nPag25;
  const nContratos= (d.log_contratos||[]).length;
  const nHistorico= (d.log_comercial||[]).length + (d.conversoes||[]).length;

  // Sidebar info
  const isHibrido = info['Regime'] === 'Híbrido';
  const estadoHib = info['Estado Híbrido'] || '';
  const hibBadge = isHibrido
    ? (estadoHib === 'Activo'
        ? `<span class="badge badge-ok" style="font-size:10px">Híbrido ativo</span>`
        : `<span class="badge badge-warn" style="font-size:10px">Híbrido ${estadoHib||'suspenso'}</span>`)
    : '';

  const infoRows = [
    ['Email',           info['Email']||'—'],
    ['Telemóvel',       info['Telemóvel']||'—'],
    ['NIF',             info['NIF']||'—'],
    ['Localidade',      info['Localidade']||'—'],
    ['Segmento',        info['Segmento']||'—'],
    ['PT',              info['PT']||'—'],
    ['Nutricionista',   info['Nutricionista']||'—'],
    ['Método Pag.',     info['Método Pagamento']||'—'],
    ...(info['Iban'] ? [
      ['Cód. DD',       info['Código Bancário']||'—'],
      ['IBAN',          `<span style="font-family:monospace;font-size:11px;letter-spacing:.5px">${info['Iban']}</span>`],
      ['Nome Bancário', info['Nome Bancário']||'—'],
    ] : []),
    ...(info['Faturar a'] ? [
      ['Faturar a',     info['Faturar a']],
      ['NIF Fat.',      info['NIF Faturação']||'—'],
    ] : []),
    ...(isHibrido ? [
      ['Regime',        hibBadge],
      ['PT Híbrido',    info['PT Híbrido']||'—'],
      ['Valor Mensal',  info['Valor Híbrido']!=null ? info['Valor Híbrido']+'€' : '—'],
      ...(info['Par Híbrido'] ? [
        ['Par DUO',     `<a href="#" onclick="openClienteDetalhe('${(info['Par Híbrido']||'').replace(/'/g,"\\'")}');return false" style="color:var(--primary-text)">${info['Par Híbrido']}</a>`],
        ['V. Single',   info['Valor Single']!=null ? info['Valor Single']+'€' : '—'],
        ['V. Duo Base', info['Valor Duo Base']!=null ? info['Valor Duo Base']+'€' : '—'],
      ] : []),
    ] : []),
    ['Último Contacto', info['Último Contacto']
      ? `${info['Último Contacto'].substring(0,10)}${info['_ContactoPausa'] ? ' <span style="color:var(--text-muted);font-size:11px">⏸ PT — contador em pausa</span>' : ` (${info['Dias s/ Contacto']} dias)`}`
      : '—'],
    ['Data Criação',    info['Data Criação'] ? info['Data Criação'].substring(0,10) : '—'],
    ['Comentários',     info['Comentários']||'—'],
  ].map(([l,v])=>`<div class="cd-info-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');

  // Helper: cabeçalho de tab com botão de acção
  const nomeEsc=nome.replace(/'/g,"\\'");
  function tabHeader(label, section){
    return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">${label}</span>
      <button class="btn btn-primary btn-sm" onclick="openAddParaCliente('${section}','${nomeEsc}')">+ Adicionar</button>
    </div>`;
  }

  // Tab: Serviços (só activos / pendentes + plano motor)
  function estadoServBadge(e){
    if(!e||e==='—') return `<span class="badge" style="background:rgba(148,163,184,.1);color:var(--text-muted)">—</span>`;
    if(e==='Em curso') return `<span class="badge badge-ok">Em curso</span>`;
    if(e==='Pendente') return `<span class="badge badge-warn">Pendente</span>`;
    if(e==='Suspenso') return `<span class="badge badge-warn">Suspenso</span>`;
    return `<span class="badge badge-info">${e}</span>`;
  }
  function estadoMotorBadge(e){
    if(e==='Ativo') return `<span class="badge badge-ok">Ativo</span>`;
    if(e==='Suspenso') return `<span class="badge badge-warn">Suspenso</span>`;
    if(e==='Cancelado') return `<span class="badge badge-err">Cancelado</span>`;
    return `<span class="badge badge-info">${e||'—'}</span>`;
  }
  // Plano Motor — suprimir se já existe serviço activo com o mesmo código E o motor está Ativo
  // (se Suspenso/Cancelado, mostrar sempre para o estado não desaparecer)
  const motorCodigo = d.motor ? (d.motor['Plano Actual']||'') : '';
  const motorEstado = d.motor ? (d.motor['Estado Hoje']||'Ativo') : '';
  const motorJaNoServico = motorCodigo && motorEstado==='Ativo' && servicosAtivos.some(s=>(s['Código']||'')=== motorCodigo);
  const motorCard = (d.motor && !motorJaNoServico)
    ? `<div class="serv-card" style="border-left:3px solid var(--primary);background:rgba(99,102,241,.05)">
        <div class="serv-card-row">
          ${estadoMotorBadge(d.motor['Estado Hoje'])}
          <div style="min-width:0">
            <div class="serv-card-name">${_codigoToLabel(d.motor['Plano Actual'])} <span style="font-size:10px;font-weight:400;color:var(--text-muted)">(Motor)</span></div>
          </div>
          <div class="serv-card-tech">${info['PT']||'—'}</div>
          <div class="serv-card-price">${d.motor['Total 2026']?parseFloat(d.motor['Total 2026']).toFixed(2)+'€/ano':'—'}</div>
          <div style="display:flex;gap:2px">
            <button onclick="openEditDetalhe('motor2026',${d.motor.id},${JSON.stringify(d.motor).replace(/</g,'\\u003c').replace(/"/g,'&quot;')},'${nomeEsc}')" class="serv-action-btn" title="Editar">✏</button>
            <button onclick="deleteDetalhe('motor2026',${d.motor.id},'${nomeEsc}')" class="serv-action-btn danger" title="Eliminar">🗑</button>
          </div>
        </div>
        ${d.motor['Data Início']?`<div class="serv-card-date">Início: ${fmtDate(d.motor['Data Início'])}</div>`:''}
      </div>` : '';
  function _servCard(s, dimmed){
    const btnEdit = s['_idx']!=null
      ? `<button onclick="openEditDetalhe('servicos',${s['_idx']},${JSON.stringify(s).replace(/</g,'\\u003c').replace(/"/g,'&quot;')},'${nomeEsc}')" class="serv-action-btn" title="Editar">✏</button>` : '';
    const btnDel = s['_idx']!=null
      ? `<button onclick="deleteDetalhe('servicos',${s['_idx']},'${nomeEsc}')" class="serv-action-btn danger" title="Eliminar">🗑</button>` : '';
    return `<div class="serv-card${dimmed?' serv-card-dim':''}">
      <div class="serv-card-row">
        ${estadoServBadge(s['Estado do serviço'])}
        <div style="min-width:0">
          <div class="serv-card-name">${_codigoToLabel(s['Serviço']||s['Código'])||'—'}</div>
        </div>
        <div class="serv-card-tech">${s['Técnico Responsável']||'—'}</div>
        <div class="serv-card-price">${s['Ciclo']||'—'}</div>
        <div style="display:flex;gap:2px">${btnEdit}${btnDel}</div>
      </div>
      ${s['Data Conversão']?`<div class="serv-card-date">Início: ${fmtDate(s['Data Conversão'])}</div>`:''}
    </div>`;
  }
  const todosServicos = d.servicos||[];
  const servsAtivosCards = servicosAtivos.map(s=>_servCard(s,false)).join('');
  const servsConcluidos = todosServicos.filter(s=>{
    const e=(s['Estado do serviço']||'').trim();
    return e==='Concluído' || e==='Concluido';
  });
  const servsConcluidosCards = servsConcluidos.length
    ? `<div class="serv-section-label">Planos anteriores</div>${servsConcluidos.map(s=>_servCard(s,true)).join('')}`
    : '';

  // Conversoes — excluir PT/DUO (já no motor/servicos)
  const _isPTDUO = cod => /^(PT|DUO)/i.test(cod||'');
  const convsOutros = (d.conversoes||[]).filter(c=>!_isPTDUO(c['Código Serviço']));
  function _convCard(c){
    const btnDel = c['_idx']!=null
      ? `<button onclick="deleteDetalhe('conversoes',${c['_idx']},'${nomeEsc}')" class="serv-action-btn danger" title="Eliminar">🗑</button>` : '';
    return `<div class="serv-card">
      <div class="serv-card-row">
        <span class="badge badge-info" style="flex-shrink:0">${fmtDate(c['Data da Marcação/Início'])}</span>
        <div style="min-width:0">
          <div class="serv-card-name">${c['Serviço']||'—'} <span style="font-size:10px;font-weight:400;color:var(--text-muted)">${c['Código Serviço']||''}</span></div>
        </div>
        <div class="serv-card-tech">${c['Técnico Responsável']||c['Venda de']||'—'}</div>
        <div class="serv-card-price">${c['Valor total a Cobrar Serviço']!=null?parseFloat(c['Valor total a Cobrar Serviço']).toFixed(0)+'€':'—'}</div>
        <div style="display:flex;gap:2px">${btnDel}</div>
      </div>
    </div>`;
  }
  const convsCards = convsOutros.length
    ? `<div class="serv-section-label">Outros Serviços</div>${convsOutros.map(c=>_convCard(c)).join('')}`
    : '';

  const servsTable = (motorCard||servsAtivosCards||convsCards)
    ? `<div class="serv-cards">${motorCard}${servsAtivosCards}${convsCards}${servsConcluidosCards}</div>`
    : `<div class="tl-empty">Sem serviços registados</div>`;
  const servsHtml=tabHeader('Serviços','servicos')+servsTable;

  // Tab: Avaliações
  function avalBadge(status){
    if(!status||status==='—') return '—';
    if(status.includes('Válida'))   return `<span class="badge badge-ok">${status}</span>`;
    if(status.includes('Expirada')) return `<span class="badge badge-err">${status}</span>`;
    if(status.includes('Em falta')) return `<span class="badge badge-warn">${status}</span>`;
    if(status.includes('Hoje'))     return `<span class="badge badge-info">${status}</span>`;
    if(status.includes('Em breve')) return `<span class="badge badge-warn">${status}</span>`;
    if(status.includes('Agendada')) return `<span class="badge badge-info">${status}</span>`;
    return `<span class="badge badge-info">${status}</span>`;
  }
  // Ordenar avaliações: mais recente primeiro
  const avalsOrdenadas = [...(d.avaliacoes||[])].sort((a,b)=>{
    const da = a['Data']||'', db = b['Data']||'';
    return db.localeCompare(da);
  });
  const avalsTable = avalsOrdenadas.length
    ? `<div class="mini-table-wrap"><table class="mini-table"><thead><tr><th>Estado</th><th>Serviço</th><th>Data</th><th>Dias desde</th><th>Técnico</th><th>Nível</th><th></th></tr></thead><tbody>
       ${avalsOrdenadas.map(a=>{
         const status = a['_Status_Aval']||'';
         const expirada = status.includes('Expirada');
         const valida   = status.includes('Válida');
         const rowStyle = expirada ? 'background:rgba(239,68,68,.05)' : valida ? 'background:rgba(34,197,94,.04)' : '';
         const diasDesde = a['_AvalDiasDesde']!=null ? `${a['_AvalDiasDesde']} dias` : (a['Dias para Avaliação']!=null&&a['Dias para Avaliação']<0 ? `em ${Math.abs(a['Dias para Avaliação'])} dias` : '—');
         const fonteTag = a['_fonte'] ? `<span style="font-size:10px;color:var(--text-muted);margin-left:4px">(${a['_fonte']})</span>` : '';
         const col = a['_colecao']||'avaliacoes';
         const btnEdit = a['_idx']!=null
           ? `<button onclick="abrirEditarAval(${a['_idx']})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:13px" title="Editar" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">✏</button>` : '';
         const btnDel = a['_idx']!=null
           ? `<button onclick="deleteDetalhe('${col}',${a['_idx']},'${nomeEsc}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:13px" title="Eliminar" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'">🗑</button>` : '';
         return `<tr style="${rowStyle}">
           <td>${avalBadge(status)}</td>
           <td>${a['Serviço']||'—'}${fonteTag}</td>
           <td>${fmtDate(a['Data'])}</td>
           <td>${diasDesde}</td>
           <td>${a['Técnico Responsável']||'—'}</td>
           <td>${a['Nível']||'—'}</td>
           <td style="white-space:nowrap">${btnEdit}${btnDel}</td>
         </tr>`;
       }).join('')}
       </tbody></table></div>`
    : `<div class="tl-empty">Sem avaliações registadas</div>`;
  const avalsHtml=tabHeader('Avaliações','avaliacoes')+avalsTable;

  // Tab: Histórico de Faturação (2025 + 2026 juntos)
  const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MESES_SHORT=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const MES_ORD_CD={Janeiro:1,Fevereiro:2,'Março':3,Abril:4,Maio:5,Junho:6,Julho:7,Agosto:8,Setembro:9,Outubro:10,Novembro:11,Dezembro:12};

  // Linha de ano separador
  const anoSep = ano => `<tr>
    <td colspan="8" style="padding:14px 10px 4px;border-bottom:none">
      <span style="font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.5px;text-transform:uppercase;border-bottom:2px solid var(--navy);padding-bottom:2px">${ano}</span>
    </td></tr>`;

  let fatRows = '';
  let nFat = 0;

  // 2026
  if(d.pag_2026&&d.pag_2026.length){
    fatRows += anoSep(2026);
    nFat += d.pag_2026.length;

  el.innerHTML=`

          <button class="btn btn-sm" onclick="abrirMudarEstado('${nomeEsc}','Cancelado')" style="background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.3)">Cancelar</button>
          <button class="btn btn-sm" onclick="abrirMudarEstado('${nomeEsc}','Ativo')" style="background:rgba(34,197,94,.12);color:#16a34a;border:1px solid rgba(34,197,94,.4)">Reativar</button>

function switchTab(el, panelId){
  el.closest('.cd-main').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.closest('.cd-main').querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(panelId).classList.add('active');
}

async function openClienteEdit(nome){
  const clientes=sectionData['clientes']||await api('/api/data/clientes');
  const idx=clientes.findIndex(c=>c['Nome']===nome);
  if(idx===-1) return toast('Cliente não encontrado','error');
  sectionData['clientes']=clientes;
  await openEdit('clientes',idx);
  // Após guardar, recarregar a página do cliente
  const origSave=document.getElementById('modalSave').onclick;
  document.getElementById('modalSave').onclick=async()=>{
    await origSave();
    await openClienteDetalhe(nome);
  };
}

// Campo de cliente por secção
const CLIENT_FIELD_JS={
  conversoes:'Cliente', servicos:'Cliente', avaliacoes:'Nome',
  pag_clientes_2026:'Cliente', pag_clientes_2025:'Cliente',
  log_contratos:'Cliente', log_comercial:'Contacto',
};

async function deleteDetalhe(colecao, dbId, clienteNome){
  if(!confirm('Eliminar este registo?')) return;
  const res=await api(`/api/data/${colecao}/dbid/${dbId}`,{method:'DELETE'});
  if(res?.error){toast('Erro ao eliminar: '+res.error,'error');return;}
  sectionData[colecao]=null;
  toast('Registo eliminado');
  await openClienteDetalhe(clienteNome);
}

async function openEditDetalhe(section, dbId, rec, clienteNome){
  const sec=SECTIONS[section];
  if(!sec||!sec.fields) return toast('Secção sem campos definidos','error');
  document.getElementById('modalTitle').textContent='Editar — '+(sec.title||section);
  document.getElementById('modalBody').innerHTML='<div style="color:var(--text-muted);padding:20px 0">A carregar campos...</div>';
  document.getElementById('modal').classList.add('show');
  let html=''; const setups=[];
  for(const f of sec.fields){const r=await buildFieldHtml(f,rec[f.k]??'');html+=r.html;if(r.setup)setups.push(r.setup);}
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);
  document.getElementById('modalSave').onclick=async()=>{
    const updates={};
    for(const f of sec.fields) updates[f.k]=getFieldValue(f);
    const res=await api(`/api/data/${section}/dbid/${dbId}`,{method:'PUT',body:updates});
    if(res?.error){toast('Erro ao guardar: '+res.error,'error');return;}
    sectionData[section]=null;
    closeModal();
    toast('Registo atualizado');
    await openClienteDetalhe(clienteNome);
  };
}

async function openAddParaCliente(section, clienteNome){
  const sec=SECTIONS[section];
  if(!sec||!sec.fields) return toast('Secção sem campos definidos','error');
  const clientField=CLIENT_FIELD_JS[section];
  const safeNome=clienteNome.replace(/'/g,"\\'").replace(/"/g,'&quot;');

  document.getElementById('modalTitle').textContent='Adicionar — '+sec.title;
  document.getElementById('modalBody').innerHTML='<div style="color:var(--text-muted);padding:20px 0">A carregar campos...</div>';
  document.getElementById('modal').classList.add('show');

  let html=''; const setups=[];
  for(const f of sec.fields){
    if(f.k===clientField){
      // Campo cliente: pré-preenchido e bloqueado
      const safeId='field_'+f.k.replace(/[^a-zA-Z0-9]/g,'_');
      html+=`<div class="form-group">
        <label>${f.k}</label>
        <input type="text" id="${safeId}" value="${clienteNome}" readonly style="opacity:.65;cursor:not-allowed;border-style:dashed">
      </div>`;
    } else {
      const r=await buildFieldHtml(f,''); html+=r.html; if(r.setup) setups.push(r.setup);
    }
  }
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);

  document.getElementById('modalSave').onclick=async()=>{
    const rec={};
    for(const f of sec.fields) rec[f.k]=getFieldValue(f);

    // Auto-preencher Código a partir do precário antes de guardar
    let _isPrimeiroPT = false;
    if(section==='servicos' && rec['Serviço']){
      const precData = sectionData['precario_publico'] || (await api('/api/data/precario_publico'));
      sectionData['precario_publico'] = Array.isArray(precData)?precData:[];
      const precItem = sectionData['precario_publico'].find(p=>p['Serviço']===rec['Serviço']);
      const baseCode = precItem?.['Código']||'';
      if(baseCode){
        if(/^(PT|DUO)/i.test(baseCode)){
          const allServs = await api('/api/data/servicos');
          const prefix = baseCode+'-';
          const maxN = (Array.isArray(allServs)?allServs:[])
            .map(s=>s['Código']||'').filter(c=>c.startsWith(prefix))
            .reduce((m,c)=>{const n=parseInt(c.split('-').pop());return isNaN(n)?m:Math.max(m,n);},0);
          rec['Código'] = prefix+String(maxN+1).padStart(3,'0');
          // Verificar se é o 1º serviço PT/DUO do cliente
          const clientePTServs=(Array.isArray(allServs)?allServs:[]).filter(s=>
            s['Cliente']===clienteNome && /^(PT|DUO)/i.test(s['Código']||''));
          _isPrimeiroPT = clientePTServs.length===0;
        } else {
          rec['Código'] = baseCode;
        }
      }
    }

    const res = await api(`/api/data/${section}`,{method:'POST',body:rec});
    if(res?.error){ toast('Erro ao adicionar: '+res.error,'error'); return; }
    sectionData[section]=null;
    closeModal();

    // Serviço de gestão → criar ciclo automaticamente
    if(section==='servicos'){
      const precData = sectionData['precario_publico'] || (await api('/api/data/precario_publico'));
      const precItem = (Array.isArray(precData)?precData:[]).find(p=>p['Servi\xe7o']===rec['Servi\xe7o']);
      const codigo = precItem?.['C\xf3digo']||'';
      if(['GL4','GL12','GI'].includes(codigo)){
        const todosC = sectionData['ciclos'] || (await api('/api/data/ciclos'));
        const clientCiclos = (Array.isArray(todosC)?todosC:[]).filter(c=>c['Cliente']===clienteNome);
        const proxNum = clientCiclos.reduce((m,c)=>Math.max(m,parseInt(c['Ciclo N\xba'])||0),0)+1;
        const dataIni = rec['Data Marca\xe7\xe3o/In\xedcio']||null;
        let dataFim = null;
        if(dataIni){
          const d = new Date(dataIni);
          if(codigo==='GL4')  d.setDate(d.getDate()+28);
          if(codigo==='GL12') d.setDate(d.getDate()+84);
          if(codigo!=='GI') dataFim = d.toISOString().slice(0,10);
        }
        const cicloBody = {
          'Cliente': clienteNome,
          'Tipo': codigo,
          'Ciclo N\xba': proxNum,
          'Data In\xedcio': dataIni||null,
          'Data Fim': dataFim,
          'GP': rec['T\xe9cnico Respons\xe1vel']||null,
        };
        const cr = await api('/api/data/ciclos',{method:'POST',body:cicloBody});
        sectionData['ciclos']=null;
        if(!cr.error) toast(`Servi\xe7o adicionado \xb7 Ciclo ${codigo} #${proxNum} criado `);
        else toast(`Servi\xe7o adicionado \xb7 Erro ao criar ciclo: ${cr.error}`,'error');
        await openClienteDetalhe(clienteNome);
        return;
      }
    }

    // PT/DUO 1º serviço → propor criação de Inscrição (AMR)
    if(section==='servicos' && _isPrimeiroPT){
      if(confirm(`Primeiro serviço PT de ${clienteNome}.\nCriar Avaliação de Inscrição (AMR)?`)){
        const allAvals = await api('/api/data/avaliacoes');
        const maxAMR = (Array.isArray(allAvals)?allAvals:[])
          .map(a=>a['_CodServ']||'').filter(c=>/^AMR-\d+$/.test(c))
          .reduce((m,c)=>{const n=parseInt(c.split('-')[1]);return isNaN(n)?m:Math.max(m,n);},0);
        const novoCod='AMR-'+String(maxAMR+1).padStart(3,'0');
        const ar=await api('/api/data/avaliacoes',{method:'POST',body:{
          'Nome':clienteNome,
          'Serviço':'AMR (Aval. Metab. Repouso)',
          '_CodServ':novoCod,
          'Origem':'Inscrição',
          'Nível':'N1 - Avaliar',
          'Cobrança':'Já pago (incluído no serviço)',
        }});
        sectionData['avaliacoes']=null;
        if(!ar.error) toast(`Serviço adicionado · Inscrição ${novoCod} criada`,'success');
        else toast(`Serviço adicionado · Erro na inscrição: ${ar.error}`,'error');
        await openClienteDetalhe(clienteNome);
        return;
      }
    }

    // Atualizar Status do cliente se "Sem Serviço" e serviço está Em curso
    if(section==='servicos' && rec['Estado do serviço']==='Em curso'){
      const cliData=sectionData['clientes']||(await api('/api/data/clientes'));
      const cli=(Array.isArray(cliData)?cliData:[]).find(c=>c['Nome']===clienteNome);
      if(cli?.['Status']==='Sem Serviço'){
        await api(`/api/clientes/${encodeURIComponent(clienteNome)}/estado`,{method:'POST',body:{status:'Ativo'}});
        sectionData['clientes']=null;
      }
    }

    toast('Registo adicionado');
    await openClienteDetalhe(clienteNome);
  };
}

// MUDAR ESTADO DO CLIENTE (Suspender / Cancelar / Reativar / Férias / Desconto)
// 
async function abrirMudarEstado(nome, estadoAlvo){
  // Verificar se é híbrido
  const clientes = sectionData['clientes'] || await api('/api/data/clientes');
  const cli = clientes.find(c=>c['Nome']===nome)||{};
  const isHibrido = cli['Regime']==='Híbrido';

  const labels = {
    'Suspenso':'Suspender cliente','Cancelado':'Cancelar contrato',
    'Férias':'Registar férias','Desconto':'Aplicar desconto','Ativo':'Reativar cliente'
  };
  const colors = {
    'Suspenso':'rgba(245,158,11,.08)','Cancelado':'rgba(239,68,68,.06)',
    'Férias':'rgba(34,197,94,.06)','Desconto':'rgba(99,102,241,.06)','Ativo':'rgba(34,197,94,.06)'
  };

  const hoje = new Date().toISOString().substring(0,10);

  // Campos extra conforme tipo
  let extraFields = '';
  if(estadoAlvo==='Férias'){
    extraFields = `<div class="form-group"><label>Data Fim (fim das férias)</label><input type="date" id="est_data_fim" value=""></div>`;
  } else if(estadoAlvo==='Desconto'){
    extraFields = `
      <div class="form-group"><label>Desconto %</label><input type="number" id="est_desconto" placeholder="ex: 25" min="0" max="100" step="5"></div>
      <div class="form-group"><label>Data Fim (opcional)</label><input type="date" id="est_data_fim" value=""></div>`;
  } else if(estadoAlvo==='Suspenso'||estadoAlvo==='Cancelado'){
    extraFields = `<div class="form-group"><label>Data Fim (opcional — deixar vazio = indefinido)</label><input type="date" id="est_data_fim" value=""></div>`;
  }

  // Aviso par DUO para híbridos
  const parAviso = isHibrido && cli['Par Híbrido'] && (estadoAlvo==='Suspenso'||estadoAlvo==='Cancelado')
    ? `<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px">
         Cliente DUO — o par <strong>${cli['Par Híbrido']}</strong> passará a pagar o valor single (${cli['Valor Single']||'?'}€/mês).
       </div>` : '';
  const reativarAviso = isHibrido && cli['Par Híbrido'] && estadoAlvo==='Ativo'
    ? `<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:13px">
         Cliente DUO — ao reativar, ambos voltam ao valor duo (${cli['Valor Duo Base']||'?'}€/mês).
       </div>` : '';

  document.getElementById('modalTitle').textContent = labels[estadoAlvo]||estadoAlvo;
  document.getElementById('modalBody').innerHTML = `
    <div style="background:${colors[estadoAlvo]||''};border-radius:8px;padding:14px;margin-bottom:16px">
      ${parAviso}${reativarAviso}
      <div class="form-group"><label>Data de início</label><input type="date" id="est_data_inicio" value="${hoje}"></div>
      <div class="form-group">
        <label>Motivo</label>
        <select id="est_motivo">
          <option value="">Selecionar...</option>
          <option>Lesão</option><option>Viagem</option><option>Férias</option>
          <option>Dificuldades financeiras</option><option>Mudança de cidade</option>
          <option>Falta de tempo</option><option>Insatisfação</option><option>Outro</option>
        </select>
      </div>
      ${extraFields}
      <div class="form-group"><label>Notas (opcional)</label><textarea id="est_notas" rows="2" placeholder="Observações adicionais..."></textarea></div>
    </div>`;
  document.getElementById('modal').classList.add('show');

  document.getElementById('modalSave').onclick = async()=>{
    const body = {
      estado:      estadoAlvo,
      motivo:      document.getElementById('est_motivo')?.value || '',
      data_inicio: document.getElementById('est_data_inicio')?.value || hoje,
      data_fim:    document.getElementById('est_data_fim')?.value || null,
      notas:       document.getElementById('est_notas')?.value || '',
      desconto_pct: document.getElementById('est_desconto')
                    ? (parseFloat(document.getElementById('est_desconto').value)||null)/100 : null,
    };
    const res = await api(`/api/clientes/${encodeURIComponent(nome)}/estado`,{method:'POST',body});
    if(res.ok){
      closeModal();
      sectionData['clientes']=null; sectionData['motor2026']=null; sectionData['log_contratos']=null;
      toast(`Estado alterado → ${estadoAlvo}`);
      await openClienteDetalhe(nome);
    } else {
      toast(res.error||'Erro ao alterar estado','error');
    }
  };
}

function onStatusBadge(s){
  if(!s||s==='—') return `<span class="badge" style="background:rgba(148,163,184,.1);color:var(--text-muted)">—</span>`;
  const l=s.toLowerCase();
  if(l.includes('ganho')||l.includes('convertido')) return `<span class="badge badge-ok">${s}</span>`;
  if(l.includes('outras')||l.includes('perdido')||l.includes('não avançou')||l==='inativo') return `<span class="badge badge-err">${s}</span>`;
  if(l.includes('agendado')) return `<span class="badge badge-info">${s}</span>`;
  if(l==='ativo'||l.includes('em análise')||l.includes('pendente')) return `<span class="badge badge-warn">${s}</span>`;
  return `<span class="badge badge-info">${s}</span>`;
}

function resultadoBadge(r){
  if(!r) return '—';
  const l=r.toLowerCase();
  if(l.includes('ganho')||l.includes('convertido')) return `<span class="badge badge-ok">${r}</span>`;
  if(l.includes('perdido')||l.includes('não avançou')) return `<span class="badge badge-err">${r}</span>`;
  if(l.includes('agendado')) return `<span class="badge badge-info">${r}</span>`;
  if(l.includes('sem resposta')) return `<span class="badge" style="background:rgba(148,163,184,.1);color:var(--text-muted)">${r}</span>`;
  return `<span class="badge badge-warn">${r}</span>`;
}

let _pipSelected=null,_pipFilter='',_pipStatusFilter='';

async function renderPipeline(el){
  el.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar pipeline...</div>`;
  if(!sectionData['pipeline']){
    const d=await api('/api/data/pipeline');
    if(d&&d.error){el.innerHTML=`<p style="color:var(--danger)">${d.error}</p>`;return;}
    sectionData['pipeline']=Array.isArray(d)?d:[];
  }
  _renderPipelineMD(el);
}

function _renderPipelineMD(el){
  const data=sectionData['pipeline']||[];
  const q=_pipFilter.toLowerCase();
  const filtered=data.filter(r=>{
    const contacto=(r['Contacto']||'').toLowerCase();
    const aberta=r['Aberta/Fechada']||'';
    const status=(r['Status']||'').toLowerCase();
    const matchQ=!q||contacto.includes(q)||(r['Tipo']||'').toLowerCase().includes(q);
    const matchS=_pipStatusFilter==='Todas'?true:
                 _pipStatusFilter?status.includes(_pipStatusFilter.toLowerCase()):
                 aberta==='Aberta';
    return matchQ&&matchS;
  });

  const listItems=filtered.map(r=>{
    const contacto=r['Contacto']||'—';
    const nON=r['Nº ON'];
    const initials=contacto.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const status=r['Status']||'';
    const tipo=r['Tipo']||'';
    const dataInicio=r['Data Início']?r['Data Início'].substring(0,10):'';
    const isActive=_pipSelected===nON;
    const clickFn=nON?`_selectPipeline(${nON})`:`openEdit('pipeline',${data.indexOf(r)})`;
    const dblFn=nON?`_openPipFullPage(${nON})`:'';
    return `<div class="md-item${isActive?' active':''}" onclick="${clickFn}"${dblFn?` ondblclick="${dblFn}"`:''}">
      <div class="md-avatar" style="background:var(--navy-soft)">${initials}</div>
      <div class="md-item-body">
        <div class="md-name">${contacto}</div>
        <div class="md-sub">${[tipo,status].filter(Boolean).join(' · ')||'—'}${dataInicio?' · '+dataInicio:''}</div>
      </div>
    </div>`;
  }).join('')||`<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">Sem resultados</div>`;

  el.innerHTML=`
    <div class="page-header">
      <div><h1>Pipeline</h1><div class="subtitle">${filtered.length} oportunidade${filtered.length!==1?'s':''}</div></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="sectionData['pipeline']=null;_pipSelected=null;renderPipeline(document.getElementById('mainContent'))">Atualizar</button>
        <button class="btn btn-primary btn-sm" onclick="openAdd('pipeline')">+ Nova ON</button>
      </div>
    </div>
    <div class="md-wrap${_pipSelected?' md-has-selection':''}">
      <div class="md-list">
        <div class="md-list-search">
          <input id="pip-search" type="text" placeholder="Pesquisar pipeline..." value="${_pipFilter.replace(/"/g,'&quot;')}"
            oninput="_filterPipInput(this.value)">
        </div>
        <div class="md-filters">
          <button class="md-filter-btn${!_pipStatusFilter?' active':''}" onclick="_pipStatusFilter='';_renderPipelineMD(document.getElementById('mainContent'))">Abertas</button>
          <button class="md-filter-btn${_pipStatusFilter==='Todas'?' active':''}" onclick="_pipStatusFilter='Todas';_renderPipelineMD(document.getElementById('mainContent'))">Todas</button>
          <button class="md-filter-btn${_pipStatusFilter==='Ganho'?' active':''}" onclick="_pipStatusFilter='Ganho';_renderPipelineMD(document.getElementById('mainContent'))">Ganhas</button>
          <button class="md-filter-btn${_pipStatusFilter==='Perdido'?' active':''}" onclick="_pipStatusFilter='Perdido';_renderPipelineMD(document.getElementById('mainContent'))">Perdidas</button>
        </div>
        <div class="md-items">${listItems}</div>
      </div>
      <button class="md-back-btn" onclick="_pipSelected=null;sessionStorage.removeItem('crm_pip');_renderPipelineMD(document.getElementById('mainContent'))">&#8592; Voltar</button>
      <div class="md-detail" id="pip-detail-pane">
        ${_pipSelected
          ?'<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar...</div>'
          :'<div class="md-empty-pane"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span>Seleciona uma oportunidade para ver o detalhe</span></div>'}
      </div>
    </div>`;
  if(_pipSelected) _loadPipDetail(_pipSelected);
}

function _filterPipInput(val){
  _pipFilter=val;
  _renderPipelineMD(document.getElementById('mainContent'));
  const inp=document.getElementById('pip-search');
  if(inp){inp.focus();inp.setSelectionRange(val.length,val.length);}
}

function _selectPipeline(nON){
  _pipSelected=nON;
  _renderPipelineMD(document.getElementById('mainContent'));
}

async function _openPipFullPage(nON){
  const el=document.getElementById('mainContent');
  el.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar ON ${nON}...</div>`;
  const d=await api(`/api/on/${nON}`);
  if(d.error){el.innerHTML=`<p style="color:var(--danger)">${d.error}</p>`;return;}
  renderONDetalhe(el,nON,d,false);

async function _loadPipDetail(nON){

  if(!pane) return;
  pane.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar ON ${nON}...</div>`;

  if(d.error){pane.innerHTML=`<p style="color:var(--danger);padding:24px">${d.error}</p>`;return;}
  renderONDetalhe(pane,nON,d,true);

function renderONDetalhe(el, nON, d, inPane=false){
  const info=d.info||{};
  const log=d.log_comercial||[];
  const hist=d.historico||[];
  const contacto=info['Contacto']||'';
  const nONEsc=String(nON);
  const contactoEsc=contacto.replace(/'/g,"\\'");

  // Status do ON (da última entrada do log ou Em Análise)
  const ultimoResultado=log.length ? (log[0]['Resultado']||'Em Análise') : (info['Status']||'Em Análise');
  const fechado=info['Aberta/Fechada']==='Fechada';

  // KPIs
  const nContactos=log.length;
  const ultimaData=log.length ? (log[0]['Data Ação']||'').substring(0,10) : '—';
  const diasAberto = info['Data Início']
    ? Math.floor((new Date()-new Date(info['Data Início']))/86400000) : '—';

  // Info lateral
  const infoRows=[
    ['Tipo',          info['Tipo']||'—'],
    ['Comercial',     info['Comercial']||'—'],
    ['Fonte',         info['Fonte Aquisição']||'—'],
    ['Canal',         info['Canal Contacto']||'—'],
    ['Parceiro',      info['Parceiro']||'—'],
    ['Segmento',      info['Segmento Mercado']||'—'],

    const btnEdit = l['_idx']!=null

    const btnDel = l['_idx']!=null
      ? `<button onclick="deleteONLog('log_comercial',${l['_idx']},${nONEsc})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:13px" title="Eliminar" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'"></button>` : '';

      <td>${l['Tipo Ação']||'—'}</td>

  // Tab: Histórico timeline

    ? `<div class="timeline">${hist.map(h=>buildHistItem(h)).join('')}</div>`
    : `<div class="tl-empty">Sem histórico de sistema.</div>`;

        ${inPane?'':`<button class="btn btn-ghost btn-sm" onclick="navigate('pipeline')" style="font-size:18px;padding:6px 10px">←</button>`}

        </div>
        <div id="tab-on-log"  class="tab-panel active">${logHtml}</div>
        <div id="tab-on-hist" class="tab-panel">${histHtml}</div>
      </div>
    </div>`;
}

  document.getElementById('modalTitle').textContent=`Converter ON ${nON} — ${contacto}`;
  document.getElementById('modalBody').innerHTML=`
    <p style="color:var(--text-muted);margin-bottom:16px;font-size:13px">Escolhe para onde converter <strong>${contacto}</strong>. Será criado um registo novo com os dados do ON.</p>
    <div class="form-group"><label>Converter em</label>
      <select id="conv_tipo">
        <option value="cliente">&#x1F465; Cliente</option>
        <option value="parceiro">&#x1F91D; Parceiro</option>
      </select></div>`;
  document.getElementById('modalSave').textContent='Converter';
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalSave').onclick=async()=>{
    const tipo=document.getElementById('conv_tipo').value;
    if(tipo==='cliente'){
      const clData=sectionData['clientes']||(await api('/api/data/clientes'));
      const maxID=(Array.isArray(clData)?clData:[]).reduce((m,c)=>Math.max(m,parseInt(c['ID'])||0),0);
      const novoID=maxID+1;
      const cr=await api('/api/data/clientes',{method:'POST',body:{
        'Nome':contacto,'ID':novoID,'Status':'Ativo',
        'Data Cria\xe7\xe3o':new Date().toISOString().slice(0,10)
      }});
      sectionData['clientes']=null;
      closeModal();
      if(!cr.error) toast(`Cliente "${contacto}" criado com ID ${novoID} `,'success');
      else toast('Erro ao criar cliente: '+cr.error,'error');
    } else {
      const pr=await api('/api/data/parceiros',{method:'POST',body:{'Nome / Empresa':contacto}});
      sectionData['parceiros']=null;
      closeModal();
      if(!pr.error) toast(`Parceiro "${contacto}" criado `,'success');
      else toast('Erro ao criar parceiro: '+pr.error,'error');
    }
    await openONDetalhe(nON);
  };
}

      <textarea id="on_resumo" rows="2" placeholder="Resumo do contacto..."></textarea></div>
    <div class="form-group"><label>Comercial</label>
      <input type="text" id="on_comercial" list="dl_on_col" placeholder="(opcional)" autocomplete="off">

    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0 16px">
    <div class="form-group"><label>Estado da oportunidade</label>
      <select id="on_aberta" onchange="_onUpdStatus()">
        <option value="Aberta" selected>Aberta</option>
        <option value="Fechada">Fechada</option>
      </select></div>
    <div id="on_status_wrap">
      <div class="form-group"><label>Status</label>
        <select id="on_status" onchange="_onUpdSub()">
          <option>Ativo</option><option>Inativo</option>
        </select></div>
    </div>
    <!-- Ativo -->
    <div id="on_ativo_wrap">
      <div class="form-group"><label>Resultado</label>
        <select id="on_ativo_res" onchange="_onUpdAtivoRes()">
          <option>Pendente</option><option>Agendado</option><option>Sem resposta</option>
          <option>Perdido</option><option>Não Avançou</option>
        </select></div>
      ${_plProxBlock('on_ativo_prox')}
    </div>
    <!-- Inativo -->
    <div id="on_inativo_wrap" style="display:none">
      <div class="form-group"><label>Motivo</label>
        <select id="on_inativo_mot" onchange="_onUpdInativoMot()">
          <option>Agendado</option><option>Sem interesse</option><option>Outras</option>
        </select></div>
      ${_plProxBlock('on_inativo_prox')}
    </div>
    <!-- Fechada: Ganho / Outras -->
    <div id="on_fechada_wrap" style="display:none">
      <div id="on_outras_wrap" style="display:none">
        <div class="form-group"><label>Motivo</label>
          <input type="text" id="on_outras_motivo" placeholder="Motivo de não conversão"></div>

      <div id="on_converter_wrap" style="display:none">
        <div class="form-group" style="background:rgba(170,255,0,.08);border:1px solid rgba(170,255,0,.3);border-radius:8px;padding:14px">

          <select id="on_converter">

  document.getElementById('modal').classList.add('show');

  window._onUpdStatus=function(){
    const ab=document.getElementById('on_aberta').value;
    const sw=document.getElementById('on_status_wrap');
    const sel=document.getElementById('on_status');
    const fecW=document.getElementById('on_fechada_wrap');
    if(ab==='Fechada'){
      sw.style.display='';
      fecW.style.display='';

      document.getElementById('on_inativo_wrap').style.display='none';
      _onUpdSub();
    } else {
      sel.innerHTML='<option>Ativo</option><option>Inativo</option>';
      fecW.style.display='none';
      _onUpdSub();
    }
  };
  window._onUpdSub=function(){
    const ab=document.getElementById('on_aberta').value;
    const st=document.getElementById('on_status').value;
    if(ab==='Aberta'){
      document.getElementById('on_ativo_wrap').style.display= st==='Ativo'?'':'none';
      document.getElementById('on_inativo_wrap').style.display= st==='Inativo'?'':'none';
      document.getElementById('on_fechada_wrap').style.display='none';
    } else {
      document.getElementById('on_outras_wrap').style.display= st==='Outras'?'':'none';
      document.getElementById('on_converter_wrap').style.display= st==='Ganho'?'':'none';
    }
  };
  window._onUpdAtivoRes=function(){
    const r=document.getElementById('on_ativo_res').value;
    const p=document.getElementById('on_ativo_prox');
    if(p) p.style.display= r==='Agendado'?'':'none';
  };
  window._onUpdInativoMot=function(){
    const m=document.getElementById('on_inativo_mot').value;
    const p=document.getElementById('on_inativo_prox');
    if(p) p.style.display= m==='Agendado'?'':'none';
  };

  // Init: Aberta/Ativo is default, hide prox blocks
  document.getElementById('on_ativo_prox').style.display='none';
  document.getElementById('on_inativo_prox').style.display='none';

  document.getElementById('modalSave').textContent='Guardar';
  document.getElementById('modalSave').onclick=async()=>{
    const dataAcao=document.getElementById('on_data').value||hoje;
    const horaAcao=document.getElementById('on_hora').value||'';
    const canal=document.getElementById('on_canal').value;
    const tipoAcao=document.getElementById('on_tipo_acao').value;
    const resumo=document.getElementById('on_resumo').value||'';
    const comercial=document.getElementById('on_comercial').value||null;
    const aberta=document.getElementById('on_aberta').value;
    const status=document.getElementById('on_status').value;
    const outras=(document.getElementById('on_outras_motivo')||{}).value||'';
    const converter=(document.getElementById('on_converter')||{}).value||'';

    if(status==='Ganho'&&aberta==='Fechada'&&!converter) return toast('Seleciona em quem converter (ou "só fechar ON")','error');

    let resultado='';
    let proxData=null, proxHora=null, proxCanal=null;
    if(aberta==='Aberta'){
      if(status==='Ativo'){
        resultado=(document.getElementById('on_ativo_res')||{}).value||'Pendente';
        if(resultado==='Agendado'){
          proxData=(document.getElementById('on_ativo_prox_data')||{}).value||null;
          proxHora=(document.getElementById('on_ativo_prox_hora')||{}).value||null;
          proxCanal=(document.getElementById('on_ativo_prox_canal')||{}).value||null;
        }
      } else {
        resultado=(document.getElementById('on_inativo_mot')||{}).value||'Inativo';
        if(resultado==='Agendado'){
          proxData=(document.getElementById('on_inativo_prox_data')||{}).value||null;
          proxHora=(document.getElementById('on_inativo_prox_hora')||{}).value||null;
          proxCanal=(document.getElementById('on_inativo_prox_canal')||{}).value||null;
        }
      }
    } else {
      resultado= outras?`Outras — ${outras}`:status;
    }

    const logRec={
      'Nº ON':String(nON),'Contacto':contacto,
      'Data Ação':horaAcao?`${dataAcao}T${horaAcao}`:dataAcao,
      'Canal':canal,'Tipo Ação':tipoAcao,
      'Resumo':resumo||tipoAcao,'Resultado':resultado,
      'Comercial':comercial,
      'Data Próxima Ação':proxData||null,
      'Resumo Próxima':proxData?`${proxCanal||''} ${proxHora||''}`.trim():null,
    };
    const logRes=await api('/api/data/log_comercial',{method:'POST',body:logRec});
    if(logRes.error){toast('Erro ao registar: '+logRes.error,'error');return;}
    sectionData['log_comercial']=null;

    // Actualizar o pipeline se mudar de estado
    const plData=sectionData['pipeline']||(await api('/api/data/pipeline'));
    const plArr=Array.isArray(plData)?plData:[];
    const plIdx=plArr.findIndex(r=>String(r['Nº ON'])===String(nON));
    if(plIdx>=0){
      const upd={'Aberta/Fechada':aberta,'Status':outras?`Outras — ${outras}`:status};
      await api(`/api/data/pipeline/${plIdx}`,{method:'PUT',body:upd});
      sectionData['pipeline']=null;
    }

    // Converter em cliente ou parceiro
    if(aberta==='Fechada'&&status==='Ganho'&&converter){
      const hoje2=new Date().toISOString().slice(0,10);
      if(converter==='cliente'){
        const clData=sectionData['clientes']||(await api('/api/data/clientes'));
        const maxID=(Array.isArray(clData)?clData:[]).reduce((m,c)=>Math.max(m,parseInt(c['ID'])||0),0);
        const novoID=maxID+1;
        const cr=await api('/api/data/clientes',{method:'POST',body:{
          'Nome':contacto,'ID':novoID,'Status':'Ativo','Data Criação':hoje2
        }});
        sectionData['clientes']=null;
        closeModal();
        toast(cr.error?`Contacto registado · Erro cliente: ${cr.error}`:`Contacto registado · Cliente "${contacto}" ID ${novoID} `,cr.error?'error':'success');
      } else {
        const pr=await api('/api/data/parceiros',{method:'POST',body:{'Nome / Empresa':contacto}});
        sectionData['parceiros']=null;
        closeModal();
        toast(pr.error?`Contacto registado · Erro parceiro: ${pr.error}`:`Contacto registado · Parceiro "${contacto}" criado `,pr.error?'error':'success');
      }
    } else {
      closeModal();
      toast('Contacto registado ');
    }
    await openONDetalhe(nON);
  };
}

async function deleteONLog(colecao, idx, nON){
  if(!confirm('Eliminar este contacto?')) return;
  await api(`/api/data/${colecao}/${idx}`,{method:'DELETE'});
  sectionData[colecao]=null;
  toast('Eliminado');
  await openONDetalhe(nON);
}

async function openEditONLog(idx, nON){
  const sec=SECTIONS['log_comercial'];
  if(!sec||!sec.fields) return toast('Campos não definidos','error');

  // Carregar registo actual
  const allData=await api('/api/data/log_comercial');
  if(!Array.isArray(allData)||!allData[idx]) return toast('Registo não encontrado','error');
  const rec=allData[idx];

  document.getElementById('modalTitle').textContent=` Editar contacto — ON ${nON}`;
  document.getElementById('modalBody').innerHTML='<div style="color:var(--text-muted);padding:20px 0">A carregar...</div>';
  document.getElementById('modal').classList.add('show');

  let html=''; const setups=[];
  for(const f of sec.fields){
    const val=rec[f.k]!=null?rec[f.k]:'';
    if(f.k==='Nº ON'||f.k==='Contacto'){
      html+=`<div class="form-group"><label>${f.k}</label>
        <input type="text" id="field_${f.k.replace(/[^a-zA-Z0-9]/g,'_')}" value="${String(val).replace(/"/g,'&quot;')}" readonly style="opacity:.65;cursor:not-allowed;border-style:dashed">
      </div>`;
    } else {
      const r=await buildFieldHtml(f,val); html+=r.html; if(r.setup) setups.push(r.setup);
    }
  }
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);

  document.getElementById('modalSave').onclick=async()=>{
    const updates={};
    for(const f of sec.fields) updates[f.k]=getFieldValue(f);
    updates['Nº ON']=rec['Nº ON'];
    updates['Contacto']=rec['Contacto'];
    await api(`/api/data/log_comercial/${idx}`,{method:'PUT',body:updates});
    sectionData['log_comercial']=null;
    closeModal();
    toast('Contacto actualizado');
    await openONDetalhe(nON);
  };
}

async function openColaboradorDetalhe(nome){
  currentSection = 'dados_colaboradores';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.key==='dados_colaboradores'));
  const el = document.getElementById('mainContent');
  el.innerHTML = `<div style="padding:40px;color:var(--text-muted);text-align:center">A carregar...</div>`;
  const d = await api(`/api/colaborador/${encodeURIComponent(nome)}`);
  if(d.error){ el.innerHTML=`<p style="color:var(--danger);padding:40px">${d.error}</p>`; return; }
  renderColaboradorDetalhe(el, nome, d);
}

function renderColaboradorDetalhe(el, nome, d){
  const info = d.info || {};
  const logEv = d.log_colaboradores || [];
  const hist  = d.historico || [];
  const subOrig  = d.sub_como_original || [];
  const subSubst = d.sub_como_substituto || [];
  const nomeEsc = nome.replace(/'/g,"\\'");
  const falhas = d.falhas || [];
  const totalPontos = d.totalPontos || 0;
  const nivelAtual = d.nivelAtual || {nivel:0,designacao:'—',medida:'—'};
  const catalogo = d.catalogo || [];
  const vendasLog = d.vendas_log || [];
  const vendasBonus = d.vendas_bonus || null;

  //  Ficha de dados 
  const CAMPOS_FICHA = [
    ['Cargo','Cargo'],['Estado','Estado'],['Tipo de Contrato','Tipo de Contrato'],
    ['Tipo de regime','Regime'],['Tipo de Cedência','Cedência'],
    ['Valor da Cedência','Valor Cedência (€)'],['Condições','Condições (%)'],
    ['Contacto Telefónico','Telefone'],['Contacto Email','Email'],['Iban','IBAN'],
  ];
  const fichaRows = CAMPOS_FICHA
    .filter(([k])=>info[k])
    .map(([k,label])=>`<tr><td style="color:var(--text-muted);font-size:12px;padding:6px 12px;white-space:nowrap">${label}</td><td style="padding:6px 12px;font-weight:500">${info[k]}</td></tr>`)
    .join('');
  const fichaHtml = `<div class="table-wrap" style="max-width:540px">
    <table class="tbl"><tbody>${fichaRows||'<tr><td colspan="2" style="color:var(--text-muted)">Sem dados</td></tr>'}</tbody></table>
  </div>`;

  //  Log de eventos (admissão, suspensão, …) 
  const evBadge = ev => {
    const map = {Admissão:'badge-ok',Suspensão:'badge-warn',Demissão:'badge-danger',Promoção:'badge-info',Transferência:'badge'};
    return `<span class="badge ${map[ev]||'badge'}">${ev}</span>`;
  };
  const evRows = logEv.map((e,i) => `<tr>
    <td style="font-size:12px;color:var(--text-muted)">${fmtDate(e['Data'])}</td>
    <td>${evBadge(e['Evento']||'—')}</td>
    <td>${e['Cargo Novo']||'—'}</td>
    <td style="font-size:12px">${e['Motivo']||'—'}</td>
    <td style="font-size:12px;color:var(--text-muted)">${e['Notas']||''}</td>
    <td style="font-size:11px;color:var(--text-muted)">${e['Registado por']||''}</td>
    <td class="actions">
      <button onclick="openEditById('log_colaboradores','${(e._id||'').replace(/'/g,"\\'")}','${nomeEsc}')" title="Editar">&#x270F;</button>
    </td>
  </tr>`).join('');
  const logEvHtml = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn btn-primary btn-sm" onclick="openAddColabLog('${nomeEsc}')">+ Registar evento</button>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>Data</th><th>Evento</th><th>Cargo Novo</th><th>Motivo</th><th>Notas</th><th>Registado por</th><th>Ações</th></tr></thead>
        <tbody>${evRows||'<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">Sem eventos registados</td></tr>'}</tbody>
      </table>
    </div>`;

  //  Histórico de sistema 
  const histHtml = hist.length
    ? `<div class="timeline">${hist.map(h=>buildHistItem(h)).join('')}</div>`
    : `<div class="tl-empty">Sem histórico de sistema.<br><small>Edições à ficha e eventos registados aparecerão aqui automaticamente.</small></div>`;

  //  Substituições 
  const _subEstadoBadge = e => e==='Ativo'
    ? `<span class="badge badge-ok">Ativo</span>`
    : `<span class="badge" style="background:rgba(148,163,184,.15);color:var(--text-muted)">Concluído</span>`;
  const _subRow = (r, showComp) => {
    const vps = parseFloat(r['Valor por Sessão'])||0;
    const vtot = parseFloat(r['Valor Total'])||0;
    return `<tr>
      <td style="font-weight:500">${r['Cliente']||'—'}</td>
      <td>${r['Técnico Original']||'—'}</td>
      <td>${r['Técnico Substituto']||'—'}</td>
      <td style="font-size:12px">${r['Data Início']||'—'} ${r['Data Fim']?'→ '+r['Data Fim']:''}</td>
      <td style="text-align:center">${r['Frequência Semanal']||'—'}x/sem</td>
      <td style="text-align:right">${(parseFloat(r['Mensalidade'])||0).toFixed(0)}€</td>
      <td style="text-align:center">${r['Sessões Dadas']||0}</td>
      <td style="text-align:right;font-size:11px;color:var(--text-muted)">${vps.toFixed(2)}€/s</td>
      <td style="text-align:right;font-weight:600;color:var(--success)">${vtot.toFixed(2)}€</td>
      <td>${_subEstadoBadge(r['Estado']||'Ativo')}</td>

      </td>

    <th style="text-align:right">Total</th><th>Estado</th><th>Ações</th>
  </tr></thead>`;
  const allSubs = [...subSubst,...subOrig.filter(r=>!subSubst.find(s=>s.id===r.id))];
  const subRows = allSubs.map(r=>_subRow(r,true)).join('');
  const subHtml = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">

      ${subRows||'<tr><td colspan="11" style="text-align:center;color:var(--text-muted);padding:16px">Sem substituições registadas</td></tr>'}
    </tbody></table></div>`;

  //  Falhas e Sanções 
  const _nivelBadge=(pts,des)=>{
    if(pts<=0) return `<span class="badge badge-ok"> ${des}</span>`;
    if(pts<=2) return `<span class="badge badge-info">${des}</span>`;
    if(pts<=4) return `<span class="badge badge-warn">${des}</span>`;
    return `<span class="badge badge-err">${des}</span>`;
  };
  const _catBadge=c=>c==='Grave'||c==='Muito Grave'?`<span class="badge badge-err">${c}</span>`:c==='Não Grave'?`<span class="badge badge-info">${c}</span>`:`<span class="badge badge-warn">${c}</span>`;
  const falhasRows=falhas.map((f,i)=>`<tr>

    <td>${_catBadge(f['Categoria']||'—')}</td>

    <td style="font-size:12px;color:var(--text-muted)">${f['Âmbito']||'—'}</td>
    <td style="font-size:12px">${f['Notas']||'—'}</td>
    <td class="actions"><button class="del" onclick="deleteFalha(${f.id||0},'${nomeEsc}')" title="Eliminar">&#x1f5d1;</button></td>
  </tr>`).join('');
  const falhasHtml=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:16px">
        <div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Pontos totais</div>
          <div style="font-size:28px;font-weight:800;color:${totalPontos>4?'var(--danger)':totalPontos>2?'var(--warning)':'var(--success)'}">${totalPontos}</div>
        </div>
        <div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Nível atual</div>
          ${_nivelBadge(totalPontos,nivelAtual.designacao)}
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${nivelAtual.medida}</div>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAtribuirFalha('${nomeEsc}')">Atribuir falha</button>
    </div>
    ${falhasRows

      : `<div class="tl-empty">Sem infrações registadas.</div>`}`;

  //  Vendas & Bónus 
  const _toTrimV=d=>{if(!d)return null;const dt=new Date(String(d).slice(0,10)+'T00:00:00');return`Q${Math.ceil((dt.getMonth()+1)/3)} ${dt.getFullYear()}`;};
  const bonusCols=vendasBonus?Object.keys(vendasBonus).filter(k=>/^Q\d/.test(k)):[];
  const trimestresV=[...new Set(vendasLog.map(v=>_toTrimV(v['Data'])).filter(Boolean))].sort().reverse();
  const vendasPorTrim=trimestresV.map(q=>{
    const items=vendasLog.filter(v=>_toTrimV(v['Data'])===q);
    const bonus=vendasBonus&&bonusCols.find(c=>c.startsWith(q))?parseFloat(vendasBonus[bonusCols.find(c=>c.startsWith(q))])||0:0;
    const total=items.reduce((s,v)=>s+(parseFloat(v['Valor s/IVA'])||0),0);
    return{q,n:items.length,total,bonus,items};
  });
  const _codBadge=c=>{if(!c)return'';const m=c.match(/^[A-Z]+/);const t=m?m[0]:'';const col=t==='AMR'?'var(--info)':t==='AMP'?'var(--warning)':t==='AM'?'var(--success)':'var(--text-muted)';return`<span style="font-size:10px;font-weight:700;background:${col}22;color:${col};border-radius:4px;padding:1px 5px">${c}</span>`;};

    <td style="font-size:12px">${v['Serviço']||'—'}</td>
    <td style="text-align:right;font-weight:600">${v['Valor s/IVA']?parseFloat(v['Valor s/IVA']).toFixed(0)+'€':'—'}</td>
    <td style="font-size:11px;color:var(--text-muted)">${_toTrimV(v['Data'])||'—'}</td>
  </tr>`).join('');
  const resumoTrimRows=vendasPorTrim.map(t=>`<tr>
    <td style="font-weight:600">${t.q}</td>
    <td style="text-align:center">${t.n}</td>
    <td style="text-align:right">${t.total.toFixed(0)}€</td>
    <td style="text-align:right;color:var(--success);font-weight:600">${t.bonus>0?t.bonus.toFixed(0)+'€':'—'}</td>
  </tr>`).join('');
  const vendasHtml=`
    <div class="db-grid-2" style="margin-bottom:20px">
      <div>
        <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Resumo por Trimestre</div>
        ${resumoTrimRows?`<div class="table-wrap"><table class="mini-table"><thead><tr><th>Trimestre</th><th style="text-align:center">Nº</th><th style="text-align:right">Total</th><th style="text-align:right">Bónus</th></tr></thead><tbody>${resumoTrimRows}</tbody></table></div>`:`<div class="tl-empty">Sem vendas registadas.</div>`}
      </div>
      <div>
        <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Detalhe de Vendas</div>
        ${vendasRows?`<div class="table-wrap"><table class="mini-table"><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th style="text-align:right">Valor</th><th>Trim.</th></tr></thead><tbody>${vendasRows}</tbody></table></div>`:`<div class="tl-empty">Sem vendas registadas.</div>`}
      </div>
    </div>`;

  //  Layout 
  const cargoBadge = cargo => {
    const map = {Treinador:'badge-ok',Coordenador:'badge-info',Técnico:'badge-warn',Comercial:'badge',Direcção:'badge-danger'};
    return `<span class="badge ${map[cargo]||'badge'}" style="font-size:13px">${cargo}</span>`;
  };
  const estadoBadge = est => {
    const map = {Activo:'badge-ok',Suspenso:'badge-warn',Cancelado:'badge-danger'};
    return est && est!=='Activo' ? `<span class="badge ${map[est]||'badge'}" style="font-size:12px">${est}</span>` : '';
  };

  el.innerHTML = `
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost btn-sm" onclick="navigate('dados_colaboradores')" style="font-size:18px;padding:6px 10px">←</button>
        <div>
          <h1 style="font-size:22px;font-weight:700">${nome}</h1>
          <div style="margin-top:6px">${cargoBadge(info['Cargo']||'—')}&nbsp;${estadoBadge(info['Estado']||'')}
            <span style="font-size:12px;color:var(--text-muted);margin-left:4px">${info['Tipo de regime']||''}</span>
          </div>
        </div>
      </div>
      <div>
        <button class="btn btn-ghost btn-sm" onclick="openEditColaborador('${nomeEsc}')">Editar ficha</button>
      </div>
    </div>
    <div class="cd-main">
      <div class="tabs" style="margin-bottom:16px">
        <div class="tab active" onclick="switchTab(this,'col-tab-ficha')">Ficha</div>
        <div class="tab" onclick="switchTab(this,'col-tab-sub')">Substituições (${allSubs.length})</div>

async function openEditColaborador(nome){
  const sec = SECTIONS['dados_colaboradores'];
  if(!sec||!sec.fields) return toast('Campos não definidos','error');

  let data = sectionData['dados_colaboradores'];
  if(!data){ const r=await api('/api/data/dados_colaboradores'); data=Array.isArray(r)?r:(r.data||[]); sectionData['dados_colaboradores']=data; }
  const idx = data.findIndex(r=>r['Nome Oficial']===nome);
  if(idx<0) return toast('Colaborador não encontrado','error');
  const rec = data[idx];

  document.getElementById('modalTitle').textContent = ' Editar ficha — ' + nome;
  document.getElementById('modalBody').innerHTML = '<div style="color:var(--text-muted);padding:20px 0">A carregar...</div>';
  document.getElementById('modal').classList.add('show');

  let html=''; const setups=[];
  for(const f of sec.fields){
    const r=await buildFieldHtml(f, rec[f.k]??''); html+=r.html; if(r.setup) setups.push(r.setup);
  }
  document.getElementById('modalBody').innerHTML=html;
  runFieldSetups(setups);

  document.getElementById('modalSave').onclick=async()=>{
    const updates={};
    for(const f of sec.fields){
      let v=getFieldValue(f);
      if(f.t==='number') v=(v===''||v===null)?null:parseFloat(v);
      else if(v==='') v=null;
      updates[f.k]=v;

    if(res?.error){ toast('Erro ao guardar: '+res.error,'error'); return; }
    sectionData['dados_colaboradores']=null;
    closeModal();
    toast('Ficha atualizada');
    await openColaboradorDetalhe(updates['Nome Oficial']||nome);
  };
}

async function _subModal(title, rec, nomeColab, onSave){

  const mensalidade = parseFloat(rec['Mensalidade']||0);
  const freq = parseInt(rec['Frequência Semanal']||3);
  const vps = freq>0 ? (mensalidade/(freq*4.3)).toFixed(2) : '—';

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = `
    <div class="form-group"><label>Cliente</label>
      <input type="text" id="sub_cliente" value="${rec['Cliente']||''}" placeholder="Nome do cliente"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Técnico Original</label>
        <select id="sub_orig"><option value="">—</option>${colabs.map(c=>`<option value="${c}" ${rec['Técnico Original']===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>Técnico Substituto</label>
        <select id="sub_subst"><option value="">—</option>${colabs.map(c=>`<option value="${c}" ${rec['Técnico Substituto']===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Data Início</label>
        <input type="date" id="sub_ini" value="${rec['Data Início']||''}"></div>
      <div class="form-group"><label>Data Fim (opcional)</label>
        <input type="date" id="sub_fim" value="${rec['Data Fim']||''}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="form-group"><label>Frequência</label>
        <select id="sub_freq" onchange="_subRecalc()">${freqs}</select></div>
      <div class="form-group"><label>Mensalidade (€)</label>
        <input type="number" id="sub_mens" value="${rec['Mensalidade']||''}" step="0.01" oninput="_subRecalc()"></div>
      <div class="form-group"><label>Sessões Dadas</label>
        <input type="number" id="sub_sess" value="${rec['Sessões Dadas']||0}" min="0" oninput="_subRecalc()"></div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;gap:24px;align-items:center">
      <div><div style="font-size:11px;color:var(--text-muted)">€ / Sessão</div><div id="sub_vps" style="font-weight:700;font-size:18px">${vps}€</div></div>
      <div><div style="font-size:11px;color:var(--text-muted)">Total Substituto</div><div id="sub_vtot" style="font-weight:700;font-size:18px;color:var(--success)">0.00€</div></div>
    </div>
    <div class="form-group"><label>Notas</label>
      <textarea id="sub_notas" style="min-height:60px">${rec['Notas']||''}</textarea></div>`;
  _subRecalc();
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalSave').onclick = async()=>{
    const body = {
      'Cliente':             document.getElementById('sub_cliente').value.trim(),
      'Técnico Original':    document.getElementById('sub_orig').value,
      'Técnico Substituto':  document.getElementById('sub_subst').value,
      'Data Início':         document.getElementById('sub_ini').value||null,
      'Data Fim':            document.getElementById('sub_fim').value||null,
      'Frequência Semanal':  parseInt(document.getElementById('sub_freq').value)||3,
      'Mensalidade':         parseFloat(document.getElementById('sub_mens').value)||0,
      'Sessões Dadas':       parseInt(document.getElementById('sub_sess').value)||0,
      'Notas':               document.getElementById('sub_notas').value||null,
    };
    if(!body['Cliente']||!body['Técnico Original']||!body['Técnico Substituto'])
      return toast('Preenche Cliente, Técnico Original e Técnico Substituto','error');
    const res = await onSave(body);
    if(res?.error){ toast('Erro: '+res.error,'error'); return; }
    closeModal();
    toast('Substituição guardada');
    await openColaboradorDetalhe(nomeColab);
  };
}

function _subRecalc(){
  const mens = parseFloat(document.getElementById('sub_mens')?.value)||0;
  const freq = parseInt(document.getElementById('sub_freq')?.value)||3;
  const sess = parseInt(document.getElementById('sub_sess')?.value)||0;
  const vps = freq>0 ? mens/(freq*4.3) : 0;
  const vtot = vps*sess;
  const vpsEl=document.getElementById('sub_vps'); if(vpsEl) vpsEl.textContent=vps.toFixed(2)+'€';
  const vtotEl=document.getElementById('sub_vtot'); if(vtotEl) vtotEl.textContent=vtot.toFixed(2)+'€';
}

  await openColaboradorDetalhe(nome);
