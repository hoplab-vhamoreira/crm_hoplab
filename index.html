function buildHistItem(h){
  const revertido = h.revertido;
  const canRevert = h.acao==='delete' && h.snapshot && !revertido;
  const btnRevert = canRevert
    ? `<button onclick="revertHistorico('${h._id}')" style="margin-left:8px;background:none;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;padding:2px 8px;border-radius:4px;font-size:11px;vertical-align:middle" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'" title="Restaurar registo eliminado">↩ Reverter</button>` : '';
  const revertLabel = revertido ? `<span style="margin-left:8px;font-size:11px;color:var(--success);opacity:.8"> revertido</span>` : '';
  return `<div class="tl-item">
    <div class="tl-icon">${h.icon||''}</div>
    <div class="tl-body">
      <div class="tl-top">
        <span class="tl-tipo">${h.tipo}</span>${revertLabel}${btnRevert}
        <span class="tl-meta">${fmtDate(h.timestamp)} · ${h.utilizador}</span>
      </div>
      <div class="tl-desc">${h.descricao||''}</div>
    </div>
  </div>`;
}

async function revertHistorico(histId){
  if(!confirm('Restaurar este registo eliminado?')) return;
  const res=await api(`/api/historico/revert/${histId}`,{method:'POST'});
  if(res.ok){
    toast(' Registo restaurado');
    // Recarregar a vista actual
    if(currentSection==='pipeline'||document.getElementById('on-detalhe-wrap')){
      const wrap=document.getElementById('on-detalhe-wrap');
      if(wrap){
        const nON=wrap.dataset.non;
        if(nON) { await openONDetalhe(Number(nON)||nON); return; }
      }
    }
    sectionData[currentSection]=null;
    navigate(currentSection);
  } else {
    toast(res.error||'Erro ao reverter','error');
  }
}

//  TOTAIS DE PAGAMENTOS 
const _TP_MESES_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let _tpPeriodo = _TP_MESES_SHORT[new Date().getMonth()]; // mês corrente por defeito
let _tpGrupo   = 'Todos';
let _tpComBonus = true;
let _tpData    = null;

const _TP_MESES      = _TP_MESES_SHORT;
const _TP_MESES_FULL = ['Janeiro','Fevereiro','Mar\xe7o','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const _TP_PERIODOS = {
  'Jan':['Jan'],'Fev':['Fev'],'Mar':['Mar'],'Abr':['Abr'],
  'Mai':['Mai'],'Jun':['Jun'],'Jul':['Jul'],'Ago':['Ago'],
  'Set':['Set'],'Out':['Out'],'Nov':['Nov'],'Dez':['Dez'],
  'Q1':['Jan','Fev','Mar'],'Q2':['Abr','Mai','Jun'],
  'Q3':['Jul','Ago','Set'],'Q4':['Out','Nov','Dez'],
  'Ano':['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']
};

function _tpBonusKeys(periodo){
  const map={'Q1':['B\xf3nus Q1'],'Q2':['B\xf3nus Q2'],'Q3':['B\xf3nus Q3'],'Q4':['B\xf3nus Q4'],
             'Ano':['B\xf3nus Q1','B\xf3nus Q2','B\xf3nus Q3','B\xf3nus Q4']};
  const qmap={'Jan':'B\xf3nus Q1','Fev':'B\xf3nus Q1','Mar':'B\xf3nus Q1',
              'Abr':'B\xf3nus Q2','Mai':'B\xf3nus Q2','Jun':'B\xf3nus Q2',
              'Jul':'B\xf3nus Q3','Ago':'B\xf3nus Q3','Set':'B\xf3nus Q3',
              'Out':'B\xf3nus Q4','Nov':'B\xf3nus Q4','Dez':'B\xf3nus Q4'};
  return map[periodo]||(qmap[periodo]?[qmap[periodo]]:[]);
}

function _tpGetColab(prof, colabs){
  return (colabs||[]).find(x=>x['Nome Oficial']===prof)||null;
}
function _tpGetArea(prof, colabs){
  const c=_tpGetColab(prof,colabs); return c?(c['\xc1rea']||''):'';
}
function _tpInGroup(area, grupo){
  if(grupo==='Todos') return true;
  const map={
    'Studio (PT)':['Studio'],
    'Nutri\xe7\xe3o':['Nutri\xe7\xe3o'],
    'Medicina':['Ortopedia','Fisioterapia','Operacional Lab'],
    'Comercial':['Comercial Lab']
  };
  const areas=map[grupo]||[];
  return areas.some(a=>area.includes(a));
}

function _tpCalc(r, periodo, comBonus){
  const meses=_TP_PERIODOS[periodo]||_TP_PERIODOS['Q2'];
  let pag=0,ced=0,net=0; const formas=new Set();
  for(const m of meses){
    pag+=parseFloat(r[m+' Pagamento'])||0;
    ced+=parseFloat(r[m+' Ced\xeancia'])||0;
    net+=parseFloat(r[m+' Saldo NET'])||0;
    const f=r[m+' Forma']; if(f&&f!=='—') formas.add(f);
  }
  let bon=0;
  if(comBonus) for(const bk of _tpBonusKeys(periodo)) bon+=parseFloat(r[bk])||0;
  return {pag,ced,net:net+bon,bon,netSemBonus:net,formas:[...formas]};
}

function _tpFormaLabel(formas){
  if(!formas||!formas.length) return '<span style="color:var(--text-muted)">—</span>';
  return [...new Set(formas)].map(f=>{
    if(f.includes('Transfer\xeancia')) return '<span style="color:var(--success)">HOP→Prof</span>';
    if(f.includes('Ced\xeancia'))       return '<span style="color:var(--danger)">Prof→HOP</span>';
    if(f.includes('Contra-Recibo'))    return '<span style="color:var(--info)">Contra-Recibo</span>';
    return f;
  }).join(' ');
}

function _tpAreaBadge(area){
  if(!area) return '';
  let col='var(--text-muted)'; let bg='rgba(107,114,128,.1)';
  if(area==='Studio'){col='var(--primary-text)';bg='rgba(170,255,0,.15)';}
  else if(area.includes('Nutri')){col='var(--success)';bg='rgba(22,163,74,.1)';}
  else if(area==='Ortopedia'||area==='Fisioterapia'||area==='Operacional Lab'){col='var(--warning)';bg='rgba(217,119,6,.1)';}
  else if(area.includes('Comercial')){col='var(--info)';bg='rgba(37,99,235,.1)';}
  return `<span style="background:${bg};color:${col};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">${area}</span>`;
}

function _tpFmt(v){ return v===0?'—':`${Math.abs(v).toFixed(2)}€`; }

async function renderTotaisPagamentos(el){
  if(!_tpData){
    el.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-muted)">A carregar...</div>';
    const [totais,treinadores,colabs]=await Promise.all([
      api('/api/data/totais_pagamentos'),
      api('/api/data/pagamentos_treinadores'),
      api('/api/data/dados_colaboradores')
    ]);
    _tpData={totais,treinadores,colabs};
  }
  _renderTotaisView(el);
}

function _renderTotaisView(el){
  const {totais,treinadores,colabs}=_tpData;
  const filtered=totais.filter(r=>{
    if(!r.Professor) return false;
    const area=_tpGetArea(r.Professor,colabs);
    return _tpInGroup(area,_tpGrupo);
  });

  let totalPag=0,totalCed=0,totalNet=0,totalBon=0;
  filtered.forEach(r=>{
    const c=_tpCalc(r,_tpPeriodo,_tpComBonus);
    totalPag+=c.pag; totalCed+=c.ced; totalNet+=c.net; totalBon+=c.bon;
  });

  const pChip=k=>`<button onclick="_tpPeriodo='${k}';_renderTotaisView(document.getElementById('mainContent'))" style="padding:5px 12px;border-radius:20px;border:1px solid ${_tpPeriodo===k?'var(--primary-text)':'var(--border)'};background:${_tpPeriodo===k?'rgba(170,255,0,.12)':'none'};color:${_tpPeriodo===k?'var(--primary-text)':'var(--text-muted)'};cursor:pointer;font-size:12px;font-weight:${_tpPeriodo===k?600:400}">${k}</button>`;
  const gChip=k=>`<button onclick="_tpGrupo='${k}';_renderTotaisView(document.getElementById('mainContent'))" style="padding:5px 12px;border-radius:20px;border:1px solid ${_tpGrupo===k?'var(--primary-text)':'var(--border)'};background:${_tpGrupo===k?'rgba(170,255,0,.12)':'none'};color:${_tpGrupo===k?'var(--primary-text)':'var(--text-muted)'};cursor:pointer;font-size:12px;font-weight:${_tpGrupo===k?600:400}">${k}</button>`;

  let rows='';
  for(const r of filtered){
    const area=_tpGetArea(r.Professor,colabs);
    const c=_tpCalc(r,_tpPeriodo,_tpComBonus);
    if(!c.pag&&!c.ced&&!c.net&&!c.bon) continue;
    const enc=encodeURIComponent(r.Professor);
    const netCol=c.net>0?'var(--success)':c.net<0?'var(--danger)':'var(--text-muted)';
    rows+=`<tr style="cursor:pointer" onclick="abrirTotaisDetalhe('${enc}')">
      <td><strong>${r.Professor}</strong></td>
      <td><span style="color:var(--text-muted);font-size:12px">${r.Role||'—'}</span></td>
      <td style="text-align:center">${_tpAreaBadge(area)}</td>
      <td style="text-align:right;font-weight:500">${_tpFmt(c.pag)}</td>
      <td style="text-align:right;color:var(--text-muted)">${_tpFmt(c.ced)}</td>
      <td style="text-align:right;font-weight:700;color:${netCol}">${_tpFmt(c.net)}</td>
      <td style="text-align:right;color:var(--warning)">${c.bon>0?_tpFmt(c.bon):'—'}</td>
      <td>${_tpFormaLabel(c.formas)}</td>
    </tr>`;
  }
  if(!rows) rows='<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:40px">Sem dados para este per\xedodo/grupo</td></tr>';

  el.innerHTML=`
  <div class="page-header">
    <div><h1>Totais de Pagamentos</h1><div class="subtitle">Gest\xe3o de pagamentos a colaboradores — 2026</div></div>
  </div>

  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px">
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
      <div>
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Per\xedodo</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${['Q1','Q2','Q3','Q4','Ano'].map(pChip).join('')}
          <span style="display:inline-block;width:1px;background:var(--border);margin:0 6px;align-self:stretch"></span>
          ${_TP_MESES.map(pChip).join('')}
        </div>
      </div>
      <div style="border-left:1px solid var(--border);padding-left:20px">
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Grupo</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${['Todos','Studio (PT)','Nutri\xe7\xe3o','Medicina','Comercial'].map(gChip).join('')}
        </div>
      </div>
      <div style="border-left:1px solid var(--border);padding-left:20px;display:flex;align-items:center;margin-top:16px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="checkbox" ${_tpComBonus?'checked':''} onchange="_tpComBonus=this.checked;_renderTotaisView(document.getElementById('mainContent'))" style="accent-color:var(--primary-text);width:16px;height:16px">
          Incluir B\xf3nus
        </label>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">Total a Pagar</div>
      <div style="font-size:26px;font-weight:700;color:var(--success)">${_tpFmt(totalPag)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">HOP → Colaboradores</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">Total Ced\xeancias</div>
      <div style="font-size:26px;font-weight:700;color:var(--warning)">${_tpFmt(totalCed)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Espa\xe7o / Infraestrutura</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">Saldo NET Total</div>
      <div style="font-size:26px;font-weight:700;color:${totalNet>=0?'var(--success)':'var(--danger)'}">${_tpFmt(totalNet)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Pag. − Ced. + B\xf3nus</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">B\xf3nus Per\xedodo</div>
      <div style="font-size:26px;font-weight:700;color:var(--primary-text)">${_tpFmt(totalBon)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${_tpComBonus?'Inclu\xeddo no NET':'Exclu\xeddo do NET'}</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-toolbar"><strong>Colaboradores</strong><span class="table-count">${filtered.filter(r=>r.Professor).length} registos — clique para detalhar</span></div>
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr>
        <th>Colaborador</th><th>Cargo</th><th>\xc1rea</th>
        <th style="text-align:right">Pagamento</th>
        <th style="text-align:right">Ced\xeancia</th>
        <th style="text-align:right">Saldo NET</th>
        <th style="text-align:right">B\xf3nus</th>
        <th>Forma</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

async function abrirTotaisDetalhe(profEnc){
  const prof=decodeURIComponent(profEnc);
  const el=document.getElementById('mainContent');
  const {totais,treinadores,colabs}=_tpData;
  const r=totais.find(x=>x.Professor===prof);
  const colab=_tpGetColab(prof,colabs);
  if(!r) return;

  const area    = colab?(colab['\xc1rea']||'—'):'—';
  const regime  = colab?(colab['Tipo de regime']||'—'):'—';
  const conds   = colab?(colab['Condi\xe7\xf5es']!=null?`${(colab['Condi\xe7\xf5es']*100).toFixed(0)}%`:'—'):'—';
  const tipoRec = colab?(colab['Tipo de recebimento']||'—'):'—';
  const tipoCed = colab?(colab['Tipo de Ced\xeancia']||'—'):'—';
  // Cedência real: calculada a partir dos totais_pagamentos para o mês corrente (inclui híbridos)
  const _cedMesAtual = _TP_MESES[new Date().getMonth()];
  const _cedReal = r[_cedMesAtual+' Ced\xeancia']||0;
  const valCed = _cedReal>0?`${_cedReal.toFixed(2)}€ (mês actual)`:'Sem cedência';

  // Monthly + quarterly breakdown
  const quarters=[
    {meses:['Jan','Fev','Mar'],bKey:'B\xf3nus Q1',lbl:'Q1'},
    {meses:['Abr','Mai','Jun'],bKey:'B\xf3nus Q2',lbl:'Q2'},
    {meses:['Jul','Ago','Set'],bKey:'B\xf3nus Q3',lbl:'Q3'},
    {meses:['Out','Nov','Dez'],bKey:'B\xf3nus Q4',lbl:'Q4'}
  ];
  let monthRows='';
  let aPag=0,aCed=0,aNet=0,aBon=0;
  for(const q of quarters){
    let qPag=0,qCed=0,qNet=0;
    for(const m of q.meses){
      const pag=parseFloat(r[m+' Pagamento'])||0;
      const ced=parseFloat(r[m+' Ced\xeancia'])||0;
      const net=parseFloat(r[m+' Saldo NET'])||0;
      const forma=r[m+' Forma']||'';
      qPag+=pag;qCed+=ced;qNet+=net;
      const nc=net>0?'var(--success)':net<0?'var(--danger)':'var(--text-muted)';
      monthRows+=`<tr>
        <td style="font-size:12px;color:var(--text-muted);padding-left:24px">${m}</td>
        <td style="text-align:right">${pag?pag.toFixed(2)+'€':'—'}</td>
        <td style="text-align:right;color:var(--text-muted)">${ced?ced.toFixed(2)+'€':'—'}</td>
        <td style="text-align:right;font-weight:600;color:${nc}">${net?Math.abs(net).toFixed(2)+'€':'—'}</td>
        <td style="font-size:11px">${_tpFormaLabel(forma&&forma!=='—'?[forma]:[])}</td>
      </tr>`;
    }
    aPag+=qPag;aCed+=qCed;aNet+=qNet;
    const bon=parseFloat(r[q.bKey])||0; aBon+=bon;
    monthRows+=`<tr style="background:rgba(170,255,0,.07)">
      <td style="font-size:11px;color:var(--primary-text);font-weight:700">${q.lbl} Sub-total</td>
      <td style="text-align:right;font-weight:600;font-size:12px">${qPag?qPag.toFixed(2)+'€':'—'}</td>
      <td style="text-align:right;font-size:12px;color:var(--text-muted)">${qCed?qCed.toFixed(2)+'€':'—'}</td>
      <td style="text-align:right;font-weight:700;font-size:12px">${qNet?Math.abs(qNet).toFixed(2)+'€':'—'}</td>
      <td style="font-size:11px;color:var(--warning)">${bon?' B\xf3nus: '+bon.toFixed(2)+'€':'—'}</td>
    </tr>`;
  }
  const totalNetBon=aNet+aBon;
  monthRows+=`<tr style="background:rgba(170,255,0,.12);font-weight:700;border-top:2px solid var(--primary)">
    <td style="color:var(--primary-text)">Total Ano</td>
    <td style="text-align:right">${aPag.toFixed(2)}€</td>
    <td style="text-align:right;color:var(--text-muted)">${aCed.toFixed(2)}€</td>
    <td style="text-align:right;color:${totalNetBon>=0?'var(--success)':'var(--danger)'}">${Math.abs(totalNetBon).toFixed(2)}€</td>
    <td style="color:var(--warning)">${aBon?'B\xf3nus: '+aBon.toFixed(2)+'€':'—'}</td>
  </tr>`;

  // Clients
  const clients=treinadores.filter(x=>x.Professor===prof&&x.Estado==='Activo');
  const nowMonth=_TP_MESES_FULL[new Date().getMonth()];
  const clientRows=clients.map(c=>{
    const jVal=c['J_'+nowMonth]||0;
    const isHibrido=c['Tipo']==='H\xedbrido';
    const cond=c['Tipo de condi\xe7\xe3o']!=null?`${(c['Tipo de condi\xe7\xe3o']*100).toFixed(0)}%`:'—';
    const tipoBadge=isHibrido?`<span style="background:rgba(245,158,11,.15);color:var(--warning);padding:1px 6px;border-radius:8px;font-size:10px;margin-left:6px">H\xedbrido</span>`:'';
    const valorCell=isHibrido
      ?`<span style="color:var(--warning);font-weight:500">${jVal?jVal.toFixed(2)+'€':'—'}</span><span style="font-size:10px;color:var(--text-muted);margin-left:4px">ced. espa\xe7o</span>`
      :(jVal?`<span style="font-weight:500">${jVal.toFixed(2)}€</span>`:'—');
    return `<tr>
      <td>${c.Cliente||'—'}${tipoBadge}</td>
      <td style="font-size:12px;color:var(--text-muted)">${c['Mensalidade Treino']||'—'}</td>
      <td style="text-align:center">${cond}</td>
      <td style="text-align:center;font-size:11px">${c.Regime||'—'}</td>
      <td style="text-align:right">${valorCell}</td>
    </tr>`;
  }).join('');

  const cedInfo=_cedReal===0
    ?`<div style="margin-top:10px;padding:8px 12px;background:rgba(34,197,94,.08);border-radius:6px;font-size:12px;color:var(--success)">Sem ced\xeancia de espa\xe7o (clientes HopLab)</div>`
    :tipoCed==='Total'
    ?`<div style="margin-top:10px;padding:8px 12px;background:rgba(239,68,68,.1);border-radius:6px;font-size:12px;color:var(--danger)">Ced\xeancia Total — ${_cedReal.toFixed(2)}€/m\xeas ao HOP</div>`
    :tipoCed.startsWith('Parcial')
    ?`<div style="margin-top:10px;padding:8px 12px;background:rgba(245,158,11,.1);border-radius:6px;font-size:12px;color:var(--warning)">Ced\xeancia Parcial — ${_cedReal.toFixed(2)}€/m\xeas ao HOP</div>`
    :'';

  el.innerHTML=`
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-ghost btn-sm" onclick="_renderTotaisView(document.getElementById('mainContent'))" style="font-size:18px;padding:6px 10px">←</button>
      <div>
        <h1 style="font-size:22px">${prof}</h1>
        <div style="margin-top:4px;font-size:12px;color:var(--text-muted)">${r.Role||''} &nbsp;&bull;&nbsp; ${_tpAreaBadge(area)}</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:280px 1fr;gap:20px;margin-bottom:20px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:16px">Perfil de Pagamento</div>
      ${[['Regime',regime],['Condi\xe7\xf5es',conds],['Tipo Recebimento',tipoRec],['Tipo Ced\xeancia',tipoCed],['Valor Ced\xeancia/m\xeas',valCed],['\xc1rea',area]]
        .map(([k,v])=>`<div style="margin-bottom:12px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">${k}</div><div style="font-size:14px;font-weight:600;margin-top:2px">${v}</div></div>`).join('')}
      <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Forma de Pagamento</div>
        ${_tpFormaLabel([r['Jan Forma']].filter(f=>f&&f!=='—'))}
        ${cedInfo}
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700">Breakdown Mensal 2026</div>
      <div style="max-height:400px;overflow-y:auto"><table class="tbl">
        <thead><tr>
          <th>M\xeas</th>
          <th style="text-align:right">Pagamento</th>
          <th style="text-align:right">Ced\xeancia</th>
          <th style="text-align:right">Saldo NET</th>
          <th>Forma</th>
        </tr></thead>
        <tbody>${monthRows}</tbody>
      </table></div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-toolbar">
      <strong>Clientes Activos (${clients.length})</strong>
      <span class="table-count">Servi\xe7os prestados ao HOP Lab — m\xeas actual: ${nowMonth}</span>
    </div>
    ${clients.length?`<div class="tbl-scroll"><table class="tbl">
      <thead><tr>
        <th>Cliente</th><th>Mensalidade</th>
        <th style="text-align:center">Condi\xe7\xe3o</th>
        <th style="text-align:center">Regime</th>
        <th style="text-align:right">Valor (${nowMonth})</th>
      </tr></thead>
      <tbody>${clientRows}</tbody>
    </table></div>`:'<div style="padding:40px;text-align:center;color:var(--text-muted)">Sem clientes activos</div>'}
  </div>`;
}

// INIT
(async () => {
  // Restaurar sessão Supabase se existir
  const { data: { session } } = await _SB.auth.getSession();
  if (session) {
    const { data: profile } = await _SB.from('profiles').select('*').eq('user_id', session.user.id).single();
    if (profile && profile.active) {
      currentUser = { username: profile.username, name: profile.name, role: profile.role };
      currentPerms = Object.keys(_TABLE_MAP);
      showApp();
      return;
    }
  }
  // Sem sessão — mostrar login
  document.getElementById('loginScreen').style.display = 'flex';
})();
</script>
</body>
</html>
