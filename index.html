<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HOP Lab CRM 2.0</title>
<style>
:root{
  --navy:#1E3A5F;--navy-soft:#2A4E7A;--navy-deeper:#132540;
  --green:#A6E04A;--green-bright:#B6F25A;--green-soft:#E8F8D3;
  --amber:#C4A843;--amber-light:#E2C859;
  --bg-cream:#F5EFE1;--bg-blue:#B8CEE8;
  --bg:var(--bg-cream);--surface:#FFFFFF;--surface2:#EFF2F6;--surface3:#E5E9EE;
  --border:#E5E9EE;--border-soft:#EFF2F6;
  --primary:var(--green);--primary-hover:var(--green-bright);--primary-text:#2d5a00;
  --text:#1B2733;--text-muted:#6B7785;
  --success:#16a34a;--warning:#d97706;--danger:#dc2626;--info:#2563eb;
  --radius:12px;--sidebar-w:260px
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#EBF1F8;background-image:linear-gradient(135deg,#F5EFE1 0%,#B8CEE8 100%);background-attachment:fixed;background-size:cover;color:var(--text);min-height:100vh}
/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;background-image:linear-gradient(135deg,#F5EFE1 0%,#B8CEE8 100%);background-attachment:fixed}
.login-box{background:#ffffff;border:1.5px solid var(--border);border-radius:24px;padding:52px 48px;width:420px;text-align:center;box-shadow:0 8px 40px rgba(27,39,51,.12)}
.login-box h1{font-size:30px;margin-bottom:8px;color:var(--navy);font-weight:800;letter-spacing:-0.5px}
.login-box p{color:var(--text-muted);margin-bottom:36px;font-size:14px}
.login-box input{width:100%;padding:14px 18px;background:var(--surface2);border:1.5px solid var(--border);border-radius:50px;color:var(--text);font-size:14px;margin-bottom:12px;outline:none;text-align:left}
.login-box input::placeholder{color:var(--text-muted)}
.login-box input:focus{border-color:var(--navy);background:#fff}
.login-box button{width:100%;padding:14px;background:var(--navy);color:var(--green);border:none;border-radius:50px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;letter-spacing:.3px;transition:.15s}
.login-box button:hover{background:var(--navy-soft);transform:translateY(-1px);box-shadow:0 6px 20px rgba(27,39,51,.2)}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;display:none}
/* LAYOUT */
.app{display:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:#ffffff;border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow:hidden;box-shadow:2px 0 12px rgba(0,0,0,.06)}
.sidebar-header{padding:22px 16px 18px}
.sidebar-header h2{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:1px;text-transform:uppercase}
.sidebar-header small{color:var(--text-muted);font-size:11px;font-weight:400}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.nav-group{margin-bottom:4px;background:var(--surface3);border-radius:16px;padding:4px;margin-bottom:10px}
.nav-group-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:8px 10px 4px;font-weight:700}
.nav-item{display:flex;align-items:center;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);transition:.12s;user-select:none}
.nav-item:hover{color:var(--navy);background:rgba(27,39,51,.06)}
.nav-item.active{background:var(--navy);color:#ffffff;font-weight:700;box-shadow:0 2px 8px rgba(27,39,51,.18)}
.nav-item.active::before{content:"";display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:8px;flex-shrink:0}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-footer .avatar{width:32px;height:32px;background:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--green);flex-shrink:0}
.sidebar-footer .info{flex:1;min-width:0}
.sidebar-footer .info .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}
.sidebar-footer .info .role{font-size:11px;color:var(--text-muted)}
.btn-logout{background:none;border:1px solid var(--border);color:var(--text-muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
/* MAIN */
.main{margin-left:var(--sidebar-w);padding:28px 48px;min-height:100vh}
.page{display:none}
.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.page-header h1{font-size:30px;font-weight:800;letter-spacing:-0.5px}
.page-header .subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
/* BUTTONS */
.btn{padding:8px 20px;border-radius:50px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--navy);color:var(--green);border:1.5px solid var(--navy)}.btn-primary:hover{background:var(--navy-soft);border-color:var(--navy-soft)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface);border:1.5px solid var(--border);color:var(--text-muted);border-radius:50px}.btn-ghost:hover{border-color:var(--navy);color:var(--navy);background:var(--surface)}
/* GESTÃO DE CLIENTES tabs */
.gtab-wrap{display:inline-flex;gap:4px;background:var(--surface3);border-radius:50px;padding:4px}
.gtab{background:transparent;border:none;color:var(--text-muted);padding:8px 20px;border-radius:50px;cursor:pointer;font-size:13px;transition:.15s;font-weight:600}
.gtab:hover{color:var(--text);background:rgba(0,0,0,.06)}
.gtab-active{background:var(--navy);color:var(--green);border:none;font-weight:700}
/* AGENDA period buttons */
.agenda-period-btn{background:none;border:none;color:var(--text-muted);padding:8px 18px;cursor:pointer;font-size:13px;transition:.15s;border-radius:50px;font-weight:600}
.agenda-period-btn:hover{color:var(--text);background:rgba(0,0,0,.06)}
.agenda-period-btn.active{background:var(--navy);color:var(--green);font-weight:700}
/* TABLE */
.table-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.table-toolbar input{flex:1;max-width:320px;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.table-toolbar input:focus{border-color:var(--primary-text)}
.table-count{font-size:12px;color:var(--text-muted);margin-left:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);background:var(--surface2);border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr:hover td{background:rgba(170,255,0,.05)}
.tbl-scroll{max-height:65vh;overflow-y:auto}
.tbl-scroll::-webkit-scrollbar{width:6px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.tbl .actions{display:flex;gap:4px}
.tbl .actions button{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:13px}
.tbl .actions button:hover{background:var(--surface2);color:var(--primary-text)}
.tbl .actions .del:hover{color:var(--danger)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:560px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.12)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#111827;background:var(--surface)}
.form-group textarea{min-height:80px;resize:vertical}
/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .value.purple{color:#7c3aed}
.stat-card .value.green{color:var(--success)}
.stat-card .value.amber{color:var(--warning)}
.stat-card .value.blue{color:var(--info)}
.stat-card .sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.stat-card.clickable{cursor:pointer;transition:box-shadow .15s}
.stat-card.clickable:hover{box-shadow:0 4px 14px rgba(0,0,0,.13)}
.db-section{margin-bottom:32px}
.db-section-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.db-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
@media(max-width:900px){.db-grid-2{grid-template-columns:1fr}}
/* Dashboard redesign */
.db-top{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-bottom:20px;align-items:start}
.db-welcome h1{font-size:32px;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px}
.db-welcome p{font-size:13px;color:var(--text-muted);margin-bottom:18px}
.db-hero-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.db-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.db-chart-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.db-hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;gap:12px;align-items:flex-start}
.db-hc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.db-hc-body{flex:1;min-width:0}
.db-hc-label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.db-hc-value{font-size:22px;font-weight:800;line-height:1;margin-bottom:5px}
.db-hc-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:50px}
.db-overview{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.db-overview-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.db-overview-title span{font-size:13px;font-weight:700}
.db-gauge-wrap{text-align:center;margin-bottom:8px}
.db-gauge-svg{width:120px;height:68px}
.db-overview-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.db-ov-stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.db-ov-stat .ovs-label{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-bottom:2px}
.db-ov-stat .ovs-val{font-size:18px;font-weight:800}
.db-analytics{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px}
.db-analytics-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.db-analytics-title{font-size:13px;font-weight:700}
.db-cat-tabs{display:flex;gap:6px;flex-wrap:wrap}
.db-cat-tab{padding:5px 14px;border-radius:50px;border:1px solid var(--border);background:none;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:.15s}
.db-cat-tab.active,.db-cat-tab:hover{background:var(--navy);color:var(--green);border-color:var(--navy)}
.db-analytics-body{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.db-service-list{display:flex;flex-direction:column;gap:10px}
.db-srv-row{display:flex;flex-direction:column;gap:4px}
.db-srv-info{display:flex;justify-content:space-between;font-size:12px}
.db-srv-name{font-weight:600}
.db-srv-count{font-weight:700}
.db-bar-bg{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.db-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.db-month-chart{display:flex;flex-direction:column;gap:8px}
.db-chart-bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.db-chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.db-chart-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end}
.db-chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:2px;transition:height .4s}
.db-chart-label{font-size:9px;color:var(--text-muted);font-weight:600}
.db-chart-val{font-size:9px;color:var(--text-muted)}
.db-chart-legend{display:flex;gap:12px;font-size:11px;margin-top:4px}
.db-chart-legend span{display:flex;align-items:center;gap:4px}
.db-chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px}
.db-recent{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.db-recent-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.db-recent-header span{font-size:13px;font-weight:700}
.db-recent-item{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--border)}
.db-recent-item:last-child{border-bottom:none}
.db-ri-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green);flex-shrink:0}
.db-ri-body .ri-name{font-size:13px;font-weight:600}
.db-ri-body .ri-sub{font-size:11px;color:var(--text-muted)}
.db-ri-val{font-size:12px;font-weight:700;color:var(--success);white-space:nowrap}
.db-alert-item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border)}
.db-alert-item:last-child{border-bottom:none}
.db-alert-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0}
.db-alert-body{flex:1;min-width:0}
.db-alert-body .ab-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-alert-body .ab-sub{font-size:11px;color:var(--text-muted)}
.db-alert-days{font-size:12px;font-weight:700;color:var(--danger)}
@media(max-width:1100px){.db-top{grid-template-columns:1fr}.db-analytics-body{grid-template-columns:1fr}}
/* Drawer */
.db-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:498;display:none}
.db-drawer-overlay.open{display:block}
.db-drawer{position:fixed;right:-480px;top:0;bottom:0;width:480px;background:var(--surface);border-left:1px solid var(--border);z-index:499;transition:right .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-6px 0 32px rgba(0,0,0,.12)}
.db-drawer.open{right:0}
.db-drawer-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.db-drawer-header h3{font-size:15px;font-weight:700}
.db-drawer-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);padding:4px 8px;border-radius:6px}
.db-drawer-close:hover{background:var(--surface2)}
.db-drawer-body{flex:1;overflow-y:auto;padding:16px}
.db-drawer-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.db-drawer-kpi-item{background:var(--surface2);border-radius:10px;padding:12px 14px}
.db-drawer-kpi-item .dk-label{font-size:10px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-bottom:3px}
.db-drawer-kpi-item .dk-val{font-size:20px;font-weight:800}
.db-drawer-list{display:flex;flex-direction:column;gap:1px}
.db-drawer-row{display:grid;align-items:center;padding:9px 12px;border-radius:8px;font-size:13px;gap:8px}
.db-drawer-row:hover{background:var(--surface2)}
.db-drawer-row .dr-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-drawer-row .dr-sub{font-size:11px;color:var(--text-muted)}
.db-drawer-row .dr-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:50px;white-space:nowrap;text-align:right}
/* BACKOFFICE */
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.perm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:6px;font-size:12px}
.perm-item input[type=checkbox]{accent-color:var(--primary-text)}
.role-tab{display:inline-block;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-muted);border:1px solid var(--border);margin-right:6px;margin-bottom:8px}
.role-tab.active{background:var(--primary);color:#111827;border-color:var(--primary-text)}
/* CLIENTE DETALHE */
.cd-wrap{display:flex;flex-direction:column;gap:16px}
.cd-sidebar{width:100%;display:flex;flex-direction:column;gap:12px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 28px}
.cd-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cd-name{font-size:20px;font-weight:700;margin-bottom:4px}
.cd-status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:16px}
.cd-status.ativo{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3)}
.cd-status.alerta{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.cd-status.suspenso{background:rgba(245,158,11,.15);color:#b45309;border:1px solid rgba(245,158,11,.35)}
.cd-status.cancelado{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.cd-status.sem{background:rgba(148,163,184,.1);color:var(--text-muted);border:1px solid var(--border)}
.cd-info-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.cd-info-row:last-child{border:none}
.cd-info-row .lbl{color:var(--text-muted);min-width:110px;flex-shrink:0;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:1px}
.cd-info-row .val{flex:1;word-break:break-word}
.cd-main{flex:1;min-width:0}
/* TABS */
.tabs{display:inline-flex;gap:4px;background:var(--surface3);border-radius:50px;padding:4px;margin-bottom:20px;border-bottom:none}
.tab{padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600;color:#6b7280;border-bottom:none;margin-bottom:0;border-radius:50px;transition:.15s;white-space:nowrap}
.tab:hover{color:#374151;background:rgba(0,0,0,.05)}
.tab.active{color:var(--green);background:var(--navy);border-bottom-color:transparent;font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}
/* MASTER-DETAIL */

);
const _TABLE_MAP = {'clientes':'clientes','pipeline':'pipeline','log_comercial':'log_comercial','conversoes':'conversoes','avaliacoes':'avaliacoes','servicos':'servicos','log_operacional':'log_operacional','log_contratos':'log_contratos','parceiros':'parceiros','entidades_faturacao':'entidades_faturacao','falhas_sancoes':'falhas_sancoes','catalogo_faltas':'catalogo_faltas','niveis_sancao':'niveis_sancao','pag_clientes_2025':'pag_clientes_2025','pag_clientes_2026':'pag_clientes_2026','totais_pagamentos':'totais_pagamentos','motor2026':'motor2026','dados_colaboradores':'dados_colaboradores','log_colaboradores':'log_colaboradores','ciclos':'ciclos','adesoes_validar':'adesoes_validar','alertas':'alertas','historico':'historico','vendas_log':'vendas_log','vendas_bonus':'vendas_bonus','precario_publico':'precario_publico','calculadora':'calculadora','responsabilidades':'responsabilidades','matriz_partilhas':'matriz_partilhas','substituicoes_treino':'substituicoes_treino','users':'profiles'};
const _idCache = {};
function _recomputeClienteContacto(r){
  if(!r) return r;
  const uc = r['Último Contacto'];
  if(uc){
    const diff = Math.floor((Date.now() - new Date(uc).getTime()) / 86400000);
    r['Dias s/ Contacto'] = Math.max(0, diff);
  }
  return r;
}
function _recomputeCicloSemana(r){
  if(!r) return r;
  const _diKey = Object.keys(r).find(k=>/data.+in/i.test(k)&&!/fim/i.test(k)) || 'Data Início';
  const _dfKey = Object.keys(r).find(k=>/data.+fim/i.test(k)) || 'Data Fim';
  const di = r[_diKey]; const df = r[_dfKey]; const tipo = r['Tipo']||'';
  const m = /^GL(\d+)/i.exec(tipo); const totalSem = m?parseInt(m[1]):null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(!di){ r['Semana Actual'] = '—'; r['Status'] = r['Status']||'—'; return r; }
  const dIni = new Date(String(di).slice(0,10)+'T00:00:00');
  const dFim = df ? new Date(String(df).slice(0,10)+'T00:00:00') : null;
  if(hoje < dIni){ r['Semana Actual'] = 'Não iniciado'; r['Status'] = 'Por iniciar'; r['Validade'] = '—'; return r; }
  if(dFim && hoje > dFim){ r['Semana Actual'] = 'Terminado'; r['Status'] = ' Expirado'; r['Validade'] = '—'; return r; }
  const semAtual = Math.floor((hoje - dIni)/(86400000*7)) + 1;
  if(totalSem && semAtual > totalSem){ r['Semana Actual'] = 'Terminado'; r['Status'] = ' Expirado'; r['Validade'] = '—'; return r; }
  r['Semana Actual'] = totalSem ? `Semana ${semAtual} de ${totalSem}` : `Semana ${semAtual}`;
  r['Status'] = 'Em curso';
  if(dFim){ const semRest = Math.ceil((dFim - hoje)/(86400000*7)); r['Validade'] = semRest > 0 ? `${semRest} sem. restantes` : '—'; }
  else { r['Validade'] = '—'; }
  return r;
}
const _AVAL_SUGESTAO_MAP = {
  'AMR (Aval. Metab. Repouso)':       'PT Nutri Fisioterap',

};
function _recomputeAvalSugestao(r){
  if(!r) return r;
  const sug = _AVAL_SUGESTAO_MAP[r['Serviço']] || null;
  r['Sugestão Auto'] = sug || '';
  r['Próx. Serviço Sugerido'] = sug ? 'CF60 - 1ª Consulta Fisiologia' : '';
  return r;
}
const _READ_VIEW_MAP = {totais_pagamentos:'v_totais_pagamentos'};
async function _sbGetAll(t){
  const readFrom = _READ_VIEW_MAP[t] || t;
  const{data,error}=await _SB.from(readFrom).select('*');
  if(error)return{error:error.message};
  _idCache[t]=Array.isArray(data)?data.map(r=>r.id):[];
  if(Array.isArray(data)){
    if(t==='clientes')        data.forEach(_recomputeClienteContacto);
    else if(t==='ciclos')     data.forEach(_recomputeCicloSemana);
    else if(t==='avaliacoes') data.forEach(_recomputeAvalSugestao);
  }
  return data;
}
async function _sbInsert(t,b){const{data,error}=await _SB.from(t).insert(b).select().single();if(error)return{error:error.message};return data;}
async function _sbUpdate(t,i,b){const ids=_idCache[t];if(!ids||ids[i]===undefined)return{error:'ID nao encontrado - recarrega'};const{data,error}=await _SB.from(t).update(b).eq('id',ids[i]).select().single();if(error)return{error:error.message};return data;}
async function _sbDelete(t,i){const ids=_idCache[t];if(!ids||ids[i]===undefined)return{error:'ID nao encontrado'};const{error}=await _SB.from(t).delete().eq('id',ids[i]);if(error)return{error:error.message};return{ok:true};}
async function api(url,opts={}){
  const method=(opts.method||'GET').toUpperCase();
  let body=opts.body;
  if(body&&typeof body==='string'){try{body=JSON.parse(body);}catch(e){}}
  if(url==='/api/login'){
    const email=body.username.includes('@')?body.username:body.username+'@hoplab.pt';
    const{data,error}=await _SB.auth.signInWithPassword({email,password:body.password});
    if(error)return{ok:false,error:'Email ou password incorrectos.'};
    const{data:p}=await _SB.from('profiles').select('*').eq('user_id',data.user.id).single();
    return{ok:true,user:{username:p?.username,name:p?.name||email,role:p?.role||'Tecnico'},permissions:Object.keys(_TABLE_MAP)};
  }
  if(url==='/api/logout'){await _SB.auth.signOut();return{ok:true};}
  if(url==='/api/me'){
    const{data:{session}}=await _SB.auth.getSession();
    if(!session)return{ok:false};
    const{data:p}=await _SB.from('profiles').select('*').eq('user_id',session.user.id).single();
    return{ok:true,user:{username:p?.username,name:p?.name||session.user.email,role:p?.role||'Tecnico'},permissions:Object.keys(_TABLE_MAP)};
  }
  if(url==='/api/stats'){
    const result={};
    await Promise.all(Object.entries(_TABLE_MAP).map(async([k,t])=>{const{count}=await _SB.from(t).select('*',{count:'exact',head:true});result[k]=count??0;}));
    return result;
  }
  if(url==='/api/alertas'){
    const{data}=await _SB.from('v_alertas').select('*').order('Prioridade');
    const rows=data||[];
    rows.forEach((r,i)=>r._idx=i);
    _idCache['alertas']=rows.map(r=>r._source==='manual'?r._manual_id:null);
    return rows;
  }
  if(url==='/api/historico_faturacao'){const[r25,r26]=await Promise.all([_SB.from('pag_clientes_2025').select('*'),_SB.from('pag_clientes_2026').select('*')]);return{pag2025:r25.data||[],pag2026:r26.data||[]};}
  if(url==='/api/avaliacoes/lista'){const{data}=await _SB.from('avaliacoes').select('*').order('Data',{ascending:false});return(data||[]).map(r=>({...r,_idx:r.id}));}

    const allFalhas=(fs.data||[]).map(enrich);

    const _toTrim=d=>{if(!d)return null;const dt=new Date(String(d).slice(0,10)+'T00:00:00');const q=Math.ceil((dt.getMonth()+1)/3);return`Q${q} ${dt.getFullYear()}`;};

    const _nv0=niveis[0]||{};const _nvKeys=Object.keys(_nv0);
    const _kMin=_nvKeys.find(k=>/pontos/i.test(k)&&/m.n/i.test(k))||'Pontos Mín';
    const _kMax=_nvKeys.find(k=>/pontos/i.test(k)&&/m.x/i.test(k))||'Pontos Máx';
    const _kNiv=_nvKeys.find(k=>/n.vel/i.test(k)&&!/pontos/i.test(k))||'Nível';
    const _kDes=_nvKeys.find(k=>/designa/i.test(k))||'Designação';
    const resumo=Object.entries(pontos).map(([prof,pts])=>{const nv=niveis.find(n=>pts>=n[_kMin]&&pts<=n[_kMax]);return{Professor:prof,Pontos:pts,Nivel:nv?.[_kNiv]??-1,Designacao:nv?.[_kDes]||'—',Medida:nv?.['Medida']||'—'};});
    return{resumo,trimestres,falhas:filtered,catalogo,niveis};
  }
  if(url==='/api/falhas/catalogo'){const[c,n]=await Promise.all([_SB.from('catalogo_faltas').select('*'),_SB.from('niveis_sancao').select('*')]);return{catalogo:c.data||[],niveis:n.data||[]};}
  const falhaDelM=url.match(/^\/api\/falha\/(\d+)$/);
  if(falhaDelM&&method==='DELETE'){const{error}=await _SB.from('falhas_sancoes').delete().eq('id',parseInt(falhaDelM[1]));if(error)return{error:error.message};return{ok:true};}
  if(url==='/api/users'){const{data}=await _SB.from('profiles').select('*').order('id');return data||[];}
  if(url==='/api/permissions')return{};
  if(url.startsWith('/api/agenda')){
    const _aqp=new URLSearchParams(url.includes('?')?url.split('?')[1]:'');
    const _aper=_aqp.get('periodo')||'semana';
    const _aref=_aqp.get('data')?new Date(_aqp.get('data')):new Date();
    let _aStart,_aEnd;
    if(_aper==='hoje'){
      _aStart=_aEnd=_aref.toISOString().slice(0,10);
    } else if(_aper==='semana'){
      const dow=_aref.getDay(); const diff=dow===0?-6:1-dow;
      const mon=new Date(_aref); mon.setDate(_aref.getDate()+diff);
      const sun=new Date(mon); sun.setDate(mon.getDate()+6);
      _aStart=mon.toISOString().slice(0,10); _aEnd=sun.toISOString().slice(0,10);
    } else {
      _aStart=new Date(_aref.getFullYear(),_aref.getMonth(),1).toISOString().slice(0,10);
      _aEnd=new Date(_aref.getFullYear(),_aref.getMonth()+1,0).toISOString().slice(0,10);
    }
    const{data:_ad}=await _SB.from('avaliacoes').select('*').gte('Data',_aStart).lte('Data',_aEnd).order('Data').order('Hora');
    const events=(_ad||[]).map(r=>({
      data:(r['Data']||'').slice(0,10), hora:r['Hora']||null,
      cliente:r['Nome']||'', servico:r['Serviço']||'', tecnico:r['Técnico Responsável']||'',
      nivel:r['Nível']||'', status:r['Status Geral Avaliação']||'', apareceu:r['Apareceu']||null,
      sinal:r['Sinal']||null, tipo:'Avaliação', _idx:r['id']
    }));
    return{events};
  }
  const cM=url.match(/^\/api\/cliente\/(.+)$/);
  if(cM){
    const nome=decodeURIComponent(cM[1]);
    const[cli,serv,aval,log,pag26,pag25,mot,lc,logcom,conv]=await Promise.all([
      _SB.from('clientes').select('*').eq('Nome',nome).single(),
      _SB.from('servicos').select('*').eq('Cliente',nome),
      _SB.from('avaliacoes').select('*').eq('Nome',nome),
      _SB.from('historico').select('*').eq('cliente',nome).order('timestamp',{ascending:false}),
      _SB.from('pag_clientes_2026').select('*').eq('Cliente',nome),
      _SB.from('pag_clientes_2025').select('*').eq('Cliente',nome),
      _SB.from('motor2026').select('*').eq('Cliente',nome).order('id',{ascending:false}).limit(1).maybeSingle(),
      _SB.from('log_contratos').select('*').eq('Cliente',nome),
      _SB.from('log_comercial').select('*').eq('Contacto',nome).order('Data A\xe7\xe3o',{ascending:false}),
      _SB.from('conversoes').select('*').eq('Cliente',nome).order('Data da Marca\xe7\xe3o/In\xedcio',{ascending:false})
    ]);
    const mIdx=arr=>(arr||[]).map(r=>({...r,_idx:r.id}));
    const logComData=(logcom.data||[]).map(l=>({...l,'Dias Atrás':l['Data Ação']?Math.floor((new Date()-new Date(String(l['Data Ação']).slice(0,10)))/86400000):null}));
    return{info:_recomputeClienteContacto(cli.data),servicos:mIdx(serv.data),avaliacoes:mIdx(aval.data),
      historico:log.data||[],pag_2026:mIdx(pag26.data),pag_2025:mIdx(pag25.data),
      motor:mot.data||null,log_contratos:mIdx(lc.data),log_comercial:logComData,conversoes:mIdx(conv.data)};
  }
  const oM=url.match(/^\/api\/on\/(\d+)$/);
  if(oM){
    const nONInt=parseInt(oM[1]);
    const[plRes,logRes]=await Promise.all([
      _SB.from('pipeline').select('*').eq('N\u00ba ON',nONInt).single(),
      _SB.from('log_comercial').select('*').eq('N\u00ba ON',String(nONInt)).order('Data A\xe7\xe3o',{ascending:false})
    ]);
    const info=plRes.data||{};
    const log=(logRes.data||[]).map((l,i)=>({...l,_idx:i,'Dias Atrás':l['Data Ação']?Math.floor((new Date()-new Date(String(l['Data Ação']).slice(0,10)))/86400000):null}));
    return{info,log_comercial:log,historico:[]};
  }
  const lM=url.match(/^\/api\/lookup\/([^\/]+)\/([^?]+)/);
  if(lM){
    const f=decodeURIComponent(lM[2]);
    const qs=url.includes('?')?new URLSearchParams(url.split('?')[1]):null;
    const ff=qs?.get('filter_field');
    const fsel=f.includes(' ')?`"${f}"`:f;
    let q=_SB.from(_TABLE_MAP[lM[1]]||lM[1]).select(ff?`${fsel},"${ff}"`:fsel);
    if(ff) q=q.not(ff,'is',null).neq(ff,'');
    const{data}=await q;
    return data?[...new Set(data.map(r=>r[f]).filter(Boolean))].sort():[];
  }
  if(url.startsWith('/api/autofill')){
    const p=new URLSearchParams(url.split('?')[1]||'');
    const src=_TABLE_MAP[p.get('src')]||p.get('src');
    const rf=p.get('return_field'); const mf=p.get('match_field'); const mv=p.get('match_val');
    const rfSel=rf&&rf.includes(' ')?`"${rf}"`:rf;
    if(mv&&mf){
      let q=_SB.from(src).select(rfSel).eq(mf,mv).limit(1);
      const{data}=await q;
      return{value:data&&data[0]?data[0][rf]:null};
    }
    const{data}=await _SB.from(src).select(rfSel);
    return data?[...new Set(data.map(r=>r[rf]).filter(Boolean))].sort():[];
  }
  const eM=url.match(/^\/api\/clientes\/(.+)\/estado$/);

  // Rota direta por database id: /api/data/{table}/dbid/{id}
  const dbidM=url.match(/^\/api\/data\/([^\/]+)\/dbid\/(\d+)$/);
  if(dbidM){
    const table=_TABLE_MAP[dbidM[1]]||dbidM[1];const dbId=parseInt(dbidM[2]);
    if(method==='DELETE'){const{error}=await _SB.from(table).delete().eq('id',dbId);return error?{error:error.message}:{ok:true};}
    if(method==='PUT'){const{data,error}=await _SB.from(table).update(body).eq('id',dbId).select().single();return error?{error:error.message}:data;}
  }
  const dM=url.match(/^\/api\/data\/([^\/]+)(?:\/(\d+))?$/);

    if(method==='GET')return _sbGetAll(table);
    if(method==='POST')return _sbInsert(table,body);
    if(method==='PUT')return _sbUpdate(table,idx,body);
    if(method==='DELETE')return _sbDelete(table,idx);

  // /api/vendas/resumo
  if(url.startsWith('/api/vendas/resumo')){

    const _sortTrim=(a,b)=>{const[qa,ya]=a.split(' ');const[qb,yb]=b.split(' ');return ya!==yb?parseInt(yb)-parseInt(ya):parseInt(qb[1])-parseInt(qa[1]);};
    const trimestres=[...new Set(vendas.map(v=>v['Trimestre']).filter(Boolean))].sort(_sortTrim);
    const _now=new Date();const _curTrim=`Q${Math.ceil((_now.getMonth()+1)/3)} ${_now.getFullYear()}`;
    const selectedTrim=_trimQ||(trimestres.includes(_curTrim)?_curTrim:trimestres[0])||'';

    const vendasTrim=vendas.filter(v=>v['Trimestre']===selectedTrim);
    const resumo=colabs.map(col=>{
      const nome=col['Nome Oficial'];
      const cargo=col['Cargo'];
      const condicoes=parseFloat(col['Condições'])||0;
      const minhasVendas=vendasTrim.filter(v=>v['Colaborador']===nome);
      const totalVendas=minhasVendas.reduce((s,v)=>s+(parseFloat(v['Valor s/IVA (€)'])||0),0);
      const bonusRow=bonus.find(b=>b['Professor']===nome);
      const isClean=bonusRow?bonusRow[bonusCol]==='true':false;
      const train=totalVendas*condicoes;
      const isCoordenador=cargo==='Coordenador';
      const vendaOk=isCoordenador?true:totalVendas>=750;
      const elegivel=isClean&&vendaOk;
      const bonusRate=isCoordenador?0.071:0.077;
      const bonusVal=elegivel?train*bonusRate:0;
      const detalhe=minhasVendas.map(v=>({
        codigo:v['Código Aval']||'—',cliente:v['Cliente']||'—',

      }));

        'Condições':condicoes,Train:train,'Elegível':elegivel?'Sim':'Não',
        'Bónus':bonusVal,DetalheVendas:detalhe};
    });
    return{resumo,trimestres,trimestre:selectedTrim};
  }
  // /api/colaborador/<nome>
  const colabM=url.match(/^\/api\/colaborador\/(.+)$/);
  if(colabM){
    const nome=decodeURIComponent(colabM[1]);

    const _kMax=_nvKeys.find(k=>/pontos/i.test(k)&&/m.x/i.test(k))||'Pontos Máx';
    const _kNiv=_nvKeys.find(k=>/n.vel/i.test(k)&&!/pontos/i.test(k))||'Nível';
    const _kDes=_nvKeys.find(k=>/designa/i.test(k))||'Designação';
    const nivelAtual=niveis.find(n=>totalPontos>=n[_kMin]&&totalPontos<=n[_kMax]);
    return{info:dc.data||{},log_colaboradores:lc.data||[],historico:hist.data||[],
      sub_como_original:subOrig.data||[],sub_como_substituto:subSubst.data||[],
      falhas,totalPontos,nivelAtual:{nivel:nivelAtual?.[_kNiv]??0,designacao:nivelAtual?.[_kDes]||'—',medida:nivelAtual?.['Medida']||'—'},catalogo,
      vendas_log:vl.data||[],vendas_bonus:vb.data||null};
  }
  // /api/historico/revert/<id>
  const revertM=url.match(/^\/api\/historico\/revert\/(.+)$/);
  if(revertM&&method==='POST'){
    const{data:hist,error:he}=await _SB.from('historico').select('*').eq('_id',revertM[1]).single();
    if(he||!hist?.snapshot)return{error:'Snapshot não encontrado'};
    const table=_TABLE_MAP[hist.colecao]||hist.colecao;
    const{error}=await _SB.from(table).update(hist.snapshot).eq('id',hist.snapshot.id);
    if(error)return{error:error.message};
    await _SB.from('historico').update({revertido:true,revertido_em:new Date().toISOString()}).eq('_id',revertM[1]);
    return{ok:true};
  }
  // /api/users/<uid>PUT/DELETE
  const userM=url.match(/^\/api\/users\/(\d+)$/);
  if(userM){
    const uid=parseInt(userM[1]);
    if(method==='PUT'){const{error}=await _SB.from('profiles').update(body).eq('id',uid);if(error)return{error:error.message};return{ok:true};}
    if(method==='DELETE'){const{error}=await _SB.from('profiles').update({active:false}).eq('id',uid);if(error)return{error:error.message};return{ok:true};}
  }
    console.warn('api() nao mapeado:',url);return{error:'nao suportado: '+url};
}

// LOGIN
async function doLogin(){
  const u=document.getElementById('loginUser').value, p=document.getElementById('loginPass').value;
  const r=await api('/api/login',{method:'POST',body:{username:u,password:p}});
  if(r.ok){currentUser=r.user;currentPerms=r.permissions;showApp();}
  else{const e=document.getElementById('loginError');e.textContent=r.error||'Erro';e.style.display='block';}
}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function doLogout(){
  await api('/api/logout',{method:'POST'});
  currentUser=null;currentPerms=[];
  sessionStorage.removeItem('crm_section');sessionStorage.removeItem('crm_cli');sessionStorage.removeItem('crm_pip');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}

async function checkSession(){
  const r=await api('/api/me');
  if(r.ok){currentUser=r.user;currentPerms=r.permissions;showApp();}
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userAvatar').textContent=currentUser.name[0];
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userRole').textContent=currentUser.role;
  buildSidebar();
  const _savedSection = sessionStorage.getItem('crm_section')||'dashboard';
  const _savedCli = sessionStorage.getItem('crm_cli');
  if(_savedSection==='clientes' && _savedCli){
    _cliSelected=_savedCli;
    navigate('clientes');
  } else {
    navigate(_savedSection);
  }
}

// MOBILE SIDEBAR
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('mob-open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// SIDEBAR
function buildSidebar(){
  const nav=document.getElementById('sidebarNav');
  const groups={};
  for(const[k,s] of Object.entries(SECTIONS)){
    if(s.hidden) continue;
    if(k!=='dashboard'&&k!=='backoffice'&&!currentPerms.includes(k)) continue;
    if(k==='backoffice'&&currentUser.role!=='Admin') continue;
    const g=s.group||'Outros';
    if(!groups[g]) groups[g]=[];
    groups[g].push({key:k,...s});
  }
  let html='';
  for(const[g,items] of Object.entries(groups)){
    html+=`<div class="nav-group"><div class="nav-group-title">${g}</div>`;
    for(const it of items){
      html+=`<div class="nav-item" data-key="${it.key}" onclick="navigate('${it.key}');closeSidebarMobile()">${it.title}</div>`;
    }
    if(g==='Financeiro') html+=`<div class="nav-item" onclick="openImportFaturacao();closeSidebarMobile()">Importar Faturação</div>`;
    html+='</div>';
  }
  nav.innerHTML=html;
}

// NAVIGATION
async function navigate(section){
  currentSection=section;
  sessionStorage.setItem('crm_section',section);
  if(section!=='clientes') sessionStorage.removeItem('crm_cli');
  if(section!=='pipeline') sessionStorage.removeItem('crm_pip');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.key===section));
  const main=document.getElementById('mainContent');
  if(section==='dashboard')  return renderDashboard(main);
  if(section==='backoffice') return renderBackoffice(main);
  if(section==='ciclos')            return renderGestaoClientes(main);
  if(section==='avaliacoes')        return renderAgenda(main);
  if(section==='responsabilidades') return renderResponsabilidadesMatriz(main);
  if(section==='calculadora')       return renderCalculadora(main);
  if(section==='clientes')          return renderClientes(main);
  if(section==='pipeline')          return renderPipeline(main);
  if(section==='falhas_sancoes') return renderFalhas(main);
  if(section==='vendas_bonus')        return renderVendasBonus(main);
  if(section==='historico_faturacao') return renderHistoricoFaturacao(main);
  if(section==='alertas')             return renderAlertas(main);
  if(section==='totais_pagamentos')   return renderTotaisPagamentos(main);
  await renderDataPage(main,section);
}

function _dbKpiCard(label,value,sub,color,onclick){
  const cl=onclick?'stat-card clickable':'stat-card';
  const oc=onclick?`onclick="${onclick}"`:'';
  return `<div class="${cl}" ${oc}><div class="label">${label}</div><div class="value ${color||''}">${value??'—'}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}
function _dbMiniTable(title,cols,rows,emptyMsg){
  const th=cols.map(c=>`<th>${c}</th>`).join('');
  const tb=rows.length
    ?rows.map(r=>`<tr>${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')
    :`<tr><td colspan="${cols.length}" style="text-align:center;color:var(--text-muted);padding:16px">${emptyMsg||'Sem dados'}</td></tr>`;
  return `<div class="db-section"><div class="db-section-title">${title}</div><div class="table-wrap"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div></div>`;
}

let _dbCache={};
function _dbDetail(key){
  const d=_dbCache[key];if(!d)return;
  let body='';
  if(d.kpis){
    body+=`<div class="db-drawer-kpi">${d.kpis.map(k=>`<div class="db-drawer-kpi-item"><div class="dk-label">${k.label}</div><div class="dk-val" style="color:${k.color||'var(--text)'}">${k.val}</div></div>`).join('')}</div>`;
  }
  if(d.rows&&d.rows.length){
    body+=`<div class="db-drawer-list">${d.rows.map(r=>{
      const oc=r.link?`onclick="${r.link}" style="grid-template-columns:1fr auto;cursor:pointer"`:'style="grid-template-columns:1fr auto"';
      const arrow=r.link?`<span style="font-size:11px;color:var(--text-muted);margin-left:4px">›</span>`:'';
      return`<div class="db-drawer-row" ${oc}>
        <div><div class="dr-name">${r.name}${arrow}</div><div class="dr-sub">${r.sub||''}</div></div>
        <div class="dr-badge" style="background:${r.bc||'var(--surface3)'};color:${r.tc||'var(--text-muted)'}">${r.badge||''}</div>
      </div>`;
    }).join('')}</div>`;
  }else{
    body+='<div style="text-align:center;color:var(--text-muted);padding:32px;font-size:13px">Sem dados</div>';
  }
  let dr=document.getElementById('_db_drawer');
  if(!dr){
    document.body.insertAdjacentHTML('beforeend',`
      <div class="db-drawer-overlay" id="_db_overlay" onclick="_dbCloseDetail()"></div>
      <div class="db-drawer" id="_db_drawer">
        <div class="db-drawer-header">
          <h3 id="_db_drawer_title"></h3>
          <button class="db-drawer-close" onclick="_dbCloseDetail()"></button>
        </div>
        <div class="db-drawer-body" id="_db_drawer_body"></div>
      </div>`);
    dr=document.getElementById('_db_drawer');
  }
  document.getElementById('_db_drawer_title').textContent=d.title;
  document.getElementById('_db_drawer_body').innerHTML=body;
  dr.classList.add('open');
  document.getElementById('_db_overlay').classList.add('open');
}
function _dbCloseDetail(){
  const dr=document.getElementById('_db_drawer'),ov=document.getElementById('_db_overlay');
  if(dr)dr.classList.remove('open');if(ov)ov.classList.remove('open');
}

        <div class="dr-name">${r.name}</div><div class="dr-sub">${r.sub||''}</div>
      </div>
      <div class="dr-badge" style="background:${r.bc||'var(--surface3)'};color:${r.tc||'var(--text-muted)'}">${r.badge||''}</div>
    </div>`;
  });
  const body=`${kpisHtml}
    <div style="padding:6px 12px 0;font-size:11px;color:var(--text-muted)">Seleciona clientes para regularizar em bloco ou clica no nome para abrir a ficha.</div>
    <div class="db-drawer-list" id="_db_atraso_list">${rows}</div>
    <div id="_db_atraso_footer" style="padding:12px 16px;border-top:1px solid var(--border);display:none">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="_dbRegularizarSelecionados()">Regularizar <span id="_db_atraso_count">0</span> cliente(s)</button>
    </div>`;
  let dr=document.getElementById('_db_drawer');
  if(!dr){
    document.body.insertAdjacentHTML('beforeend',`<div class="db-drawer-overlay" id="_db_overlay" onclick="_dbCloseDetail()"></div><div class="db-drawer" id="_db_drawer"><div class="db-drawer-header"><h3 id="_db_drawer_title"></h3><button class="db-drawer-close" onclick="_dbCloseDetail()"></button></div><div class="db-drawer-body" id="_db_drawer_body"></div></div>`);
    dr=document.getElementById('_db_drawer');
  }
  document.getElementById('_db_drawer_title').textContent=d.title;
  document.getElementById('_db_drawer_body').innerHTML=body;
  dr.classList.add('open');
  document.getElementById('_db_overlay').classList.add('open');
}

function _dbAtrasoCount(){
  const n=document.querySelectorAll('#_db_atraso_list input:checked').length;
  const footer=document.getElementById('_db_atraso_footer');
  const cnt=document.getElementById('_db_atraso_count');
  if(footer) footer.style.display=n>0?'block':'none';
  if(cnt) cnt.textContent=n;
}

async function _dbRegularizarSelecionados(){
  const checked=[...document.querySelectorAll('#_db_atraso_list input:checked')].map(cb=>cb.value);
  if(!checked.length) return;
  const rawRows=(_dbCache.atraso||{})._rawRows||[];
  const toUpdate=rawRows.filter(r=>checked.includes(r['Cliente']));
  if(!toUpdate.length) return toast('Sem linhas para atualizar','error');
  const formas=['Transferência Multibanco','Débito Direto','Pagamento Mbway','Numerário'];
  const opt=arr=>arr.map(v=>`<option>${v}</option>`).join('');
  document.getElementById('modalTitle').textContent=` Regularizar ${checked.length} cliente(s)`;
  document.getElementById('modalBody').innerHTML=`
    <div style="margin-bottom:14px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:12px;color:var(--text-muted);line-height:1.6">${checked.join(' · ')}</div>
    <div class="form-group"><label>Estado</label><select id="br_estado"><option>Pago</option><option>Ativo</option><option>Suspendeu</option><option>Cancelou</option></select></div>
    <div class="form-group"><label>Valor Pago (€) <span style="color:var(--text-muted);font-weight:400">— deixar vazio para usar o valor de cada linha</span></label><input type="number" id="br_valor" step="0.01" placeholder="Opcional"></div>
    <div class="form-group"><label>Forma de Pagamento</label><select id="br_forma"><option value=""></option>${opt(formas)}</select></div>
    <div class="form-group"><label>Nº Doc</label><input type="text" id="br_doc" placeholder="Opcional"></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalSave').onclick=async()=>{
    const estado=document.getElementById('br_estado').value;
    const valorRaw=document.getElementById('br_valor').value;
    const forma=document.getElementById('br_forma').value||null;
    const doc=document.getElementById('br_doc').value||null;
    let ok=0,erros=0;
    for(const row of toUpdate){
      const valor=valorRaw?parseFloat(valorRaw):(parseFloat(row['Valor a Pagar'])||null);
      const{error}=await _SB.from('pag_clientes_2026').update({'Estado':estado,'Valor Pago':valor,'Forma Pagamento':forma,'Nº Doc':doc}).eq('id',row.id);
      if(error) erros++; else ok++;
    }
    sectionData['pag_clientes_2026']=null;
    closeModal(); _dbCloseDetail();
    if(erros) toast(`${ok} atualizados · ${erros} erros`,'error');
    else toast(`${ok} pagamentos regularizados `);
    renderDashboard(document.getElementById('mainContent'));
  };
}

let _dbViewMode='admin';
async function renderDashboard(el){
  const role=currentUser.role||'';
  const isAdmin=!['Direcção','Comercial','Técnico','Coordenador'].includes(role);
  if(!isAdmin){
    el.innerHTML=`<div style="padding:40px;color:var(--text-muted);text-align:center">A carregar...</div>`;
    if(role==='Direcção') return _dbDireccao(el);
    if(role==='Comercial') return _dbComercial(el);
    if(role==='Técnico'||role==='Coordenador') return _dbTecnico(el);
    return _dbAdmin(el);
  }
  const DB_TABS=[{k:'admin',l:'Geral'},{k:'comercial',l:'Comercial'},{k:'tecnico',l:'Técnico'},{k:'direccao',l:'Direcção'}];
  el.innerHTML=`
    <div style="padding:16px 20px 8px;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch">
      <div class="gtab-wrap">
        ${DB_TABS.map(t=>`<button class="gtab${_dbViewMode===t.k?' gtab-active':''}"
          onclick="_dbViewMode='${t.k}';renderDashboard(document.getElementById('mainContent'))">${t.l}</button>`).join('')}
      </div>
    </div>
    <div id="db-view-content"><div style="padding:40px;color:var(--text-muted);text-align:center">A carregar...</div></div>`;
  const c=document.getElementById('db-view-content');
  if(_dbViewMode==='comercial') return _dbComercial(c);
  if(_dbViewMode==='tecnico')   return _dbTecnico(c);
  if(_dbViewMode==='direccao')  return _dbDireccao(c);
  return _dbAdmin(c);
}

async function _dbAdmin(el){
  try{
  const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const now=new Date(); const mi=now.getMonth();
  const curMonth=MONTHS[mi]; const prevMonth=mi>0?MONTHS[mi-1]:null;

  const[stats,hist,alrtTop,cliRes,servsRes,pag26Res,pipRes,alrtCount,avalRes,motRes,convRes]=await Promise.all([
    api('/api/stats'),
    _SB.from('historico').select('*').order('timestamp',{ascending:false}).limit(5),
    _SB.from('v_alertas').select('*').order('DiasAtraso',{ascending:false}).limit(5),
    _SB.from('clientes').select('*'),
    _SB.from('servicos').select('*'),
    _SB.from('pag_clientes_2026').select('*'),
    _SB.from('pipeline').select('*'),
    _SB.from('v_alertas').select('*',{count:'exact',head:true}),
    _SB.from('avaliacoes').select('Nome,Data'),
    _SB.from('motor2026').select('*'),
    _SB.from('conversoes').select('*')
  ]);

  const cli=cliRes.data||[], servs=servsRes.data||[], pag=pag26Res.data||[], pip=pipRes.data||[], avals=avalRes.data||[], motor=motRes.data||[];
  const conv2026=(convRes.data||[]).filter(r=>{const d=r['Data da Marcação/Início']; return d&&d>='2026-01-01'&&d<'2027-01-01';});

  // Status do cliente: valor pode ser "Ativo ·  Sem Avaliação", "Híbrido ativo ·...", etc.
  const isCliAtivo=c=>/^Ativo|^Híbrido ativo/i.test(c['Status']||'');
  const isCliSusp=c=>/suspenso/i.test(c['Status']||'');
  const isCliCanc=c=>c['Status']==='Cancelado';
  const cliAtivos=cli.filter(isCliAtivo).length;
  const cliSusp=cli.filter(isCliSusp).length;
  const cliCanc=cli.filter(isCliCanc).length;

  // Categorização de serviços (baseada nos nomes reais da tabela servicos)
  const emCurso=s=>s['Estado do serviço']==='Em curso';
  const isStudio=s=>/^PT\d|^Duo|^Pilates|^Fitness|^Ced[eê]ncia|Avulso|Pack 10|Planos Treinos/i.test(s['Serviço']||'');
  const isLab=s=>/Avalia[cç]|Pack Elite|Pack Performance|Pack Vitalidade/i.test(s['Serviço']||'');
  const isGL4=s=>/Gestão Light.*4\s*semanas?/i.test(s['Serviço']||'');
  const isGL12=s=>/Gestão Light.*12\s*semanas?/i.test(s['Serviço']||'');
  const isGI=s=>/Gestão Integral/i.test(s['Serviço']||'');
  const isConsulta=s=>/Consulta/i.test(s['Serviço']||'');

  const studioAt=servs.filter(s=>isStudio(s)&&emCurso(s)).length;
  const labAt=servs.filter(s=>isLab(s)&&emCurso(s)).length;
  const gl4At=servs.filter(s=>isGL4(s)&&emCurso(s)).length;
  const gl12At=servs.filter(s=>isGL12(s)&&emCurso(s)).length;
  const giAt=servs.filter(s=>isGI(s)&&emCurso(s)).length;
  const consultAt=servs.filter(s=>isConsulta(s)&&emCurso(s)).length;

  // Clientes ativos por modalidade (histórico — cliente ativo que já teve o serviço)
  const cliActivosSet=new Set(cli.filter(isCliAtivo).map(c=>c['Nome']));
  const cliStudio=new Set(servs.filter(s=>isStudio(s)&&cliActivosSet.has(s['Cliente'])).map(s=>s['Cliente'])).size;
  const cliLab=new Set(avals.filter(a=>cliActivosSet.has(a['Nome'])).map(a=>a['Nome'])).size;
  const cliGestao=new Set(servs.filter(s=>(isGL4(s)||isGL12(s)||isGI(s))&&cliActivosSet.has(s['Cliente'])).map(s=>s['Cliente'])).size;
  const cliConsulta=new Set(servs.filter(s=>isConsulta(s)&&cliActivosSet.has(s['Cliente'])).map(s=>s['Cliente'])).size;
  // Contratos Em curso (ciclo atual ativo)
  const emCursoStudio=studioAt, emCursoLab=labAt, emCursoGestao=gl4At+gl12At+giAt, emCursoConsulta=consultAt;

  // Último mês com pagamentos lançados em pag_clientes_2026
  const mesesComDados=MONTHS.filter(m=>pag.some(r=>r['Mês']===m&&(r['Estado']==='Ativo'||r['Estado']==='Pago')&&parseFloat(r['Valor Pago']||0)>0));
  const ultimoMesLancado=mesesComDados.length?mesesComDados[mesesComDados.length-1]:null;
  const pagUltimoMes=ultimoMesLancado?pag.filter(r=>r['Mês']===ultimoMesLancado&&(r['Estado']==='Ativo'||r['Estado']==='Pago')):[];
  const receitaMes=pagUltimoMes.reduce((s,r)=>s+(parseFloat(r['Valor Pago'])||0),0);
  const receitaMesLabel=ultimoMesLancado||curMonth;
  const nPagConfirmados=pagUltimoMes.length;

  // Clientes sem confirmação: têm plano em motor2026 no último mês lançado mas sem registo em pag_clientes_2026
  const MOT_COL_MAP={'Janeiro':'Jan','Fevereiro':'Fev','Março':'Mar','Abril':'Abr','Maio':'Mai','Junho':'Jun','Julho':'Jul','Agosto':'Ago','Setembro':'Set','Outubro':'Out','Novembro':'Nov','Dezembro':'Dez'};
  const pagUltimoMesClientes=new Set(pagUltimoMes.map(r=>r['Cliente']));
  const motColAtual=ultimoMesLancado?MOT_COL_MAP[ultimoMesLancado]:'Jan';
  const semConfirmacao=motor.filter(r=>parseFloat(r[motColAtual]||0)>0&&!pagUltimoMesClientes.has(r['Cliente']));
  const emAtrasoN=semConfirmacao.length;
  const emAtrasoRows=semConfirmacao;

  // Desistências e novas adesões: comparar motor2026 mês a mês
  const MOT_COLS_ALL=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const motColAnterior=mi>0?MOT_COLS_ALL[mi-1]:null;
  const motColAtual2=MOT_COLS_ALL[mi];
  let desist=0, novasAdes=0, retPct=null;
  if(motColAnterior){
    const prevMotAtivos=new Set(motor.filter(r=>parseFloat(r[motColAnterior]||0)>0).map(r=>r['Cliente']));
    const curMotAtivos=new Set(motor.filter(r=>parseFloat(r[motColAtual2]||0)>0).map(r=>r['Cliente']));
    const retidos=[...prevMotAtivos].filter(c=>curMotAtivos.has(c)).length;
    desist=prevMotAtivos.size-retidos;
    novasAdes=[...curMotAtivos].filter(c=>!prevMotAtivos.has(c)).length;
    retPct=prevMotAtivos.size>0?Math.round((retidos/prevMotAtivos.size)*100):null;
  }

  // Repetição Lab
  const labPorCliente={};
  servs.filter(isLab).forEach(s=>{const c=s['Cliente']||'';if(c)labPorCliente[c]=(labPorCliente[c]||0)+1;});
  const labTotalCli=Object.keys(labPorCliente).length;
  const labRepet=Object.values(labPorCliente).filter(v=>v>1).length;
  const labRepPct=labTotalCli>0?Math.round((labRepet/labTotalCli)*100):0;

  // Pipeline
  const pipeAberto=pip.filter(p=>p['Aberta/Fechada']==='Aberta').length;
  const alertasN=alrtCount.count??0;

  // Monthly chart data (last 5 months) — pag_clientes_2026 já inclui PT, Lab, CED, Duo, etc.
  const chartMonths=MONTHS.slice(Math.max(0,mi-4),mi+1);
  const monthData=chartMonths.map(m=>{
    const rows=pag.filter(r=>r['Mês']===m);
    const pago=rows.filter(r=>r['Estado']==='Pago'||r['Estado']==='Ativo').reduce((s,r)=>s+(parseFloat(r['Valor Pago'])||0),0);
    const ativos=rows.filter(r=>r['Estado']==='Ativo').length;
    return{m:m.slice(0,3),pago,ativos};
  });
  const maxPago=Math.max(...monthData.map(x=>x.pago),1);
  const maxAtivos=Math.max(...monthData.map(x=>x.ativos),1);

  // Chart: avaliações por mês (últimos 12)
  const evalByMonth={};
  avals.forEach(a=>{
    if(!a['Data']) return;
    const d=new Date(a['Data']); if(isNaN(d)) return;
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    evalByMonth[key]=(evalByMonth[key]||0)+1;
  });
  const last12Months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const lbl=d.toLocaleDateString('pt-PT',{month:'short'}).replace('.','');
    last12Months.push({key,label:lbl.charAt(0).toUpperCase()+lbl.slice(1,3),val:evalByMonth[key]||0});
  }
  // Chart: subscrições ativas por mês (motor2026 — clientes com valor > 0 nesse mês)
  const MOT_COLS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const subsMonthData=MOT_COLS.slice(0,mi+1).map((col,i)=>({
    label:col,
    val:motor.filter(r=>r['Estado Hoje']!=='Cancelado'&&parseFloat(r[col]||0)>0).length
  })).filter(m=>m.val>0);
  // SVG line chart helper
  function _svgLine(data,color,h=110){
    if(!data.length||data.every(d=>d.val===0)) return '<div style="text-align:center;color:var(--text-muted);padding:28px;font-size:12px">Sem dados</div>';
    const w=380,pad=28;
    const max=Math.max(...data.map(d=>d.val),1);
    const pts=data.map((d,i)=>({...d,x:pad+(i/Math.max(data.length-1,1))*(w-pad*2),y:h-22-((d.val/max)*(h-42))}));
    const path=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const area='M'+pts[0].x.toFixed(1)+','+(h-22)+' '+pts.map(p=>'L'+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+' L'+pts[pts.length-1].x.toFixed(1)+','+(h-22)+' Z';
    const gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".2"/><stop offset="100%" stop-color="${color}" stop-opacity=".01"/></linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${path}" stroke="${color}" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      ${pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${(p.y-9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${color}">${p.val||''}</text>`).join('')}
      ${pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${p.label}</text>`).join('')}
    </svg>`;
  }

  // Service distribution
  const gestaoAt=gl4At+gl12At+giAt;
  const totalCli=cliStudio+cliLab+cliGestao+cliConsulta||1;
  // Total avaliações dos clientes ativos (Lab são sessões pontuais, não contratos Em curso)
  const avalsAtivos=avals.filter(a=>cliActivosSet.has(a['Nome'])).length;
  const labRepPorCli=cliLab>0?Math.round((labRepet/cliLab)*100):0;
  // Barras: clientes por modalidade (histórico)
  const srvs=[
    {key:'studio',nome:'Studio / PT',n:cliStudio,sub:`${emCursoStudio} com contrato ativo`,color:'#aaff00',bg:'rgba(170,255,0,.15)'},
    {key:'lab',nome:'Lab & Avaliações',n:cliLab,sub:`${avalsAtivos} avaliações realizadas · ${labRepPct}% repetiram`,color:'#2563eb',bg:'rgba(37,99,235,.12)'},
    {key:'gestao',nome:'Gestão',n:cliGestao,sub:`${emCursoGestao} em curso · GL4:${gl4At} GL12:${gl12At} GI:${giAt}`,color:'#7c3aed',bg:'rgba(124,58,237,.12)'},
    {key:'consultas',nome:'Consultas',n:cliConsulta,sub:`${emCursoConsulta} em curso`,color:'#16a34a',bg:'rgba(22,163,74,.12)'},
  ];
  // gestao/consultas drawer rows — built after srvs, merged into _dbCache below
  const _gestaoRows=servs.filter(s=>(isGL4(s)||isGL12(s)||isGI(s))&&cliActivosSet.has(s['Cliente'])).reduce((acc,s)=>{if(!acc.find(r=>r.name===s['Cliente']))acc.push({name:s['Cliente'],sub:s['Serviço'],badge:s['Estado do serviço'],bc:'rgba(124,58,237,.1)',tc:'#7c3aed'});return acc;},[]);
  const _consultaRows=servs.filter(s=>isConsulta(s)&&cliActivosSet.has(s['Cliente'])).reduce((acc,s)=>{if(!acc.find(r=>r.name===s['Cliente']))acc.push({name:s['Cliente'],sub:s['Serviço'],badge:s['Estado do serviço'],bc:'rgba(22,163,74,.1)',tc:'var(--success)'});return acc;},[]);

  // Gauge: retention or client health
  const gaugeVal=retPct!=null?retPct:cliAtivos+cliSusp+cliCanc>0?Math.round((cliAtivos/(cliAtivos+cliSusp+cliCanc))*100):0;
  const gaugeLabel=retPct!=null?'Retenção vs '+prevMonth:'% Clientes Ativos';
  const R=40,CX=60,CY=52,semi=Math.PI*R;
  const dash=(gaugeVal/100)*semi;
  const gaugeSVG=`<svg viewBox="0 0 120 62" class="db-gauge-svg">
    <path d="M${CX-R},${CY} A${R},${R} 0 0,1 ${CX+R},${CY}" fill="none" stroke="var(--surface3)" stroke-width="9" stroke-linecap="round"/>
    <path d="M${CX-R},${CY} A${R},${R} 0 0,1 ${CX+R},${CY}" fill="none" stroke="#aaff00" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${semi.toFixed(1)}"/>
    <text x="${CX}" y="${CY-4}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text)">${gaugeVal}%</text>
    <text x="${CX}" y="${CY+9}" text-anchor="middle" font-size="6.5" fill="var(--text-muted)">${gaugeLabel}</text>
  </svg>`;

  // Recent history items
  const histItems=(hist.data||[]).slice(0,5).map(h=>{
    const init=(h.utilizador||'?').charAt(0).toUpperCase();
    return`<div class="db-recent-item">
      <div class="db-ri-avatar">${init}</div>
      <div class="db-ri-body"><div class="ri-name">${h.utilizador||'—'}</div><div class="ri-sub">${h.acao||'—'} · ${SECTIONS[h.colecao]?.title||h.colecao||'—'}</div></div>
      <div class="db-ri-val" style="color:var(--text-muted);font-weight:400;font-size:11px">${fmtDate(h.timestamp)}</div>
    </div>`;
  }).join('');

  // Alert items
  const alrtItems=(alrtTop.data||[]).slice(0,5).map(a=>`<div class="db-alert-item">
    <div class="db-alert-dot"></div>
    <div class="db-alert-body"><div class="ab-name">${a['Cliente']||'—'}</div><div class="ab-sub">${a['Tipo']||'—'} · ${a['Responsável']||'—'}</div></div>
    <div class="db-alert-days">${a['DiasAtraso']!=null?a['DiasAtraso']+'d':'—'}</div>
  </div>`).join('');

  // Populate _dbCache for drawer details
  _dbCache={
    receita:{title:`Receita ${receitaMesLabel}`,kpis:[{label:'Total',val:receitaMes>0?receitaMes.toFixed(0)+'€':'0€',color:'var(--primary-text)'},{label:'Registos',val:nPagConfirmados,color:'var(--success)'}],
      rows:pagUltimoMes.map(r=>({name:r['Cliente']||'—',sub:r['Modalidade']||'—',badge:parseFloat(r['Valor Pago'])>0?parseFloat(r['Valor Pago']).toFixed(0)+'€':'—',bc:'rgba(22,163,74,.1)',tc:'var(--success)'}))},
    atraso:{title:`Sem registo em ${receitaMesLabel}`,kpis:[{label:'Clientes',val:emAtrasoN,color:'var(--danger)'}],
      rows:semConfirmacao.map(r=>{const sc=(r['Cliente']||'').replace(/'/g,"\\'");return{name:r['Cliente']||'—',sub:`Plano: ${r['Plano Actual']||'—'} · ${motColAtual}: ${r[motColAtual]||0}€`,badge:'Sem registo',bc:'rgba(220,38,38,.1)',tc:'var(--danger)',link:`_dbCloseDetail();openClienteDetalhe('${sc}')`}})},

async function _dbDireccao(el){
  const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const now=new Date(); const mi=now.getMonth(); const curMonth=MONTHS[mi];
  const ytdMonths=MONTHS.slice(0,mi+1);
  const curQ=`Q${Math.ceil((mi+1)/3)} ${now.getFullYear()}`;
  const[pag,vl,vb,pipe,conv,alrt]=await Promise.all([
    _SB.from('pag_clientes_2026').select('*'),
    _SB.from('vendas_log').select('*'),
    _SB.from('vendas_bonus').select('*'),
    _SB.from('pipeline').select('*'),
    _SB.from('conversoes').select('*'),
    _SB.from('alertas').select('*',{count:'exact',head:true})
  ]);
  const pagRows=pag.data||[];
  const receitaMes=pagRows.filter(r=>r['Mês']===curMonth&&r['Estado']==='Pago').reduce((s,r)=>s+(parseFloat(r['Valor Pago'])||0),0);
  const receitaYTD=pagRows.filter(r=>ytdMonths.includes(r['Mês'])&&r['Estado']==='Pago').reduce((s,r)=>s+(parseFloat(r['Valor Pago'])||0),0);
  const pipeAberto=(pipe.data||[]).filter(r=>r['Aberta/Fechada']==='Aberta').length;
  const convTotal=(conv.data||[]).length;
  const vendasQ=(vl.data||[]).filter(r=>r['Trimestre']===curQ);
  const bonusCols=Object.keys(((vb.data||[])[0])||{}).filter(k=>k.startsWith(curQ));
  const bonusCol=bonusCols[0];
  const bonusMap={};
  (vb.data||[]).filter(r=>r['Professor']&&r['Professor']!=='TOTAL').forEach(r=>{bonusMap[r['Professor']]=parseFloat(r[bonusCol])||0;});
  const perfMap={};
  vendasQ.forEach(r=>{
    const p=r['Professor']||'—';
    if(!perfMap[p]) perfMap[p]={nome:p,n:0,bonus:bonusMap[p]||0};
    perfMap[p].n++;
  });
  const perfRows=Object.values(perfMap).sort((a,b)=>b.n-a.n).slice(0,8)
    .map(r=>[r.nome,r.n,r.bonus>0?`${r.bonus.toFixed(0)}€`:'—']);
  const cards=[
    _dbKpiCard(`Receita ${curMonth}`,`${receitaMes.toFixed(0)}€`,'pag_clientes_2026','green'),
    _dbKpiCard('Receita YTD',`${receitaYTD.toFixed(0)}€`,`Jan – ${curMonth}`,'purple'),
    _dbKpiCard('Pipeline Aberto',pipeAberto,'oportunidades','blue',"navigate('pipeline')"),
    _dbKpiCard('Alertas Ativos',alrt.count||0,'','amber',"navigate('alertas')"),
    _dbKpiCard('Conversões Total',convTotal,'','green',"navigate('conversoes')"),
  ].join('');
  el.innerHTML=`
    <div class="page-header"><div><h1>Dashboard — Direcção</h1><div class="subtitle">Bem-vindo, ${currentUser.name}</div></div></div>
    <div class="stats-grid">${cards}</div>
    ${_dbMiniTable(`Performance Equipa — ${curQ}`,['Colaborador','Nº Vendas','Bónus'],perfRows,'Sem dados para este trimestre')}
    <div class="db-section" style="display:flex;align-items:center;justify-content:space-between">
      <div class="db-section-title" style="margin:0">Totais de Pagamentos</div>
      <button class="btn btn-ghost btn-sm" onclick="navigate('totais_pagamentos')">Ver detalhe →</button>
    </div>`;
}

async function _dbComercial(el){
  const now=new Date(); const todayStr=now.toISOString().split('T')[0];
  const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mi=now.getMonth();
  const[lc,pipe,conv,alrt]=await Promise.all([
    _SB.from('log_comercial').select('*').lte('Data Próxima Ação',todayStr).order('Data Próxima Ação',{ascending:true}),
    _SB.from('pipeline').select('*').order('Data',{ascending:false}).limit(20),
    _SB.from('conversoes').select('*'),
    _SB.from('alertas').select('*',{count:'exact',head:true})
  ]);
  const TERMINAIS=['Fechado','Convertido','Cancelado','Perdido'];
  const followups=(lc.data||[]).filter(r=>!TERMINAIS.includes(r['Status']||''));
  const pipeAberto=(pipe.data||[]).filter(r=>r['Aberta/Fechada']==='Aberta');
  const convMes=(conv.data||[]).filter(r=>{
    const d=new Date(r['Data']||r['Data Conversão']||'');
    return !isNaN(d)&&d.getMonth()===mi&&d.getFullYear()===now.getFullYear();
  }).length;
  const cards=[
    _dbKpiCard('Pipeline Aberto',pipeAberto.length,'oportunidades','blue',"navigate('pipeline')"),
    _dbKpiCard('Follow-ups em Atraso',followups.length,'','amber'),
    _dbKpiCard(`Conversões ${MONTHS[mi]}`,convMes,'','green',"navigate('conversoes')"),
    _dbKpiCard('Alertas Ativos',alrt.count||0,'','amber',"navigate('alertas')"),
  ].join('');
  const lcRows=followups.slice(0,8).map(r=>[
    `<span style="color:var(--danger);font-size:11px">${r['Data Próxima Ação']||'—'}</span>`,
    r['Cliente']||`ON ${r['Nº ON']||''}`,
    r['Ação']||r['Motivo']||r['Notas']||'—',r['Status']||'—'
  ]);
  const pipeRows=pipeAberto.slice(0,8).map(r=>[
    r['Cliente']||'—',r['Serviço']||r['Produto']||'—',
    r['Valor']?`${parseFloat(r['Valor']).toFixed(0)}€`:'—',r['Data']||'—'
  ]);
  el.innerHTML=`
    <div class="page-header"><div><h1>Dashboard — Comercial</h1><div class="subtitle">Bem-vindo, ${currentUser.name}</div></div></div>
    <div class="stats-grid">${cards}</div>
    <div class="db-grid-2">
      ${_dbMiniTable('Follow-ups Pendentes',['Data','Cliente','Ação','Estado'],lcRows,'Nenhum follow-up em atraso')}
      ${_dbMiniTable('Oportunidades Abertas',['Cliente','Serviço','Valor','Data'],pipeRows,'Sem oportunidades abertas')}
    </div>`;
}

      _SB.from('servicos').select('*').neq('Estado do serviço','Concluído'),
      _SB.from('avaliacoes').select('*').gte('Data',todayStr).lte('Data',in7Str),
      _SB.from('v_alertas').select('*',{count:'exact',head:true})

    const allServs=servs.data||[];
    const allAvals=avals.data||[];
    const tecnicos=[...new Set(allServs.map(r=>r['Técnico Responsável']).filter(Boolean))];
    const cards=[
      _dbKpiCard('Serviços Ativos',allServs.length,'total equipa','green',"navigate('servicos')"),
      _dbKpiCard('Avaliações (7 dias)',allAvals.length,'','blue',"navigate('avaliacoes')"),
      _dbKpiCard('Técnicos com Serviços',tecnicos.length,'','purple',"navigate('servicos')"),
      _dbKpiCard('Alertas Técnicos',alrts.count||0,'','amber',"navigate('alertas')"),

// ── IMPORTAÇÃO DE FATURAÇÃO ──────────────────────────────────────────────────
const _MESES_NUM = {'01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho','07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'};
const _MESES_ABBR = {'Jan':'01','Fev':'02','Mar':'03','Abr':'04','Mai':'05','Jun':'06','Jul':'07','Ago':'08','Set':'09','Out':'10','Nov':'11','Dez':'12'};

function _parseFaturacaoCSV(text){
  // Normalize line endings
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  // Find header row: contains NIF;Nome;Data
  let headerIdx = -1;
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('NIF') && lines[i].includes('Nome') && lines[i].includes('Data')){
      headerIdx=i; break;
    }
  }
  if(headerIdx<0) throw new Error('Cabeçalho não encontrado no ficheiro CSV');
  const headers = lines[headerIdx].split(';').map(h=>h.trim().replace(/^"|"$/g,''));
  const rows=[];
  for(let i=headerIdx+1;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;
    const parts=line.split(';').map(v=>v.trim().replace(/^"|"$/g,''));
    if(parts.length<3) continue;
    const row={};
    headers.forEach((h,j)=>{ row[h]=parts[j]||''; });
    rows.push(row);
  }
  return rows;
}

function _groupFaturacaoRows(rows){
  // Returns Map: key=`${NIF}|${mesKey}` → {NIF, Nome, mesKey, mesNome, total, docs:[]}
  const map = new Map();
  rows.forEach(r=>{
    const nif = (r['NIF']||'').trim();
    if(!nif || nif==='999999990' || nif==='Consumidor Final') return;
    const tipo = (r['Tipo']||r['Tip']||'').trim().toUpperCase();
    // Only FR, FS, NC
    if(!['FR','FS','NC'].includes(tipo)) return;
    // Parse date dd/mm/yyyy or dd-mm-yyyy
    const dataStr = r['Data']||'';
    const dm = dataStr.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
    if(!dm) return;
    const mesNum = dm[2]; // "05"
    const ano = dm[3];
    const mesKey = `${_MESES_NUM[mesNum]||mesNum} ${ano}`;
    const mapKey = `${nif}|${mesKey}`;
    // Parse value: comma decimal separator
    const valorStr = (r['Valor liquido']||r['Valor líquido']||r['Valor Liquido']||r['Valor']||'0').replace(/\./g,'').replace(',','.');
    let valor = parseFloat(valorStr)||0;
    if(tipo==='NC') valor = -Math.abs(valor);
    const nome = (r['Nome']||'').trim();
    if(!map.has(mapKey)){
      map.set(mapKey,{NIF:nif,Nome:nome,mesKey,mesNum,ano,total:0,docs:[]});
    }
    const entry = map.get(mapKey);
    entry.total += valor;
    entry.docs.push({tipo, num:r['Número']||r['Numero']||'', valor});
  });
  return map;
}

async function _ensurePDFjs(){
  if(window.pdfjsLib) return;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=res; s.onerror=()=>rej(new Error('Falha ao carregar PDF.js'));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function _parseFaturacaoPDF(file){
  await _ensurePDFjs();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  const rows=[];
  let curNIF='', curNome='';

  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1});
    const tc=await page.getTextContent();

    // Group text items by y (top-down, 3px tolerance)
    const groups=new Map();
    tc.items.forEach(item=>{
      if(!item.str.trim()) return;
      const y=Math.round((vp.height-item.transform[5])/3)*3;
      if(!groups.has(y)) groups.set(y,[]);
      groups.get(y).push({x:item.transform[4],str:item.str.trim()});
    });

    // Process lines top to bottom
    [...groups.keys()].sort((a,b)=>a-b).forEach(y=>{
      const items=groups.get(y).sort((a,b)=>a.x-b.x);
      const texts=items.map(i=>i.str).filter(Boolean);
      if(!texts.length) return;

      // Client header: first token is 9-digit NIF
      if(/^\d{9}$/.test(texts[0])){
        curNIF=texts[0];
        curNome=texts.slice(1).join(' ').trim();
        return;
      }

      // Transaction line: first token is dd/mm/yyyy
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(texts[0])||!curNIF) return;
      const tipo=(texts[1]||'').toUpperCase();
      if(!['FR','FS','NC'].includes(tipo)) return;

      // From right, find consecutive numeric tokens: qty, valorLiq, valor, iva, pct
      let numStart=texts.length;
      for(let i=texts.length-1;i>=4;i--){
        if(/^-?[\d]+[,.]?[\d]*$/.test(texts[i])) numStart=i;
        else break;
      }
      const nums=texts.slice(numStart);
      // nums[0]=qty, nums[1]=valorLiq, nums[2]=valor, nums[3]=iva
      const valorLiq=nums.length>=2?nums[1]:(nums[0]||'0');

      rows.push({
        NIF:curNIF, Nome:curNome,
        Data:texts[0], Tipo:tipo,
        Número:texts[2]||'',
        'Cod.':texts[3]||'',
        Descrição:texts.slice(4,numStart).join(' '),
        Quantidade:nums[0]||'1',
        'Valor líquido':valorLiq,
        Valor:nums[2]||'',
        IVA:nums[3]||''
      });
    });
  }
  if(!rows.length) throw new Error('Nenhuma linha de transação encontrada no PDF');
  return rows;
}

  try{
    await _importStep2(_csvParsedRows);
