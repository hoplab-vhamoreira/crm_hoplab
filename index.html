    <div id="rm-matr" style="display:none">${_mkTable(colsM,Array.isArray(matr)?matr:[])}</div>`;
}
function switchGtab(btn,id,panels){
  btn.closest('.gtab-wrap').querySelectorAll('.gtab').forEach(b=>b.classList.remove('gtab-active'));
  btn.classList.add('gtab-active');
  (panels||['rm-resp','rm-matr']).forEach(k=>{const el=document.getElementById(k);if(el)el.style.display=k===id?'':'none';});
}

// 
// CALCULADORA DE SERVIÇOS
// 
let _calcProposta = []; // [{nome,codigo,pvpBase,pvpPromo,sinal,desc}]
let _calcPrecarioData = [];
let _calcDestinatarios = null; // cache {cli:[],pip:[]}
let _calcEnvTab = 'cli'; // 'cli' | 'pip'
let _calcPickerAction = 'enviar'; // 'enviar' | 'aplicar'
const _EVAL_CODES = new Set(['AM','AMP','AMR','PE','PEP','PP','PV']);
let _calcDescontoId = null;
let _calcDescontosCache = [];

async function renderCalculadora(el){
  el.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar preçário...</div>`;
  // sempre recarrega do servidor para apanhar edições recentes
  delete sectionData['precario_publico'];
  const pr=await api('/api/data/precario_publico');
  sectionData['precario_publico']=pr;
  // só serviços com preço numérico positivo — exclui linhas de cabeçalho e tabelas internas
  _calcPrecarioData=Array.isArray(pr)?pr.filter(p=>{const v=parseFloat(p['PVP Base (c/IVA)']);return p['Serviço']&&p['Código']&&!isNaN(v)&&v!==0;}):[];
  const {data:_dsD}=await _SB.from('descontos').select('*').eq('ativo',true).order('nome');
  _calcDescontosCache=(_dsD||[]).filter(d=>d.valor!=null&&d.valor>0);

  el.innerHTML=`
    <div class="page-header"><div><h1>Calculadora de Serviços</h1><div class="subtitle">Constrói uma proposta a partir do preçário</div></div></div>
    <div class="gtab-wrap" style="margin-bottom:20px">
      <button class="gtab gtab-active" id="calc-tab-btn" onclick="switchGtab(this,'calc-main',['calc-main','calc-precario','calc-descontos']);_renderCalcLista()">Calculadora</button>
      <button class="gtab" onclick="switchGtab(this,'calc-precario',['calc-main','calc-precario','calc-descontos']);_renderCalcPrecario()">Preçário</button>
      <button class="gtab" onclick="switchGtab(this,'calc-descontos',['calc-main','calc-precario','calc-descontos']);_renderCalcDescontos()">Descontos</button>
    </div>
    <div id="calc-descontos" style="display:none"></div>
    <div id="calc-main">
      <div style="display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start">
        <div>
          <input type="text" id="calc-search" placeholder="Filtrar serviços..." oninput="_filterCalcLista()"
            style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:14px">
          <div id="calc-lista"></div>
        </div>
        <div style="position:sticky;top:20px">
          <div id="calc-proposta"></div>
        </div>
      </div>
    </div>
    <div id="calc-precario" style="display:none"></div>`;

  _renderCalcLista();
  _renderCalcProposta();
}

function _filterCalcLista(){
  const q=(document.getElementById('calc-search')||{}).value||'';
  _renderCalcLista(q);
}

function _renderCalcLista(search=''){
  const el=document.getElementById('calc-lista');
  if(!el) return;
  const q=search.toLowerCase();
  const items=_calcPrecarioData.filter(p=>p['Código']!=='CRED-AMR'&&(!q||p['Serviço'].toLowerCase().includes(q)||p['Código'].toLowerCase().includes(q)));
  if(!items.length){el.innerHTML=`<div class="tl-empty">Sem serviços encontrados.</div>`;return;}
  el.innerHTML=items.map(p=>{
    const base=parseFloat(p['PVP Base (c/IVA)'])||0;
    const promo=parseFloat(p['PVP Promocional (c/IVA)'])||base;
    const poupar=base-promo;
    const isCredit=base<0;
    const jaAdic=_calcProposta.some(x=>x.codigo===p['Código']);
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:6px;background:${isCredit?'rgba(var(--success-rgb,34,197,94),.07)':'var(--surface)'};border:1px solid ${isCredit?'rgba(var(--success-rgb,34,197,94),.3)':'var(--border)'};border-radius:10px;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px">${isCredit?' ':''} ${p['Serviço']}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">
          <span style="background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:monospace">${p['Código']}</span>
          ${isCredit
            ? `<span style="color:var(--success);font-weight:600;margin-left:8px">${base.toFixed(0)}€</span>`
            : promo<base
              ? `<span style="color:var(--success);margin-left:8px">↓ ${promo.toFixed(0)}€</span><span style="color:var(--text-muted);text-decoration:line-through;margin-left:4px;font-size:10px">${base.toFixed(0)}€</span>`
              : ` <span style="color:var(--text)">${base.toFixed(0)}€</span>`}
          ${poupar>0?`<span style="color:var(--primary-text);font-weight:600;margin-left:6px">-${poupar.toFixed(0)}€</span>`:''}
        </div>
        ${isCredit&&p['Descrição']?`<div style="font-size:11px;color:var(--text-muted);margin-top:3px;font-style:italic">${p['Descrição']}</div>`:''}
      </div>
      <button onclick="_calcAddServico('${p['Código'].replace(/'/g,"\\'")}','${p['Serviço'].replace(/'/g,"\\'")}',${base},${promo},${parseFloat(p['Sinal'])||0})"
        class="btn btn-sm ${jaAdic?'btn-ghost':isCredit?'btn-ghost':'btn-primary'}" ${jaAdic?'disabled':''}
        style="${isCredit&&!jaAdic?'border-color:var(--success);color:var(--success)':''}">
        ${jaAdic?' Aplicado':isCredit?'+ Aplicar':'+ Adicionar'}
      </button>
    </div>`;
  }).join('');
}

function _calcAddServico(codigo,nome,pvpBase,pvpPromo,sinal){
  if(_calcProposta.some(x=>x.codigo===codigo)) return;
  const prec=_calcPrecarioData.find(p=>p['Código']===codigo);
  const desc=(prec&&prec['Descrição'])||'';
  _calcProposta.push({codigo,nome,pvpBase,pvpPromo,sinal,desc});
  _renderCalcLista((document.getElementById('calc-search')||{}).value||'');
  _renderCalcProposta();
  // Quando se adiciona a Inscrição, perguntar sobre o AMR incluído
  if(codigo==='INSC-STUDIO') _calcPromptTrocaAMR();
}

function _calcPromptTrocaAMR(){
  // Verificar se já há alguma avaliação ou crédito de troca na proposta
  const jaTemEval=_calcProposta.some(x=>_EVAL_CODES.has(x.codigo));
  const jaTemCredito=_calcProposta.some(x=>x.codigo==='CRED-AMR');
  if(jaTemEval||jaTemCredito) return; // já escolheu
  // Mostrar banner de aviso na proposta (já está renderizado, injetar)
  const el=document.getElementById('calc-proposta');
  if(!el) return;
  const banner=document.createElement('div');
  banner.id='calc-amr-prompt';
  banner.style.cssText='margin-top:10px;padding:12px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.35);border-radius:10px;font-size:13px';
  banner.innerHTML=`
    <div style="font-weight:700;margin-bottom:6px">AMR incluído na Inscrição</div>
    <div style="color:var(--text-muted);margin-bottom:10px">A inscrição inclui uma Avaliação Metabólica de Repouso (AMR). Pretende manter o AMR ou trocar por outra avaliação?</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="_calcEscolherAMR('manter')">Manter AMR</button>
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="_calcEscolherAMR('trocar')">Trocar por outra avaliação</button>
    </div>`;
  el.appendChild(banner);
}

function _calcEscolherAMR(opcao){
  const b=document.getElementById('calc-amr-prompt');if(b)b.remove();
  if(opcao==='manter'){
    // AMR já incluído na inscrição — não adicionar nada, só fechar o prompt
    _renderCalcProposta();
    toast('AMR mantido — incluído na inscrição','success');
  } else {
    // Trocar: adicionar o crédito e scrollar para a secção de avaliações
    const credPrec=_calcPrecarioData.find(p=>p['Código']==='CRED-AMR');
    if(credPrec&&!_calcProposta.some(x=>x.codigo==='CRED-AMR')){
      const base=parseFloat(credPrec['PVP Base (c/IVA)'])||0;
      _calcProposta.push({codigo:'CRED-AMR',nome:credPrec['Serviço'],pvpBase:base,pvpPromo:base,sinal:0,desc:credPrec['Descrição']||''});
    }
    _renderCalcLista('');
    _renderCalcProposta();
    // Focar a pesquisa em avaliações
    const si=document.getElementById('calc-search');
    if(si){si.value='aval';si.dispatchEvent(new Event('input'));}
    toast('Crédito de troca aplicado — escolhe agora a avaliação ou pack','success');
  }
}

function _calcRemoveServico(codigo){
  _calcProposta=_calcProposta.filter(x=>x.codigo!==codigo);
  _renderCalcLista((document.getElementById('calc-search')||{}).value||'');
  _renderCalcProposta();
}

function _renderCalcProposta(){
  const el=document.getElementById('calc-proposta');
  if(!el) return;
  if(!_calcProposta.length){
    el.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--text-muted);font-size:13px">
      Adiciona serviços para construir a proposta
    </div>`;
    return;
  }
  const totalServicos=_calcProposta.filter(x=>x.pvpBase>=0).reduce((s,x)=>s+x.pvpPromo,0);
  const totalCreditos=_calcProposta.filter(x=>x.pvpBase<0).reduce((s,x)=>s+x.pvpBase,0);
  const totalBase=_calcProposta.filter(x=>x.pvpBase>=0).reduce((s,x)=>s+x.pvpBase,0);
  const totalPromo=totalServicos+totalCreditos;
  const totalSinal=_calcProposta.filter(x=>x.pvpBase>=0).reduce((s,x)=>s+x.sinal,0);
  const poupanca=totalBase-totalServicos;
  const descSel=_calcDescontosCache.find(d=>d.id===_calcDescontoId)||null;
  const descVal=descSel?(descSel.tipo_valor==='fixo'?Math.min(descSel.valor,totalPromo):totalPromo*(descSel.valor/100)):0;
  const totalFinal=totalPromo-descVal;

  // CRED-AMR só pode ser aplicado com avaliação ou pack de avaliação
  const hasCredit=_calcProposta.some(x=>x.codigo==='CRED-AMR');
  const hasEval=_calcProposta.some(x=>_EVAL_CODES.has(x.codigo));
  const creditBlocked=hasCredit&&!hasEval;

  const rows=_calcProposta.map(x=>{
    const isCredit=x.pvpBase<0;
    return`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)${isCredit?';background:rgba(34,197,94,.05);border-radius:6px;padding-left:6px;padding-right:6px':''}">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:${isCredit?'var(--success)':'inherit'}">${isCredit?' ':''}${x.nome}</div>
        <div style="font-size:11px;color:var(--text-muted);font-family:monospace">${x.codigo}</div>
        ${isCredit
          ?`<div style="font-size:12px;color:var(--success);font-weight:600;margin-top:2px">${x.pvpBase.toFixed(0)}€</div>`
          :x.pvpPromo<x.pvpBase
            ?`<div style="font-size:12px;margin-top:2px"><span style="color:var(--success);font-weight:600">${x.pvpPromo.toFixed(0)}€</span> <span style="text-decoration:line-through;color:var(--text-muted)">${x.pvpBase.toFixed(0)}€</span></div>`
            :`<div style="font-size:12px;color:var(--text);margin-top:2px">${x.pvpBase.toFixed(0)}€</div>`}
        ${x.sinal>0?`<div style="font-size:11px;color:var(--text-muted)">Sinal: ${x.sinal.toFixed(0)}€</div>`:''}
      </div>
      <button onclick="_calcRemoveServico('${x.codigo.replace(/'/g,"\\'")}')}" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:0 4px;flex-shrink:0" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'"></button>
    </div>`;
  }).join('');

  el.innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:12px">Proposta (${_calcProposta.length} serviço${_calcProposta.length!==1?'s':''})</div>
      ${rows}
      ${creditBlocked?`<div style="margin-top:10px;padding:10px 12px;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.4);border-radius:8px;font-size:12px;color:var(--text)">
         O <strong>Crédito Troca AMR</strong> só pode ser aplicado com uma avaliação ou pack de avaliação (AM, AMP, AMR, PE, PEP, PP, PV). Adiciona a avaliação escolhida para continuar.
      </div>`:''}
      <div style="margin-top:14px;padding-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:4px"><span>Subtotal</span><span>${totalServicos.toFixed(0)}€</span></div>
        ${poupanca>0?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--primary-text);margin-bottom:4px"><span>Poupança promo</span><span>-${poupanca.toFixed(0)}€</span></div>`:''}
        ${totalCreditos<0?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--success);margin-bottom:4px"><span>Crédito troca</span><span>${totalCreditos.toFixed(0)}€</span></div>`:''}
        <div style="margin:10px 0 6px">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:4px">Desconto</div>
          <select onchange="_calcSetDesconto(this.value)" style="width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px">
            <option value="">Sem desconto</option>
            ${_calcDescontosCache.map(d=>`<option value="${d.id}" ${d.id===_calcDescontoId?'selected':''}>${d.nome} (${d.tipo_valor==='fixo'?'-'+d.valor+'€':'-'+d.valor+'%'})</option>`).join('')}
          </select>
        </div>
        ${descVal>0?`<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--success);margin-bottom:4px"><span>Desconto (${descSel.nome})</span><span>-${descVal.toFixed(0)}€</span></div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-top:6px;padding-top:8px;border-top:2px solid var(--border)"><span>Total</span><span>${totalFinal.toFixed(0)}€</span></div>
        ${totalSinal>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:6px"><span>Sinal total</span><span>${totalSinal.toFixed(0)}€</span></div>`:''}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="_calcLimpar()">Limpar</button>
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="_calcGerarProposta()" ${creditBlocked?'disabled':''}>Imprimir</button>
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="_calcEnviarProposta()" ${creditBlocked?'disabled':''}>Enviar</button>
        <button class="btn btn-sm" style="width:100%;margin-top:4px;background:var(--success);color:#fff;border:none;font-weight:600" onclick="_calcAplicarFicha()" ${creditBlocked?'disabled':''}>Aplicar à Ficha</button>
      </div>
    </div>`;
}

function _calcSetDesconto(val){
  _calcDescontoId=val?parseInt(val):null;
  _renderCalcProposta();
}

function _calcLimpar(){
  _calcProposta=[];
  _calcDescontoId=null;
  _calcDestinatarios=null;_calcEnvTab='cli';
  _renderCalcLista((document.getElementById('calc-search')||{}).value||'');
  _renderCalcProposta();
}

async function _calcEnviarProposta(){
  if(!_calcProposta.length) return toast('Adiciona pelo menos um serviço','error');
  if(!_calcDestinatarios){
    const [cliRes,pipRes]=await Promise.all([
      api('/api/data/clientes'),
      api('/api/data/pipeline')
    ]);
    const cli=(Array.isArray(cliRes)?cliRes:[]).map(c=>({
      nome:c['Nome']||'',email:c['Email']||'',tel:c['Telemóvel']||'',origem:'Cliente'
    })).filter(c=>c.nome);
    const nomesCli=new Set(cli.map(c=>c.nome));
    const pip=(Array.isArray(pipRes)?pipRes:[])
      .filter(p=>p['Contacto']&&p['Aberta/Fechada']==='Aberta'&&!nomesCli.has(p['Contacto']))
      .map(p=>({nome:p['Contacto'],email:'',tel:'',origem:'Lead',status:p['Status']||'',aberta:p['Aberta/Fechada']||''}))
      .filter((p,i,a)=>a.findIndex(x=>x.nome===p.nome)===i);
    _calcDestinatarios={cli,pip};
  }
  _calcEnvTab='cli';_calcPickerAction='enviar';
  document.getElementById('modalTitle').textContent=' Enviar Proposta';
  document.getElementById('modalBody').innerHTML=`
    <div id="env-step1">
      <div style="display:flex;gap:0;margin-bottom:12px;background:var(--surface2);border-radius:8px;padding:3px">
        <button id="env-tab-cli" onclick="_calcEnvSetTab('cli')"
          style="flex:1;padding:6px 12px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;transition:all .15s">
           Clientes <span id="env-cnt-cli" style="opacity:.75;font-weight:400"></span>
        </button>
        <button id="env-tab-pip" onclick="_calcEnvSetTab('pip')"
          style="flex:1;padding:6px 12px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--text-muted);transition:all .15s">
           Pipeline <span id="env-cnt-pip" style="opacity:.75;font-weight:400"></span>
        </button>
      </div>
      <input type="text" id="env-search" placeholder="Pesquisar..."
        oninput="_calcFiltrarDestinatarios()"
        style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:8px;box-sizing:border-box">
      <div id="env-lista" style="max-height:280px;overflow-y:auto"></div>
    </div>
    <div id="env-step2" style="display:none"></div>`;
  document.getElementById('modalSave').style.display='none';
  document.getElementById('modal').classList.add('show');
  // update counts
  const d=_calcDestinatarios;
  const cc=document.getElementById('env-cnt-cli');
  const cp=document.getElementById('env-cnt-pip');
  if(cc) cc.textContent=`(${d.cli.length})`;
  if(cp) cp.textContent=`(${d.pip.length})`;
  _calcFiltrarDestinatarios();
}

function _calcEnvSetTab(tab){
  _calcEnvTab=tab;
  const btnCli=document.getElementById('env-tab-cli');
  const btnPip=document.getElementById('env-tab-pip');
  if(btnCli){btnCli.style.background=tab==='cli'?'var(--primary)':'transparent';btnCli.style.color=tab==='cli'?'#fff':'var(--text-muted)';}
  if(btnPip){btnPip.style.background=tab==='pip'?'var(--primary)':'transparent';btnPip.style.color=tab==='pip'?'#fff':'var(--text-muted)';}
  const si=document.getElementById('env-search');
  if(si) si.value='';
  _calcFiltrarDestinatarios();
}

function _calcFiltrarDestinatarios(){
  const q=((document.getElementById('env-search')||{}).value||'').toLowerCase();
  const el=document.getElementById('env-lista');
  if(!el||!_calcDestinatarios) return;
  const pool=_calcEnvTab==='cli'?_calcDestinatarios.cli:_calcDestinatarios.pip;
  const items=pool.filter(d=>!q||d.nome.toLowerCase().includes(q)).slice(0,30);
  if(!items.length){el.innerHTML=`<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Sem resultados</div>`;return;}
  const _pickFn=_calcPickerAction==='aplicar'?'_calcSelecionarParaAplicar':'_calcSelecionarDestinatario';
  el.innerHTML=items.map(d=>`
    <div onclick="${_pickFn}(${JSON.stringify(d.nome)},${JSON.stringify(d.email)},${JSON.stringify(d.tel)},${JSON.stringify(d.origem)})"
      style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s"
      onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px">${d.nome}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">
          ${d.email||'<em>sem email</em>'}${d.tel?'&nbsp;·&nbsp;'+d.tel:''}
          ${d.status?`&nbsp;·&nbsp;<span style="color:var(--text-muted)">${d.status}${d.aberta?' · '+d.aberta:''}</span>`:''}
        </div>
      </div>
    </div>`).join('');
}

function _calcSelecionarDestinatario(nome,email,tel,origem){
  document.getElementById('env-step1').style.display='none';
  const step2=document.getElementById('env-step2');
  step2.style.display='';

  const totalBase=_calcProposta.reduce((s,x)=>s+x.pvpBase,0);
  const totalPromo=_calcProposta.reduce((s,x)=>s+x.pvpPromo,0);
  const poupanca=totalBase-totalPromo;

  const linhasTexto=_calcProposta.map(x=>{
    const preco=x.pvpPromo<x.pvpBase?`${x.pvpPromo.toFixed(0)}€ (antes ${x.pvpBase.toFixed(0)}€)`:`${x.pvpBase.toFixed(0)}€`;
    return `• ${x.nome} [${x.codigo}] — ${preco}`+(x.desc?`\n  ${x.desc}`:'');
  }).join('\n');

async function _calcConfirmarAplicar(nome,origem){
  const btn=event.target;btn.disabled=true;btn.textContent='A processar...';
  const hoje=new Date().toISOString().slice(0,10);
  const servicos=_calcProposta.filter(x=>x.pvpBase>=0);
  const totalCreditos=_calcProposta.filter(x=>x.pvpBase<0).reduce((s,x)=>s+x.pvpBase,0);
  const totalPromo=servicos.reduce((s,x)=>s+x.pvpPromo,0)+totalCreditos;

  try{
    // Se for lead: converter em cliente
    if(origem==='Lead'){
      const {data:pipRows}=await _SB.from('pipeline').select('id').eq('Contacto',nome).limit(1);
      if(pipRows&&pipRows.length>0){
        await _SB.from('pipeline').update({'Status':'Ganho','Aberta/Fechada':'Fechada'}).eq('id',pipRows[0].id);
      }
      const clAll=await api('/api/data/clientes');
      const maxID=(Array.isArray(clAll)?clAll:[]).reduce((m,c)=>Math.max(m,parseInt(c['ID'])||0),0);
      await api('/api/data/clientes',{method:'POST',body:{'Nome':nome,'Status':'Ativo','ID':maxID+1}});
      sectionData['clientes']=null;sectionData['pipeline']=null;_calcDestinatarios=null;
    }

    // Criar registo em servicos para cada serviço da proposta
    for(const x of servicos){
      await api('/api/data/servicos',{method:'POST',body:{
        'Cliente':nome,'Serviço':x.nome,
        'Data Conversão':hoje,'Estado do serviço':'Em curso'
      }});
    }
    sectionData['servicos']=null;

    // Registar em log_comercial
    const resumo=servicos.map(x=>x.nome).join(' + ');
    const creditoTexto=totalCreditos<0?` (crédito troca AMR ${totalCreditos.toFixed(0)}€)`:'';
    await api('/api/data/log_comercial',{method:'POST',body:{
      'Contacto':nome,'Data Ação':hoje,'Canal':'Presencial','Tipo Ação':'Reunião',
      'Resumo':`Proposta aplicada: ${resumo}${creditoTexto} — Total ${totalPromo.toFixed(0)}€`,
      'Resultado':'Convertido','Comercial':(currentUser&&currentUser.name)||''
    }});
    sectionData['log_comercial']=null;

    closeModal();
    _calcProposta=[];_calcDestinatarios=null;_calcEnvTab='cli';
    _renderCalcProposta();
    toast(`Proposta aplicada a "${nome}" `,'success');
    setTimeout(()=>openClienteDetalhe(nome),600);
  }catch(e){
    btn.disabled=false;btn.textContent=' Confirmar e Aplicar';
    toast('Erro: '+e.message,'error');
  }
}

          <th style="padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">Cód.</th>

          <th style="padding:8px 12px;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">PVP Base</th>
          <th style="padding:8px 12px;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">Promoção</th>
          <th style="padding:8px 12px;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)">Sinal</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border)">

          </tr>
          ${poupanca>0?`<tr><td colspan="5" style="padding:6px 12px;font-size:12px;color:var(--primary-text);font-weight:600">Poupança total: ${poupanca.toFixed(0)}€</td></tr>`:''}
        </tfoot>
      </table>

  document.getElementById('modalSave').textContent=' Imprimir';
  document.getElementById('modalSave').onclick=()=>window.print();

function _renderCalcPrecario(q=''){
  const el=document.getElementById('calc-precario');
  if(!el) return;
  const fullData=sectionData['precario_publico']||[];
  if(!_calcPrecarioData.length){el.innerHTML=`<div class="tl-empty">Sem dados</div>`;return;}
  const sq=q.toLowerCase();
  const items=_calcPrecarioData.filter(p=>!sq||p['Serviço'].toLowerCase().includes(sq)||p['Código'].toLowerCase().includes(sq)||(p['Categoria']||'').toLowerCase().includes(sq));

  const rows=items.map(p=>{
    const fullIdx=fullData.findIndex(f=>f['Código']===p['Código']&&f['Serviço']===p['Serviço']);
    const base=parseFloat(p['PVP Base (c/IVA)'])||0;
    const promo=parseFloat(p['PVP Promocional (c/IVA)']);
    const temPromo=!isNaN(promo)&&promo>0&&promo<base;
    const uid=`prec-${p['Código'].replace(/[^a-z0-9]/gi,'_')}`;
    return`
      <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden">
        <div onclick="_calcPrecToggle(this)" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:var(--surface)"
          onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='var(--surface)'">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
              <span style="font-weight:700;font-size:14px">${p['Serviço']}</span>
              <span style="font-size:11px;font-family:monospace;background:var(--surface2);padding:1px 6px;border-radius:4px;color:var(--text-muted)">${p['Código']}</span>
              ${p['Categoria']?`<span style="font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:var(--text-muted)">${p['Categoria']}</span>`:''}
            </div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:3px">
              ${p['Tipo de Profissional']?`<span>${p['Tipo de Profissional']}</span>`:''}
              ${p['Duração']?`<span style="margin-left:8px">⏱ ${p['Duração']}</span>`:''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            ${temPromo
              ?`<div style="font-weight:700;color:var(--success)">${promo.toFixed(0)}€</div><div style="font-size:11px;text-decoration:line-through;color:var(--text-muted)">${base.toFixed(0)}€</div>`
              :`<div style="font-weight:700">${base<0?base.toFixed(0)+'€':base.toFixed(0)+'€'}</div>`}
          </div>
          <span class="prec-arrow" style="color:var(--text-muted);font-size:12px;transition:transform .2s;display:inline-block"></span>
        </div>
        <div id="${uid}" style="display:none;padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2)">
          ${p['Descrição']?`<p style="font-size:13px;color:var(--text);margin:0 0 10px">${p['Descrição']}</p>`:'<p style="font-size:13px;color:var(--text-muted);margin:0 0 10px;font-style:italic">Sem descrição — edita para adicionar.</p>'}
          <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:12px">
            ${p['Tipo de Profissional']?`<span> <strong>Profissional:</strong> ${p['Tipo de Profissional']}</span>`:''}
            ${p['Duração']?`<span>⏱ <strong>Duração:</strong> ${p['Duração']}</span>`:''}
            ${p['Sinal']>0?`<span> <strong>Sinal:</strong> ${parseFloat(p['Sinal']).toFixed(0)}€</span>`:''}
            ${temPromo?`<span> <strong>Desconto:</strong> -${(base-promo).toFixed(0)}€</span>`:''}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary btn-sm" onclick="openEdit('precario_publico',${fullIdx});event.stopPropagation()">Editar</button>
            <button class="btn btn-ghost btn-sm del" onclick="deleteRec('precario_publico',${fullIdx});event.stopPropagation()">Eliminar</button>
          </div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
      <input type="text" id="prec-search" placeholder="Pesquisar serviço, código ou categoria..." value="${q}"

    </div>
    ${items.length?rows:`<div class="tl-empty">Sem resultados para "${q}"</div>`}`;
}

  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-size:14px">A carregar descontos...</div>`;

  if(error){el.innerHTML=`<div style="padding:40px;color:var(--danger)">Erro: ${error.message}</div>`;return;}
  const tipoBadge=t=>({cliente:'Tipo de cliente',promocional:'Promocional',servico:'Por serviço'}[t]||t||'—');
  const tipoCor=t=>({cliente:'var(--info)',promocional:'var(--warning)',servico:'var(--success)'}[t]||'var(--text-muted)');
  const valStr=d=>d.valor!=null?(d.tipo_valor==='fixo'?'-'+d.valor+'€':'-'+d.valor+'%'):'variável';
  const cards=(data||[]).map(d=>`
    <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;opacity:${d.ativo?1:.5}">
      <div onclick="_descToggle(this)" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:var(--surface)"
        onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='var(--surface)'">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
            <span style="font-weight:700;font-size:14px">${d.nome}</span>
            ${d.codigo?`<span style="font-size:11px;font-family:monospace;background:var(--surface2);padding:1px 6px;border-radius:4px;color:var(--text-muted)">${d.codigo}</span>`:''}
            <span style="font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--border);color:${tipoCor(d.tipo)};font-weight:600">${tipoBadge(d.tipo)}</span>
            ${!d.ativo?`<span style="font-size:11px;color:var(--text-muted);font-style:italic">Inativo</span>`:''}
          </div>
          ${d.descricao?`<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${d.descricao}</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;font-size:16px;color:${d.valor!=null?'var(--success)':'var(--text-muted)'}">${valStr(d)}</div>
          ${d.data_fim?`<div style="font-size:11px;color:var(--text-muted)">até ${d.data_fim}</div>`:''}
        </div>
        <span style="color:var(--text-muted);font-size:12px;transition:transform .2s;display:inline-block" class="desc-arrow"></span>
      </div>
      <div style="display:none;padding:14px 16px;border-top:1px solid var(--border);background:var(--surface2)">
        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:12px">
          ${d.data_inicio?`<span><strong>Início:</strong> ${d.data_inicio}</span>`:''}
          ${d.data_fim?`<span><strong>Fim:</strong> ${d.data_fim}</span>`:''}
          <span><strong>Estado:</strong> ${d.ativo?'Ativo':'Inativo'}</span>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="abrirEditDesconto(${d.id});event.stopPropagation()">Editar</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="eliminarDesconto(${d.id},'${(d.nome||'').replace(/'/g,"\\'")}');event.stopPropagation()">Eliminar</button>
        </div>
      </div>
    </div>`).join('');
  el.innerHTML=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
      <input type="text" placeholder="Filtrar descontos..." oninput="_filterDescontos(this.value)"
        style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px">
      <button class="btn btn-primary btn-sm" onclick="abrirNovoDesconto()">+ Novo Desconto</button>
    </div>
    <div id="desc-cards">${cards||'<div style="padding:40px;text-align:center;color:var(--text-muted)">Nenhum desconto definido.</div>'}</div>`;
}
function _descontoModal(d){
  const tipos=[['cliente','Tipo de cliente'],['promocional','Promocional'],['servico','Por serviço']];
  const opt=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}"${v===(cur||'')?' selected':''}>${l}</option>`).join('');
  document.getElementById('modalTitle').textContent=d?'Editar Desconto':'Novo Desconto';
  document.getElementById('modalBody').innerHTML=`
    <div class="form-group"><label>Nome</label><input type="text" id="dc_nome" value="${d?.nome||''}"></div>
    <div class="form-group"><label>Código (opcional)</label><input type="text" id="dc_cod" value="${d?.codigo||''}"></div>
    <div class="form-group"><label>Tipo</label><select id="dc_tipo">${opt(tipos,d?.tipo)}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Valor</label><input type="number" id="dc_val" step="0.01" min="0" value="${d?.valor??''}"></div>
      <div class="form-group"><label>Unidade</label><select id="dc_tval"><option value="pct"${(d?.tipo_valor||'pct')==='pct'?' selected':''}>% (percentagem)</option><option value="fixo"${d?.tipo_valor==='fixo'?' selected':''}>€ (valor fixo)</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Data início (opcional)</label><input type="date" id="dc_ini" value="${d?.data_inicio||''}"></div>
      <div class="form-group"><label>Data fim (opcional)</label><input type="date" id="dc_fim" value="${d?.data_fim||''}"></div>
    </div>
    <div class="form-group"><label>Descrição (opcional)</label><textarea id="dc_desc">${d?.descricao||''}</textarea></div>
    <div class="form-group"><label><input type="checkbox" id="dc_ativo"${(d?.ativo!==false)?' checked':''}> Ativo</label></div>`;
  document.getElementById('modal').classList.add('show');
}
function abrirNovoDesconto(){
  _descontoModal(null);
  document.getElementById('modalSave').onclick=async()=>{
    const nome=document.getElementById('dc_nome').value.trim();
    if(!nome) return toast('Nome obrigatório','error');
    const payload={nome,codigo:document.getElementById('dc_cod').value.trim()||null,tipo:document.getElementById('dc_tipo').value,valor:parseFloat(document.getElementById('dc_val').value)||null,tipo_valor:document.getElementById('dc_tval').value,data_inicio:document.getElementById('dc_ini').value||null,data_fim:document.getElementById('dc_fim').value||null,descricao:document.getElementById('dc_desc').value.trim()||null,ativo:document.getElementById('dc_ativo').checked};
    const{error}=await _SB.from('descontos').insert(payload);
    if(error) return toast('Erro: '+error.message,'error');
    closeModal(); toast('Desconto criado'); _renderCalcDescontos();
  };
}
async function abrirEditDesconto(id){
  const{data,error}=await _SB.from('descontos').select('*').eq('id',id).single();
  if(error||!data) return toast('Erro ao carregar','error');
  _descontoModal(data);
  document.getElementById('modalSave').onclick=async()=>{
    const nome=document.getElementById('dc_nome').value.trim();
    if(!nome) return toast('Nome obrigatório','error');
    const payload={nome,codigo:document.getElementById('dc_cod').value.trim()||null,tipo:document.getElementById('dc_tipo').value,valor:parseFloat(document.getElementById('dc_val').value)||null,tipo_valor:document.getElementById('dc_tval').value,data_inicio:document.getElementById('dc_ini').value||null,data_fim:document.getElementById('dc_fim').value||null,descricao:document.getElementById('dc_desc').value.trim()||null,ativo:document.getElementById('dc_ativo').checked};
    const{error:e}=await _SB.from('descontos').update(payload).eq('id',id);
    if(e) return toast('Erro: '+e.message,'error');
    closeModal(); toast('Desconto atualizado'); _renderCalcDescontos();
  };
}
async function eliminarDesconto(id,nome){
  if(!confirm(`Eliminar desconto "${nome}"?`)) return;
  const{error}=await _SB.from('descontos').delete().eq('id',id);
  if(error) return toast('Erro: '+error.message,'error');
  toast('Desconto eliminado'); _renderCalcDescontos();
}

async function renderAlertas(el){
  el.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar...</div>`;
  const dados = await api('/api/alertas');
  if(!Array.isArray(dados)){ el.innerHTML=`<p style="color:var(--danger);padding:40px">${dados.error||'Erro'}</p>`; return; }
  _alertasTodosDados = dados;
  _renderAlertasView(el, dados);
}

function _renderAlertasView(el, todos){
  const colabs = [...new Set(todos.map(r=>r.Responsável).filter(Boolean))].sort();

  let base = todos;
  if(_alertasColab)  base = base.filter(r=>r.Responsável===_alertasColab);
  if(_alertasSearch){ const q=_alertasSearch.toLowerCase(); base=base.filter(r=>
    (r.Cliente||'').toLowerCase().includes(q)||(r.Detalhe||'').toLowerCase().includes(q)||
    (r.Tipo||'').toLowerCase().includes(q)||(r.Responsável||'').toLowerCase().includes(q)); }

  const tabFiltro = base.filter(_alertasTabFilter(_alertasTab));
  const visivel   = tabFiltro.filter(r=>_alertasPrazoFilter(_alertasPrazo, r));

  const TABS = ['todas','colaborador','pipeline','avaliacoes','gestao','servicos'];
  const counts = {};
  TABS.forEach(k=>{ counts[k] = base.filter(_alertasTabFilter(k)).length; });

  //  Helpers visuais
  const prioBadge = p => {
    if(p===1) return `<span class="badge badge-danger" style="font-size:10px">Alta</span>`;
    if(p===2) return `<span class="badge badge-warn"   style="font-size:10px">Média</span>`;
    return           `<span class="badge"              style="font-size:10px;background:rgba(148,163,184,.15);color:var(--text-muted)">Baixa</span>`;
  };
  const TIPO_ACOES = {
    'Ciclo expirado':                  'Renovar o ciclo do cliente',
    'Contrato em falta':               'Enviar e assinar contrato',
    'Relatório de ciclo por entregar': 'Elaborar e entregar o relatório do ciclo',
    'Forms por preencher':             'Preencher os formulários pendentes',
    'Contrato/Regulamento':            'Verificar e assinar contrato/regulamento',
    'Avaliação Pendente':              'Agendar ou realizar avaliação',
    'Tarefa Colaborador':              'Completar tarefa atribuída',
    'Follow-up Pipeline':              'Fazer follow-up com o cliente',
    'Gestão de Ciclo':                 'Tratar questão de gestão de ciclo',
  };
  const CICLO_CODIGOS = {'GL4':'Gest. Light 4sem','GL12':'Gest. Light 12sem','GI':'Gest. Integral','GP':'Gest. Premium'};
  const detalheDisplay = s => {
    if(!s) return '—';
    return s.replace(/^(GL4|GL12|GI|GP)(\s+#\d+)?/,(_,cod,num)=>(CICLO_CODIGOS[cod]||cod)+(num||''));
  };
  const tipoBadge = t => {
    if(!t) return '—';
    const icon = t.includes('Contrato')?'':t.includes('Avaliação')?'':t.includes('Colaborador')?'':t.includes('Pipeline')?'':t.includes('Gestão')?'':'';
    const label = t.replace(/^[^\s]+\s/,'').trim();
    const acao = TIPO_ACOES[label] || TIPO_ACOES[t] || '';
    return `<span>${icon} <span style="font-size:12px">${label||t}</span>${acao?`<br><span style="font-size:10px;color:var(--text-muted);font-style:italic">${acao}</span>`:''}</span>`;
  };
  const fonteBadge = f => {
    const cor = f==='Colaboradores'?'var(--info)':f==='Pipeline'?'var(--primary)':f==='Avaliações'?'var(--warning)':f==='Gestão'?'#a855f7':'var(--success)';
    return f ? `<span style="font-size:11px;color:${cor};font-weight:600">${f}</span>` : '—';
  };
  const diasCell = r => {
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dl   = r.DataLimite ? new Date(r.DataLimite) : null;
    if(!dl) return '<td style="text-align:right;color:var(--text-muted)">—</td>';
    dl.setHours(0,0,0,0);
    const diff = Math.round((dl - hoje)/(1000*60*60*24));
    if(diff < 0)   return `<td style="text-align:right;color:var(--danger);font-weight:700">${Math.abs(diff)}d atraso</td>`;
    if(diff === 0) return `<td style="text-align:right;color:var(--warning);font-weight:700">Hoje</td>`;
    if(diff <= 7)  return `<td style="text-align:right;color:var(--warning)">${diff}d</td>`;
    return `<td style="text-align:right;color:var(--text-muted)">${diff}d</td>`;
  };

  //  Tabs 
  const TAB_LABELS = {todas:'Todas',colaborador:'Colaborador',pipeline:'Pipeline',avaliacoes:'Avaliações',gestao:'Gestão',servicos:'Serviços'};
  const tabsHtml = TABS.map(k=>`
    <button class="gtab${_alertasTab===k?' gtab-active':''}"
      onclick="_alertasTab='${k}';_renderAlertasView(document.getElementById('mainContent'),_alertasTodosDados)">
      ${TAB_LABELS[k]}${counts[k]>0?` <span style="background:rgba(239,68,68,.15);color:var(--danger);border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:3px">${counts[k]}</span>`:''}
    </button>`).join('');

  //  Filtros de prazo 
  const PRAZO_OPTS = [
    {k:'atrasado',l:' Em atraso'},{k:'hoje',l:' Hoje'},{k:'7d',l:'7 dias'},
    {k:'30d',l:'30 dias'},{k:'todos',l:'Todos'},
  ];
  const prazoHtml = PRAZO_OPTS.map(p=>`
    <button onclick="_alertasPrazo='${p.k}';_renderAlertasView(document.getElementById('mainContent'),_alertasTodosDados)"
      class="gtab${_alertasPrazo===p.k?' gtab-active':''}">
      ${p.l}
    </button>`).join('');

  //  Selector colaborador 
  const colabOpts = [`<option value="">Todos os responsáveis</option>`,
    ...colabs.map(c=>`<option value="${c.replace(/"/g,'&quot;')}" ${_alertasColab===c?'selected':''}>${c}</option>`)
  ].join('');

  //  Linhas 
  const btnStyle = 'padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;font-size:11px';
  const rows = visivel.map(r=>{
    const idx = r._idx;
    const dataStr = r.DataLimite ? fmtDate(r.DataLimite) : '—';
    const safeNome = (r.Cliente||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<tr>
      <td>${tipoBadge(r.Tipo||'')}</td>
      <td style="font-weight:500"><span onclick="openClienteDetalhe('${safeNome}')" style="cursor:pointer;border-bottom:1px dotted var(--text-muted)" title="Abrir ficha do cliente">${r.Cliente||'—'}</span></td>
      <td style="font-size:12px;color:var(--text-muted);max-width:220px">${detalheDisplay(r.Detalhe)}</td>
      <td style="font-size:12px">${r.Responsável||'<span style="color:var(--text-muted)">—</span>'}</td>
      <td style="font-size:12px;white-space:nowrap">${dataStr}</td>
      ${diasCell(r)}
      <td style="text-align:center">${prioBadge(r.Prioridade)}</td>
      <td>${fonteBadge(r.Fonte||'')}</td>
      <td style="white-space:nowrap">
        ${r._source==='manual'
          ? `<button onclick="openEditAlerta(${idx})" style="${btnStyle}" title="Editar"></button>
             <button onclick="resolverAlerta(${idx})" style="${btnStyle};margin-left:4px;color:var(--success)" title="Marcar como resolvido"></button>`
          : `<span style="font-size:10px;color:var(--text-muted);padding:2px 6px;border:1px solid var(--border);border-radius:4px" title="Alerta automático — resolve-se quando o problema é tratado na tabela de origem">auto</span>`}
      </td>
    </tr>`;
  }).join('');

  //  KPIs 
  const nAtrasado = visivel.filter(r=>{ if(!r.DataLimite) return false; const d=new Date(r.DataLimite); d.setHours(0,0,0,0); const h=new Date(); h.setHours(0,0,0,0); return d<h; }).length;
  const nAlta     = visivel.filter(r=>r.Prioridade===1).length;
  const nMedia    = visivel.filter(r=>r.Prioridade===2).length;

  el.innerHTML = `
    <div class="page-header">
      <div><h1>Alertas</h1><div class="subtitle">${todos.length} total · ${visivel.length} visíveis</div></div>
      <button class="btn btn-primary" onclick="openAddAlerta()">Novo Alerta</button>
    </div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <select onchange="_alertasColab=this.value;_renderAlertasView(document.getElementById('mainContent'),_alertasTodosDados)"
        style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px;min-width:200px">
        ${colabOpts}
      </select>
      <input type="text" placeholder="Pesquisar cliente, tipo, detalhe..." value="${_alertasSearch}"
        oninput="_alertasSearch=this.value;_renderAlertasView(document.getElementById('mainContent'),_alertasTodosDados)"
        style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px;flex:1;min-width:200px">
    </div>

    <div class="gtab-wrap" style="margin-bottom:10px;flex-wrap:wrap">${prazoHtml}</div>
    <div class="gtab-wrap" style="margin-bottom:20px;flex-wrap:wrap">${tabsHtml}</div>

    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px">
        <div style="font-size:11px;color:var(--text-muted)">Em atraso</div>
        <div style="font-size:22px;font-weight:700;color:var(--danger)">${nAtrasado}</div>
      </div>
      <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px">
        <div style="font-size:11px;color:var(--text-muted)">Alta prioridade</div>
        <div style="font-size:22px;font-weight:700;color:var(--warning)">${nAlta}</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px">
        <div style="font-size:11px;color:var(--text-muted)">Média prioridade</div>
        <div style="font-size:22px;font-weight:700">${nMedia}</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 18px;text-align:center;min-width:90px">
        <div style="font-size:11px;color:var(--text-muted)">Visíveis</div>
        <div style="font-size:22px;font-weight:700;color:var(--success)">${visivel.length}</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="tbl-scroll"><table class="tbl">
        <thead><tr>
          <th>Tipo</th><th>Cliente</th><th>Detalhe</th><th>Responsável</th>
          <th>Data Limite</th><th style="text-align:right">Prazo</th>
          <th style="text-align:center">Prioridade</th><th>Categoria</th><th></th>
        </tr></thead>
        <tbody>${rows||`<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">
          ${_alertasTab!=='todas'&&counts[_alertasTab]===0?'Sem alertas nesta categoria. Crie um novo alerta com ':'Sem resultados para os filtros seleccionados.'}
        </td></tr>`}</tbody>
      </table></div>
    </div>`;
}

async function _alertasModalForm(title, rec, onSave){
  const modal  = document.getElementById('modal');
  const colabs = await getLookup('dados_colaboradores','Nome Oficial');
  const cliVals= await getLookup('clientes','Nome');
  const PRIOPTS = [{v:1,l:' Alta'},{v:2,l:' Média'},{v:3,l:' Baixa'}];
  const tipoOpts  = ALERTAS_TIPOS.map(t=>`<option ${rec.Tipo===t?'selected':''}>${t}</option>`).join('');
  const fonteOpts = ALERTAS_FONTES.map(f=>`<option ${rec.Fonte===f?'selected':''}>${f}</option>`).join('');
  const prioOpts  = PRIOPTS.map(p=>`<option value="${p.v}" ${rec.Prioridade===p.v?'selected':''}>${p.l}</option>`).join('');
  const colabOpts = [`<option value="">— Sem responsável —</option>`,
    ...colabs.map(c=>`<option ${rec.Responsável===c?'selected':''}>${c}</option>`)].join('');
  const cliDl = cliVals.map(c=>`<option value="${c.replace(/"/g,'&quot;')}">`).join('');
  const dlVal = rec.DataLimite ? String(rec.DataLimite).slice(0,10) : '';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = `
    <div class="form-group"><label>Tipo</label><select id="al_tipo">${tipoOpts}</select></div>
    <div class="form-group"><label>Categoria</label><select id="al_fonte">${fonteOpts}</select></div>
    <div class="form-group"><label>Cliente</label>
      <input type="text" id="al_cliente" value="${(rec.Cliente||'').replace(/"/g,'&quot;')}" list="dl_al_cli" autocomplete="off" placeholder="Nome do cliente">
      <datalist id="dl_al_cli">${cliDl}</datalist></div>
    <div class="form-group"><label>Detalhe</label>
      <input type="text" id="al_detalhe" value="${(rec.Detalhe||'').replace(/"/g,'&quot;')}" placeholder="Descrição da acção"></div>
    <div class="form-group"><label>Responsável</label><select id="al_resp">${colabOpts}</select></div>
    <div class="form-group"><label>Data Limite</label><input type="date" id="al_dl" value="${dlVal}"></div>
    <div class="form-group"><label>Prioridade</label><select id="al_prio">${prioOpts}</select></div>`;
  document.getElementById('modalSave').onclick = async()=>{
    const body = {
      Tipo:        document.getElementById('al_tipo').value,
      Fonte:       document.getElementById('al_fonte').value,
      Cliente:     document.getElementById('al_cliente').value||null,
      Detalhe:     document.getElementById('al_detalhe').value||null,
      Responsável: document.getElementById('al_resp').value||null,
      DataLimite:  document.getElementById('al_dl').value||null,
      Prioridade:  parseInt(document.getElementById('al_prio').value)||2,
    };
    const res = await onSave(body);
    if(res && (res.ok || res._id || res.id)){
      closeModal(); toast(title+' guardado');
      _alertasTodosDados = null;
      await renderAlertas(document.getElementById('mainContent'));
    } else { toast((res&&res.error)||'Erro ao guardar','error'); }
  };
  modal.classList.add('show');

async function openAddAlerta(){

//  HISTÓRICO DE FATURAÇÃO 
let _fatAnoFilter = 'todos';
let _fatSearch    = '';

async function renderHistoricoFaturacao(el){
  el.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar...</div>`;
  const dados = await api('/api/historico_faturacao');
  if(!Array.isArray(dados)){ el.innerHTML=`<p style="color:var(--danger);padding:40px">${dados.error||'Erro'}</p>`; return; }
  _renderFaturacaoTable(el, dados);
}

function _renderFaturacaoTable(el, dados){
  const MES_ORD = {Janeiro:1,Fevereiro:2,'Março':3,Abril:4,Maio:5,Junho:6,Julho:7,Agosto:8,Setembro:9,Outubro:10,Novembro:11,Dezembro:12};
  const anos = [...new Set(dados.map(r=>r._Ano))].sort((a,b)=>b-a);

  // Filtros
  let filtrado = dados;
  if(_fatAnoFilter !== 'todos') filtrado = filtrado.filter(r=>r._Ano === Number(_fatAnoFilter));
  if(_fatSearch){
    const q = _fatSearch.toLowerCase();
    filtrado = filtrado.filter(r=>
      (r.Cliente||'').toLowerCase().includes(q) ||
      (r['Mês']||'').toLowerCase().includes(q) ||
      (r['Modalidade']||'').toLowerCase().includes(q) ||
      String(r['Nº Doc']||'').toLowerCase().includes(q)
    );
  }

  // Totais
  const totalPagar = filtrado.reduce((s,r)=>s+Number(r['Valor a Pagar']||0),0);
  const totalPago  = filtrado.reduce((s,r)=>s+Number(r['Valor Pago']||0),0);
  const nPendente  = filtrado.filter(r=>r['_Estado_Pag']==='Pendente'||r['_Estado_Pag']==='Em Atraso').length;

  const anoOpts = [`<option value="todos" ${_fatAnoFilter==='todos'?'selected':''}>Todos os anos</option>`,
    ...anos.map(a=>`<option value="${a}" ${_fatAnoFilter==a?'selected':''}>${a}</option>`)
  ].join('');

  const rows = filtrado.map(r => {
    const estado = r['_Estado_Pag']||'';
    const estadoMap = {'Pago':'badge-ok','Pendente':'badge-warn','Em Atraso':'badge-danger','Parcial':'badge-info'};
    const badge = `<span class="badge ${estadoMap[estado]||'badge'}" style="font-size:11px">${estado||'—'}</span>`;
    const anoBadge = r._Ano===2026
      ? `<span class="badge badge-ok" style="font-size:10px">2026</span>`
      : `<span class="badge" style="font-size:10px;background:var(--surface3);color:var(--text-muted)">2025</span>`;
    return `<tr>
      <td style="font-size:11px;color:var(--text-muted)">${r['Nº']||'—'}</td>
      <td>${r.Cliente||'—'}</td>
      <td>${r['Mês']||'—'} ${anoBadge}</td>
      <td style="font-size:12px">${r['Modalidade']||'—'}</td>
      <td style="text-align:right;font-weight:600">${r['Valor a Pagar']!=null?Number(r['Valor a Pagar']).toFixed(2)+'€':'—'}</td>
      <td style="text-align:right">${r['Valor Pago']!=null?Number(r['Valor Pago']).toFixed(2)+'€':'—'}</td>
      <td style="text-align:center">${badge}</td>
      <td style="font-size:12px;color:var(--text-muted)">${r['Forma Pagamento']||'—'}</td>
      <td style="font-size:12px;color:var(--text-muted)">${r['Faturar a']||'—'}</td>
      <td style="font-size:12px;color:var(--text-muted)">${r['Nº Doc']||'—'}</td>
      <td class="actions">
        ${r._Ano===2026
          ? `<button onclick="fatEdit(${r._idx})" title="Editar">&#x270F;</button>
             <button class="del" onclick="fatDelete(${r._idx},'${(r.Cliente||'').replace(/'/g,"\\'")}',${r._Ano})" title="Eliminar">&#x1f5d1;</button>`
          : `<button onclick="fatEdit2025(${r._idx})" title="Editar 2025">&#x270F;</button>`
        }
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="page-header">
      <div><h1>Histórico de Faturação</h1>
        <div class="subtitle">${filtrado.length} registos</div>
      </div>
      <button class="btn btn-primary" onclick="fatAdd()">+ Adicionar</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <input type="text" placeholder="Pesquisar cliente, mês, doc..." value="${_fatSearch}"
        oninput="_fatSearch=this.value;renderHistoricoFaturacao(document.getElementById('mainContent'))"
        style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px;min-width:220px">
      <select onchange="_fatAnoFilter=this.value;renderHistoricoFaturacao(document.getElementById('mainContent'))"
        style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:13px">
        ${anoOpts}
      </select>
      <span style="font-size:12px;color:var(--text-muted);margin-left:4px">${nPendente} pendente${nPendente!==1?'s':''}</span>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px">
        <div style="font-size:11px;color:var(--text-muted)">Total a Pagar</div>
        <div style="font-size:18px;font-weight:700">${totalPagar.toFixed(2)}€</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px">
        <div style="font-size:11px;color:var(--text-muted)">Total Pago</div>
        <div style="font-size:18px;font-weight:700;color:var(--success)">${totalPago.toFixed(2)}€</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 16px">
        <div style="font-size:11px;color:var(--text-muted)">Em falta</div>
        <div style="font-size:18px;font-weight:700;color:${(totalPagar-totalPago)>0?'var(--danger)':'var(--success)'}">${(totalPagar-totalPago).toFixed(2)}€</div>
      </div>
    </div>
    <div class="table-wrap">
      <div class="tbl-scroll"><table class="tbl">
        <thead><tr>
          <th>Nº</th><th>Cliente</th><th>Mês</th><th>Modalidade</th>
          <th style="text-align:right">A Pagar</th><th style="text-align:right">Pago</th>
          <th style="text-align:center">Estado</th><th>Forma</th>
          <th>Faturar a</th><th>Nº Doc</th><th>Ações</th>
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="11" style="text-align:center;color:var(--text-muted)">Sem registos</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

async function fatAdd(){
  // Novo registo sempre em 2026
  const sec = SECTIONS['pag_clientes_2026'];

  let html=''; const setups=[];
  for(const f of sec.fields){ const r=await buildFieldHtml(f,''); html+=r.html; if(r.setup) setups.push(r.setup); }
  document.getElementById('modalBody').innerHTML = html;
  runFieldSetups(setups);
  document.getElementById('modalSave').onclick = async()=>{

async function confirmarPagamento(rowId, nomeEsc){
  const{data:rec,error}=await _SB.from('pag_clientes_2026').select('*').eq('id',rowId).single();
  if(error||!rec) return toast('Registo não encontrado','error');
  const formas=['Transferência Multibanco','Débito Direto','Pagamento Mbway','Numerário'];
  const estados=['Pago','Ativo','Suspendeu','Cancelou'];
  const opt=(arr,cur)=>arr.map(v=>`<option${v===cur?' selected':''}>${v}</option>`).join('');
  document.getElementById('modalTitle').textContent=` Confirmar pagamento — ${rec['Mês']||''} · ${nomeEsc}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="form-group"><label>Estado</label>
      <select id="cp_estado">${opt(estados,rec['Estado']||'')}</select></div>
    <div class="form-group"><label>Valor Pago (€)</label>

    <div class="form-group"><label>Forma de Pagamento</label>
      <select id="cp_forma"><option value=""></option>${opt(formas,rec['Forma Pagamento']||'')}</select></div>
    <div class="form-group"><label>Nº Doc</label>
      <input type="text" id="cp_doc" value="${rec['Nº Doc']||''}"></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalSave').onclick=async()=>{
    const updates={
      'Estado':document.getElementById('cp_estado').value,
      'Valor Pago':parseFloat(document.getElementById('cp_valor').value)||null,
      'Forma Pagamento':document.getElementById('cp_forma').value||null,
      'Nº Doc':document.getElementById('cp_doc').value||null,
    };
    const{error:e}=await _SB.from('pag_clientes_2026').update(updates).eq('id',rowId);

    sectionData['pag_clientes_2026']=null;
    closeModal(); toast('Pagamento confirmado ');
    await openClienteDetalhe(nomeEsc);
  };
}

      if(cod.startsWith('AMP')) return `<span class="badge badge-warn" style="font-size:10px">AMP</span>`;
      if(cod.startsWith('AM'))  return `<span class="badge badge-ok" style="font-size:10px">AM</span>`;
      if(cod.startsWith('PV'))  return `<span class="badge" style="font-size:10px;background:var(--primary);color:#fff">PV</span>`;
      if(cod.startsWith('PT'))  return `<span class="badge" style="font-size:10px;background:#6c3483;color:#fff">PT</span>`;
      return `<span class="badge" style="font-size:10px">${cod.split('-')[0]}</span>`;
    };

    let rows = '';
    let hasAny = false;
    for(const r of filtrado){
      const itens = r.DetalheVendas || [];
      if(!itens.length) continue;
      hasAny = true;
      const isCoordenador = r.Cargo === 'Coordenador';
      const threshold = isCoordenador ? 1.0 : 750.0;
      const subtotal = itens.reduce((s,v)=>s+v.valor_siva, 0);
      const tipoLabel = r['Tipo Venda'] || (isCoordenador ? 'PT Mensalidades' : 'Avaliações Lab');
      const countLabel = isCoordenador
        ? `${itens.length} PT mensalidade${itens.length!==1?'s':''}`
        : `${itens.length} avaliação${itens.length!==1?'ões':''}`;
      rows += `<tr style="background:var(--surface2)">
        <td colspan="5" style="font-weight:700;padding:8px 12px;font-size:12px;color:var(--text-muted)">
          ${r.Professor}
          <span style="background:var(--surface3);border-radius:4px;padding:1px 6px;margin-left:6px;font-size:11px">${r.Cargo}</span>
          <span style="color:var(--primary-text);margin-left:6px;font-size:11px">${tipoLabel}</span>
          &nbsp;·&nbsp; ${countLabel} &nbsp;·&nbsp;
          <strong style="color:${subtotal>threshold?'var(--success)':'var(--text)'}">${subtotal.toFixed(2)}€ s/IVA</strong>
        </td></tr>`;
      for(const v of itens){
        rows += `<tr>
          <td style="padding-left:24px">${codBadge(v.codigo)} ${v.codigo}</td>
          <td>${v.cliente||'—'}</td>
          <td style="font-size:12px;color:var(--text-muted)">${v.servico||'—'}</td>
          <td style="font-size:12px;color:var(--text-muted)">${v.data||'—'}</td>
          <td style="text-align:right"><strong>${v.valor_total?v.valor_total.toFixed(0)+'€':''}</strong>
            <span style="color:var(--text-muted);font-size:11px"> → ${v.valor_siva.toFixed(2)}€ s/IVA</span>
          </td>
        </tr>`;
      }
    }

    const trimestreSel = trimestres.map(t=>`<option value="${t}" ${t===_vendasTrimestre?'selected':''}>${t}</option>`).join('');
    const profTitle = _vendasDetalheProfFilter
      ? `<span style="margin-left:12px;font-size:13px;font-weight:600;color:var(--primary-text)">${_vendasDetalheProfFilter}</span>
         <button onclick="_vendasDetalheProfFilter=null;_loadVendasTab()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:12px;margin-left:6px"> ver todos</button>`
      : '';
    const emptyMsg = _vendasDetalheProfFilter
      ? `Nenhuma venda registada para ${_vendasDetalheProfFilter} neste trimestre`
      : 'Nenhuma venda registada com "Venda de" preenchido neste trimestre';
    inner.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <label style="font-size:13px;color:var(--text-muted)">Trimestre:</label>
        <select onchange="_vendasDetalheProfFilter=null;_vendasTrimestre=this.value;_loadVendasTab()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px">${trimestreSel}</select>
        ${profTitle}
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Código</th><th>Cliente</th><th>Serviço</th><th>Data</th><th style="text-align:right">Valor</th></tr></thead>
          <tbody>${hasAny?rows:`<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">${emptyMsg}</td></tr>`}</tbody>
        </table>
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-muted)">
        &#x2139;&#xfe0f; Treinador: avaliações (AM*/AMP*/AMR*/PV*) de conversões com "Venda de" preenchido. Coordenador: PT* mensalidades de serviços com "Venda de" preenchido.
      </div>`;

  /*  TAB 3: ANGARIAÇÃO PT/DUO  */
  } else {
    const ang = await api('/api/vendas/angariacoes');
    if(!Array.isArray(ang)){ inner.innerHTML=`<p style="color:var(--danger)">Erro ao carregar</p>`; return; }

    const tipoBadge = t => {
      if(t==='Própria')    return `<span class="badge badge-ok">&#x2713; Própria</span>`;
      if(t==='Referência') return `<span class="badge badge-info">&#x1f517; Referência</span>`;
      return `<span class="badge badge-warn">&#x1f3e2; HOP Angariou</span>`;
    };

    // stats
    const nPropria = ang.filter(r=>r['Tipo Angariação']==='Própria').length;
    const nHop     = ang.filter(r=>r['Tipo Angariação']==='HOP').length;
    const nRef     = ang.filter(r=>r['Tipo Angariação']==='Referência').length;

    const rows = ang.map(r=>{
      const tipo = r['Tipo Angariação'];
      const isHOP = tipo==='HOP';
      const isPropria = tipo==='Própria';
      const treinadorCell = `${r.Treinador||'—'}${isPropria?`<br><span style="font-size:10px;color:var(--success)">&#x2713; vendeu</span>`:''}`;
      const angCell = isHOP
        ? `${tipoBadge(tipo)}<br><span style="font-size:12px;color:var(--warning);font-weight:600">${r['HOP % mês angariação']}%</span>
           <span style="font-size:10px;color:var(--text-muted)"> · ${r['Mês Angariação']}</span>
           ${r['Mês Parcial?']==='Sim'?`<br><span style="font-size:10px;color:var(--primary-text)">Início parcial</span>`:''}`

        </div>

        </div>
      </div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Código</th><th>Cliente</th><th>Serviço</th><th>Treinador</th>
            <th style="text-align:center">Angariação</th><th style="text-align:center">Estado / Início</th>
          </tr></thead>

// BACKOFFICE
async function renderBackoffice(el){
  const users=await api('/api/users');
  const perms=await api('/api/permissions');
  if(users.error){el.innerHTML='<p style="color:var(--danger)">Sem acesso</p>';return;}
  let usersHtml='';
  for(const u of users){
    usersHtml+=`<tr>
      <td>${u.id}</td><td>${u.username}</td><td>${u.name}</td><td>${u.role}</td>
      <td><span style="color:${u.active?'var(--success)':'var(--danger)'}">${u.active?'Ativo':'Inativo'}</span></td>
      <td class="actions">
        <button onclick="editUser(${u.id})" title="Editar">&#x270F;</button>
        <button class="del" onclick="removeUser(${u.id})" title="Eliminar">&#x1f5d1;</button>
      </td></tr>`;
  }
  const roles=Object.keys(perms);
  const allCollections=Object.keys(SECTIONS).filter(k=>k!=='dashboard'&&k!=='backoffice');
  let rolesTabsHtml=roles.map((r,i)=>`<span class="role-tab ${i===0?'active':''}" onclick="switchPermTab('${r}',this)">${r}</span>`).join('');
  let permPanels='';
  for(const role of roles){
    const rp=perms[role]||[];
    permPanels+=`<div class="perm-panel" id="perm_${role}" style="${role!==roles[0]?'display:none':''}"><div class="perm-grid">`;
    for(const c of allCollections){
      const s=SECTIONS[c];
      permPanels+=`<label class="perm-item"><input type="checkbox" data-role="${role}" data-col="${c}" ${rp.includes(c)?'checked':''}> ${s?s.title:c}</label>`;
    }
    permPanels+='</div></div>';
  }
  el.innerHTML=`
    <div class="page-header"><div><h1>&#x2699; Backoffice</h1><div class="subtitle">Gestao de utilizadores e permissoes</div></div></div>
    <h3 style="margin-bottom:16px">Utilizadores</h3>
    <div class="table-wrap" style="margin-bottom:32px">
      <div class="table-toolbar"><strong>Utilizadores</strong><span style="margin-left:auto"><button class="btn btn-primary btn-sm" onclick="addUserModal()">+ Novo Utilizador</button></span></div>
      <table class="tbl"><thead><tr><th>ID</th><th>Username</th><th>Nome</th><th>Role</th><th>Estado</th><th>Acoes</th></tr></thead>
      <tbody>${usersHtml}</tbody></table>
    </div>
    <h3 style="margin-bottom:16px">Permissoes por Role</h3>
    <div style="margin-bottom:12px">${rolesTabsHtml}</div>
    ${permPanels}
    <button class="btn btn-primary" style="margin-top:16px" onclick="savePermissions()">Guardar Permissoes</button>`;
}

function switchPermTab(role,tabEl){
  document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active');
  document.querySelectorAll('.perm-panel').forEach(p=>p.style.display='none');
  document.getElementById('perm_'+role).style.display='';
}

async function savePermissions(){
  const perms={};
  document.querySelectorAll('.perm-item input[type=checkbox]').forEach(cb=>{
    const role=cb.dataset.role, col=cb.dataset.col;
    if(!perms[role]) perms[role]=[];
    if(cb.checked) perms[role].push(col);
  });
  if(perms['Admin']&&!perms['Admin'].includes('backoffice')) perms['Admin'].push('backoffice');
  const resPerm=await api('/api/permissions',{method:'PUT',body:perms});
  if(resPerm?.error){ toast('Erro ao guardar: '+resPerm.error,'error'); return; }
  toast('Permissoes guardadas');
}

async function editUser(uid){
  const users=await api('/api/users');
  const u=users.find(x=>x.id===uid);
  if(!u) return;
  document.getElementById('modalTitle').textContent='Editar Utilizador';
  document.getElementById('modalBody').innerHTML=`
    <div class="form-group"><label>Username</label><input type="text" id="field_username" value="${u.username}"></div>
    <div class="form-group"><label>Nome</label><input type="text" id="field_name" value="${u.name}"></div>
    <div class="form-group"><label>Password</label><input type="password" id="field_password" value="${u.password}" placeholder="Manter atual"></div>
    <div class="form-group"><label>Role</label><select id="field_role">
      ${['Admin','Comercial','Coordenador','Tecnico','Direccao'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}
    </select></div>
    <div class="form-group"><label>Ativo</label><select id="field_active"><option value="true" ${u.active?'selected':''}>Sim</option><option value="false" ${!u.active?'selected':''}>Nao</option></select></div>`;

    const updates={username:document.getElementById('field_username').value,name:document.getElementById('field_name').value,
      password:document.getElementById('field_password').value,role:document.getElementById('field_role').value,
      active:document.getElementById('field_active').value==='true'};
    await api(`/api/users/${uid}`,{method:'PUT',body:updates});
    closeModal();renderBackoffice(document.getElementById('mainContent'));
    toast('Utilizador atualizado');
  };
  document.getElementById('modal').classList.add('show');
}

async function removeUser(uid){
  if(!confirm('Eliminar este utilizador?')) return;
  await api(`/api/users/${uid}`,{method:'DELETE'});
  renderBackoffice(document.getElementById('mainContent'));
  toast('Utilizador eliminado');
}

// PÁGINA DE DETALHE DO CLIENTE
// 
function statusClass(s){
  if(!s) return 'sem';
  const l=s.toLowerCase();
  if(l.includes('cancelado')) return 'cancelado';
  if(l.includes('suspenso')) return 'suspenso';
  if(l.startsWith('ativo')||l.startsWith('híbrido ativo')) return 'ativo';
  if(l.includes('avaliação')) return 'ativo'; // Ativo (Avaliação)
  return 'sem';
}

// Renderiza o status como badge(s): estado base + aviso separado se existir
function renderStatusBadges(s){
  if(!s) return `<span class="cd-status sem">Sem estado</span>`;
  const parts = s.split(' · ');
  const base = parts[0];
  const aviso = parts[1]||null;
  const baseClass = statusClass(base);
  let html = `<span class="cd-status ${baseClass}">${base}</span>`;
  if(aviso){
    html += ` <span class="cd-status alerta" style="margin-left:6px">${aviso}</span>`;
  }
  return html;
}

function fmtDate(d){
  if(!d) return '—';
  const s=String(d).slice(0,10);
  return s||'—';
}

function _codigoToLabel(cod){
  if(!cod) return '—';
  const c=String(cod).trim();
  if(/^PT-?MIX/i.test(c)) return 'PT 1x 30m + 1x 60m';
  const pt=c.match(/^PT(\d+)-(\d+)-\d+/i);
  if(pt) return `PT ${pt[1]}x ${pt[2]} minutos`;
  const cd=c.match(/^CEDDUO(\d+)-(\d+)-\d+/i);
  if(cd) return `CED+DUO ${cd[2]}x ${cd[1]} minutos`;
  const duo=c.match(/^DUO(\d+)-(\d+)-\d+/i);
  if(duo) return `DUO ${duo[2]}x ${duo[1]} minutos`;
  const ced=c.match(/^CED(\d+)-(\d+)-\d+/i);
  if(ced) return `CED ${ced[2]}x ${ced[1]} minutos`;
  return c;
}

function pagBadge(v){
  if(!v||v==='—') return `<span class="badge badge-info">—</span>`;
  if(v.includes('')) return `<span class="badge badge-ok">${v}</span>`;
  if(v.includes('')) return `<span class="badge badge-warn">${v}</span>`;
  if(v.includes('')) return `<span class="badge badge-err">${v}</span>`;
  return `<span class="badge badge-info">${v}</span>`;
}

          :'<div class="md-empty-pane"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span>Seleciona um cliente para ver o detalhe</span></div>'}
      </div>
    </div>`;
  if(_cliSelected) _loadCliDetail(_cliSelected);
}

function openExportClientes(){
  const data=sectionData['clientes']||[];
  const q=_cliFilter.toLowerCase();
  const filtered=data.filter(r=>{
    const matchQ=!q||(r['Nome']||'').toLowerCase().includes(q)||(r['Email']||'').toLowerCase().includes(q);
    const matchS=!_cliStatusFilter||(r['Status']||'').toLowerCase().includes(_cliStatusFilter.toLowerCase());
    return matchQ&&matchS;
  });
  const COLS=[
    {k:'Nome',on:true},{k:'Status',on:true},{k:'Email',on:true},{k:'Telemóvel',on:true},
    {k:'Data de Nascimento',on:false},{k:'NIF',on:false},{k:'Morada',on:false},
    {k:'Localidade',on:true},{k:'Distrito',on:false},{k:'Parceiro',on:false},
    {k:'Segmento',on:false},{k:'PT',on:false},{k:'Nutricionista',on:false},
    {k:'Plano',on:false},{k:'Método Pagamento',on:false},
    {k:'Último Contacto',on:false},{k:'Comentários',on:false},
  ];
  const cid=k=>'exp_'+k.replace(/[^\w]/g,'_');
  document.getElementById('modalTitle').textContent=`Exportar Clientes (${filtered.length} registos)`;
  document.getElementById('modalBody').innerHTML=`
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px">Campos a incluir:</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:12px">
      ${COLS.map(c=>`<label style="display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 0;font-size:13px">
        <input type="checkbox" id="${cid(c.k)}"${c.on?' checked':''}>
        ${c.k}</label>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="document.querySelectorAll('#modalBody input').forEach(i=>i.checked=true)">Selecionar todos</button>
      <button class="btn btn-ghost btn-sm" onclick="document.querySelectorAll('#modalBody input').forEach(i=>i.checked=false)">Limpar</button>
    </div>`;
  const ms=document.getElementById('modalSave');
  ms.textContent='Exportar Excel';
  ms.onclick=()=>{
    const cols=COLS.filter(c=>document.getElementById(cid(c.k))?.checked);
    if(!cols.length){toast('Seleciona pelo menos um campo','error');return;}
    const rows=[cols.map(c=>c.k),...filtered.map(r=>cols.map(c=>r[c.k]??''))];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Clientes');
    XLSX.writeFile(wb,`clientes_${new Date().toISOString().slice(0,10)}.xlsx`);
    closeModal();toast(`${filtered.length} clientes exportados`,'success');
  };
  document.getElementById('modal').classList.add('show');
}

function _filterCliInput(val){
  _cliFilter=val;
  _renderClientesMD(document.getElementById('mainContent'));
  const inp=document.getElementById('cli-search');
  if(inp){inp.focus();inp.setSelectionRange(val.length,val.length);}
}

function _selectCliente(nome){
  _cliSelected=nome;
  sessionStorage.setItem('crm_cli',nome);
  _renderClientesMD(document.getElementById('mainContent'));
}

async function _openCliFullPage(nome){
  const el=document.getElementById('mainContent');
  el.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar ${nome}...</div>`;
  const d=await api(`/api/cliente/${encodeURIComponent(nome)}`);
  if(d.error){el.innerHTML=`<p style="color:var(--danger)">${d.error}</p>`;return;}
  renderClienteDetalhe(el,nome,d,false);
}

async function _loadCliDetail(nome){
  const pane=document.getElementById('cli-detail-pane');
  if(!pane) return;
  pane.innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-muted)">A carregar ${nome}...</div>`;
  const d=await api(`/api/cliente/${encodeURIComponent(nome)}`);
  if(d.error){pane.innerHTML=`<p style="color:var(--danger);padding:24px">${d.error}</p>`;return;}
  renderClienteDetalhe(pane,nome,d,true);
}
